<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Month Document Checker</title>
    
    <!-- Premium Dark + Gold Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D4AF37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Cline x1='16' y1='2' x2='16' y2='6'%3E%3C/line%3E%3Cline x1='8' y1='2' x2='8' y2='6'%3E%3C/line%3E%3Cline x1='3' y1='10' x2='21' y2='10'%3E%3C/line%3E%3Cpath d='M9 16l2 2 4-4'%3E%3C/path%3E%3C/svg%3E">
    
    <style>
        /* ==================================================
           1. DESIGN TOKENS (CSS Variables)
           ================================================== */
        :root {
            /* Backgrounds */
            --bg-primary: #080808;      /* Deep charcoal/black */
            --bg-secondary: #0d0d0d;
            --bg-card: #111111;
            --bg-card-elevated: #151515;
            --bg-input: #0b0b0b;

            /* Gold Accents */
            --gold-primary: #D4AF37;
            --gold-light: #F1D77A;
            --gold-dark: #A8871E;
            --gold-muted: rgba(212, 175, 55, 0.18);
            --gold-glow: rgba(212, 175, 55, 0.08);

            /* Typography */
            --text-primary: #F5F5F5;
            --text-secondary: #B8B8B8;
            --text-muted: #777777;
            
            /* Borders */
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(212, 175, 55, 0.15);
            --border-focus: var(--gold-primary);

            /* UI Elements */
            --btn-clear-bg: #1a1a1a;
            --btn-clear-border: #2a2a2a;
            --btn-clear-hover: #222222;
            
            /* Status Colors (Adjusted for dark/gold premium theme) */
            /* VALID uses primary brand gold */
            --status-valid-accent: var(--gold-primary);
            --status-valid-bg: rgba(212, 175, 55, 0.05);
            --status-valid-badge-bg: rgba(212, 175, 55, 0.12);
            --status-valid-text: var(--gold-light);

            /* EXPIRING SOON uses warm amber */
            --status-soon-accent: #F59E0B;
            --status-soon-bg: rgba(245, 158, 11, 0.05);
            --status-soon-badge-bg: rgba(245, 158, 11, 0.12);
            --status-soon-text: #FBBF24;

            /* EXPIRES TODAY uses strong orange */
            --status-today-accent: #EA580C;
            --status-today-bg: rgba(234, 88, 12, 0.05);
            --status-today-badge-bg: rgba(234, 88, 12, 0.12);
            --status-today-text: #FB923C;

            /* EXPIRED uses deep red */
            --status-expired-accent: #B91C1C;
            --status-expired-bg: rgba(185, 28, 28, 0.05);
            --status-expired-badge-bg: rgba(185, 28, 28, 0.12);
            --status-expired-text: #F87171;
            
            --error-text: #EF4444;
        }

        /* ==================================================
           2. GLOBAL RESET & TYPOGRAPHY
           ================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* Subtle radial gold lighting behind the app */
            background-image: radial-gradient(circle at 50% 25%, rgba(212, 175, 55, 0.05) 0%, var(--bg-primary) 65%);
        }

        /* ==================================================
           3. MAIN CARD
           ================================================== */
        .card {
            background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-secondary) 100%);
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            border: 1px solid var(--border-gold);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.02);
            padding: 36px 32px;
            position: relative;
            z-index: 10;
        }

        /* ==================================================
           4. HEADER
           ================================================== */
        header {
            margin-bottom: 28px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .header-icon {
            color: var(--gold-primary);
        }

        .eyebrow {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--gold-primary);
            font-weight: 600;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .header-divider {
            margin-top: 24px;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, var(--gold-muted) 0%, transparent 100%);
        }

        /* ==================================================
           5. FORM & INPUTS
           ================================================== */
        .field-container {
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .field-controls {
            display: flex;
            gap: 12px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            flex-grow: 1;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            background: var(--bg-input);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        .input-wrapper.input-error {
            border-color: var(--error-text);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        #dateInput {
            flex-grow: 1;
            border: none;
            background: transparent;
            padding: 14px 16px;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
            width: 100%;
            font-variant-numeric: tabular-nums;
        }

        #dateInput::placeholder {
            color: #444444;
        }

        /* ==================================================
           6. CALENDAR PICKER
           ================================================== */
        .calendar-icon-container {
            position: relative;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            flex-shrink: 0;
            border-radius: 0 10px 10px 0;
            transition: background 0.2s, color 0.2s;
        }

        .calendar-icon-container svg {
            transition: color 0.2s, transform 0.2s;
        }

        .calendar-icon-container:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .calendar-icon-container:hover svg {
            color: var(--gold-primary);
            transform: scale(1.05);
        }

        .picker-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* ==================================================
           7. BUTTONS & ERRORS
           ================================================== */
        .btn-clear {
            flex-shrink: 0;
            padding: 0 20px;
            background: var(--btn-clear-bg);
            color: var(--text-secondary);
            border: 1px solid var(--btn-clear-border);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-clear:hover {
            background: var(--btn-clear-hover);
            color: var(--gold-light);
            border-color: var(--border-gold);
        }

        .btn-clear:focus-visible {
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        .error-msg {
            display: none;
            color: var(--error-text);
            font-size: 13px;
            margin-top: 10px;
            font-weight: 500;
            animation: fadeIn 0.2s ease;
        }

        /* ==================================================
           8. EMPTY STATE
           ================================================== */
        .empty-state {
            text-align: center;
            padding: 40px 20px 20px 20px;
            color: var(--text-muted);
            animation: fadeIn 0.3s ease;
        }

        .empty-state-icon {
            color: var(--text-muted);
            opacity: 0.3;
            margin-bottom: 16px;
            transition: color 0.3s ease, opacity 0.3s ease;
        }
        
        .empty-state:hover .empty-state-icon {
            color: var(--gold-primary);
            opacity: 0.6;
        }

        .empty-state p {
            margin: 0;
            font-size: 14px;
        }

        /* ==================================================
           9. RESULT CARD & STATUS STATES
           ================================================== */
        .result-box {
            display: none;
            margin-top: 28px;
            border-radius: 12px;
            padding: 24px;
            background: var(--bg-card-elevated);
            border: 1px solid var(--border-subtle);
            border-left-width: 4px;
            border-left-style: solid;
            animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .result-status {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 12px;
            border-radius: 999px;
            margin-bottom: 16px;
            border: 1px solid transparent;
        }

        .result-message {
            font-size: 15px;
            margin: 0 0 24px 0;
            line-height: 1.5;
            color: var(--text-primary);
        }

        /* Status: VALID */
        .status-valid {
            background-color: var(--status-valid-bg);
            border-left-color: var(--status-valid-accent);
            border-top-color: var(--border-gold);
            border-right-color: var(--border-gold);
            border-bottom-color: var(--border-gold);
        }
        .status-valid .result-status {
            background: var(--status-valid-badge-bg);
            color: var(--status-valid-text);
            border-color: rgba(212, 175, 55, 0.3);
        }

        /* Status: EXPIRING SOON */
        .status-soon {
            background-color: var(--status-soon-bg);
            border-left-color: var(--status-soon-accent);
        }
        .status-soon .result-status {
            background: var(--status-soon-badge-bg);
            color: var(--status-soon-text);
            border-color: rgba(245, 158, 11, 0.3);
        }

        /* Status: EXPIRES TODAY */
        .status-today {
            background-color: var(--status-today-bg);
            border-left-color: var(--status-today-accent);
        }
        .status-today .result-status {
            background: var(--status-today-badge-bg);
            color: var(--status-today-text);
            border-color: rgba(234, 88, 12, 0.3);
        }

        /* Status: EXPIRED */
        .status-expired {
            background-color: var(--status-expired-bg);
            border-left-color: var(--status-expired-accent);
        }
        .status-expired .result-status {
            background: var(--status-expired-badge-bg);
            color: var(--status-expired-text);
            border-color: rgba(185, 28, 28, 0.3);
        }

        /* ==================================================
           10. DETAIL ROWS
           ================================================== */
        .result-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .detail-val {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        /* Premium Emphasis for specific dates */
        #resExpDate, #resDays {
            color: var(--gold-light);
            font-weight: 600;
        }
        
        /* Keep emphasis color aligned with status when expired */
        .status-expired #resExpDate, 
        .status-expired #resDays {
            color: var(--status-expired-text);
        }

        /* ==================================================
           11. ANIMATIONS & RESPONSIVE DESIGN
           ================================================== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUpFade {
            from { 
                opacity: 0; 
                transform: translateY(12px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        @media (max-width: 480px) {
            .card { 
                padding: 28px 24px; 
                border-radius: 16px;
            }
            .field-controls { 
                flex-direction: column; 
            }
            .btn-clear { 
                padding: 14px 20px; 
                width: 100%;
            }
            .detail-row { 
                flex-direction: column; 
                align-items: flex-start;
                gap: 6px; 
                padding: 10px 0; 
            }
            .detail-val {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <main class="card">
        <header>
            <div class="header-top">
                <!-- Premium Header Icon -->
                <svg class="header-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
                <span class="eyebrow">Document Verification</span>
            </div>
            <h1>3-Month Document Checker</h1>
            <p class="subtitle">Check whether a document is still within the last 3 months.</p>
            <hr class="header-divider" />
        </header>
        
        <div class="field-container">
            <label for="dateInput" class="field-label">Document Date</label>
            <div class="field-controls">
                <div class="input-wrapper" id="inputWrapper">
                    <input type="text" id="dateInput" placeholder="MM/DD/YYYY" autocomplete="off" aria-label="Enter document date in MM/DD/YYYY format" />
                    
                    <div class="calendar-icon-container">
                        <!-- Premium Gold Calendar Icon SVG -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <!-- Invisible native date picker over the icon -->
                        <input type="date" id="datePicker" class="picker-overlay" tabindex="-1" aria-label="Select date from calendar" />
                    </div>
                </div>
                <button type="button" id="clearBtn" class="btn-clear" aria-label="Clear inputs and results">Clear</button>
            </div>
            <div id="errorMsg" class="error-msg" aria-live="polite"></div>
        </div>

        <div id="emptyState" class="empty-state">
            <!-- Premium Empty State SVG illustration -->
            <svg class="empty-state-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <rect x="8" y="13" width="8" height="4" rx="1"></rect>
            </svg>
            <p>Enter a document date to check its validity.</p>
        </div>

        <div id="resultBox" class="result-box" aria-live="polite">
            <div class="result-header">
                <span id="resultStatus" class="result-status"></span>
            </div>
            <p id="resultMessage" class="result-message"></p>
            
            <div class="result-details">
                <div class="detail-row">
                    <span class="detail-label">Document Date</span>
                    <span id="resDocDate" class="detail-val"></span>
                </div>
                <div class="detail-row" id="expiryRow">
                    <span class="detail-label" id="resExpLabel">Expires</span>
                    <span id="resExpDate" class="detail-val"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Today</span>
                    <span id="resToday" class="detail-val"></span>
                </div>
                <div class="detail-row" id="daysRow">
                    <span class="detail-label" id="resDaysLabel">Days Remaining</span>
                    <span id="resDays" class="detail-val"></span>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const dateInput = document.getElementById('dateInput');
            const datePicker = document.getElementById('datePicker');
            const clearBtn = document.getElementById('clearBtn');
            const errorMsg = document.getElementById('errorMsg');
            const inputWrapper = document.getElementById('inputWrapper');
            
            const emptyState = document.getElementById('emptyState');
            const resultBox = document.getElementById('resultBox');
            
            // Result Display Elements
            const resultStatus = document.getElementById('resultStatus');
            const resultMessage = document.getElementById('resultMessage');
            const resDocDate = document.getElementById('resDocDate');
            const resExpDate = document.getElementById('resExpDate');
            const resToday = document.getElementById('resToday');
            const resDays = document.getElementById('resDays');
            const resExpLabel = document.getElementById('resExpLabel');
            const resDaysLabel = document.getElementById('resDaysLabel');
            const daysRow = document.getElementById('daysRow');

            // --- HELPER FUNCTIONS ---

            // Check how many days are in a specific month and year explicitly (handles leap years safely)
            function getDaysInMonth(month, year) {
                if ([1, 3, 5, 7, 8, 10, 12].includes(month)) return 31;
                if ([4, 6, 9, 11].includes(month)) return 30;
                if (month === 2) {
                    return (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0)) ? 29 : 28;
                }
                return 0;
            }

            // Explicit calendar validity checker (avoids JS auto-correction)
            function isValidDate(m, d, y) {
                if (m < 1 || m > 12) return false;
                if (d < 1) return false;
                if (d > getDaysInMonth(m, y)) return false;
                return true;
            }

            // Zero-pad numbers less than 10
            function pad(n) {
                return n < 10 ? '0' + n : n;
            }

            // Format extracted date to MM/DD/YYYY
            function formatDate(m, d, y) {
                return `${pad(m)}/${pad(d)}/${y}`;
            }

            // Format days pluralization
            function formatDays(days) {
                return days === 1 ? '1 day' : `${days} days`;
            }

            // Calculates the date exactly 3 calendar months forward
            function addThreeCalendarMonths(m, d, y) {
                let targetM = m + 3;
                let targetY = y;

                // Handle year rollover
                if (targetM > 12) {
                    targetM -= 12;
                    targetY += 1;
                }

                // Handle end-of-month clamping (e.g. Nov 30 + 3 months -> Feb 28/29)
                let maxDays = getDaysInMonth(targetM, targetY);
                let targetD = Math.min(d, maxDays);

                return { m: targetM, d: targetD, y: targetY };
            }

            // Calculates absolute calendar days between two dates regardless of timezones
            function calculateDaysDifference(expM, expD, expY, todM, todD, todY) {
                // Using UTC at midnight to prevent Daylight Savings / timezone offset math errors
                const utcExp = Date.UTC(expY, expM - 1, expD);
                const utcTod = Date.UTC(todY, todM - 1, todD);
                return Math.round((utcExp - utcTod) / (1000 * 60 * 60 * 24));
            }

            // Parse and strictly validate manual string input
            function parseAndValidateInput(val) {
                let trimmed = val.trim();
                if (!trimmed) return { empty: true };

                // Handle pure digit inputs like MMDDYYYY (8 digits) or MMDDYY (6 digits)
                if (/^\d{8}$/.test(trimmed)) {
                    trimmed = `${trimmed.slice(0, 2)}/${trimmed.slice(2, 4)}/${trimmed.slice(4, 8)}`;
                } else if (/^\d{6}$/.test(trimmed)) {
                    trimmed = `${trimmed.slice(0, 2)}/${trimmed.slice(2, 4)}/${trimmed.slice(4, 6)}`;
                }

                // Matches flexible entry formats: M/D/YY, MM/DD/YY, M/D/YYYY, MM/DD/YYYY
                const regex = /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/;
                const match = trimmed.match(regex);

                if (!match) return { invalid: true };

                let m = parseInt(match[1], 10);
                let d = parseInt(match[2], 10);
                let y = parseInt(match[3], 10);

                // Interpret 2-digit years as 20xx
                if (y < 100) {
                    y += 2000;
                }

                if (!isValidDate(m, d, y)) return { invalid: true };

                return { m, d, y };
            }

            // --- UI STATE MANAGEMENT ---

            function clearError() {
                errorMsg.style.display = 'none';
                errorMsg.textContent = '';
                inputWrapper.classList.remove('input-error');
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
                inputWrapper.classList.add('input-error');
                hideResult();
            }

            function hideResult() {
                resultBox.style.display = 'none';
                emptyState.style.display = 'block';
                resultBox.className = 'result-box'; // reset classes
            }

            function resetChecker() {
                dateInput.value = '';
                datePicker.value = '';
                clearError();
                hideResult();
                dateInput.focus();
            }

            function renderResult(docM, docD, docY, expM, expD, expY, todM, todD, todY, diffDays) {
                // Populate dates
                resDocDate.textContent = formatDate(docM, docD, docY);
                resExpDate.textContent = formatDate(expM, expD, expY);
                resToday.textContent = formatDate(todM, todD, todY);

                // Reset state classes
                resultBox.className = 'result-box';
                daysRow.style.display = 'flex';
                resultMessage.style.display = 'block';

                if (diffDays > 7) {
                    // State 1: VALID
                    resultBox.classList.add('status-valid');
                    resultStatus.textContent = 'VALID';
                    resultMessage.textContent = 'This document is still within 3 months.';
                    resExpLabel.textContent = 'Expires';
                    resDaysLabel.textContent = 'Days Remaining';
                    resDays.textContent = formatDays(diffDays);

                } else if (diffDays > 0 && diffDays <= 7) {
                    // State 2: EXPIRING SOON
                    resultBox.classList.add('status-soon');
                    resultStatus.textContent = 'EXPIRING SOON';
                    resultMessage.textContent = 'This document is still valid but will expire soon.';
                    resExpLabel.textContent = 'Expires';
                    resDaysLabel.textContent = 'Days Remaining';
                    resDays.textContent = formatDays(diffDays);

                } else if (diffDays === 0) {
                    // State 3: EXPIRES TODAY
                    resultBox.classList.add('status-today');
                    resultStatus.textContent = 'EXPIRES TODAY';
                    resultMessage.style.display = 'none'; // No message needed for this state
                    resExpLabel.textContent = 'Expires';
                    daysRow.style.display = 'none'; // Hide days remaining

                } else {
                    // State 4: EXPIRED
                    resultBox.classList.add('status-expired');
                    resultStatus.textContent = 'EXPIRED';
                    resultMessage.textContent = 'This document is more than 3 months old.';
                    resExpLabel.textContent = 'Expired On';
                    resDaysLabel.textContent = 'Days Overdue';
                    resDays.textContent = formatDays(Math.abs(diffDays));
                }

                emptyState.style.display = 'none';
                resultBox.style.display = 'block';
            }

            // Master process function when a valid date is received
            function processValidDate(m, d, y) {
                clearError();
                
                // Normalizes the input field to consistently display MM/DD/YYYY
                dateInput.value = formatDate(m, d, y);
                
                // Syncs the underlying hidden native date picker
                datePicker.value = `${y}-${pad(m)}-${pad(d)}`;

                // Compute exact 3-calendar-month expiry
                const expiry = addThreeCalendarMonths(m, d, y);

                // Fetch strictly current local date components
                const now = new Date();
                const todayM = now.getMonth() + 1;
                const todayD = now.getDate();
                const todayY = now.getFullYear();

                // Compute calendar day differences
                const diffDays = calculateDaysDifference(expiry.m, expiry.d, expiry.y, todayM, todayD, todayY);

                // Final render
                renderResult(m, d, y, expiry.m, expiry.d, expiry.y, todayM, todayD, todayY, diffDays);
            }

            // 1. Text Input event: Handles rapid validation when typing a full 4-digit year, or pasting.
            dateInput.addEventListener('input', (e) => {
                const val = dateInput.value.trim();
                
                if (val === '') {
                    clearError();
                    hideResult();
                    return;
                }

                // Auto-trigger immediately on 'input' if the user types a full 4-digit year format,
                // or an 8-digit continuous date string (MMDDYYYY).
                if (/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.test(val) || /^\d{8}$/.test(val)) {
                    const res = parseAndValidateInput(val);
                    if (!res.invalid && !res.empty) {
                        processValidDate(res.m, res.d, res.y);
                    }
                }
            });

            // 2. Change / Blur event: Validates input once the user completes typing or leaves the field.
            dateInput.addEventListener('change', (e) => {
                const val = dateInput.value.trim();
                if (val === '') return;
                
                const res = parseAndValidateInput(val);
                if (res.invalid) {
                    showError("Please enter a valid date.");
                } else if (!res.empty) {
                    processValidDate(res.m, res.d, res.y);
                }
            });

            // 3. Keydown event: Provides immediate execution if they hit Enter while focused.
            dateInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = dateInput.value.trim();
                    if (val === '') return;
                    
                    const res = parseAndValidateInput(val);
                    if (res.invalid) {
                        showError("Please enter a valid date.");
                    } else if (!res.empty) {
                        processValidDate(res.m, res.d, res.y);
                    }
                }
            });

            // 4. Native Date Picker listener
            datePicker.addEventListener('change', (e) => {
                const val = e.target.value; // Returns YYYY-MM-DD
                if (!val) return;
                
                const parts = val.split('-');
                if (parts.length === 3) {
                    const y = parseInt(parts[0], 10);
                    const m = parseInt(parts[1], 10);
                    const d = parseInt(parts[2], 10);
                    processValidDate(m, d, y);
                }
            });

            // 5. Clear Button
            clearBtn.addEventListener('click', resetChecker);
        });
    </script>
</body>
</html>
