<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Month Document Checker</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Cline x1='16' y1='2' x2='16' y2='6'%3E%3C/line%3E%3Cline x1='8' y1='2' x2='8' y2='6'%3E%3C/line%3E%3Cline x1='3' y1='10' x2='21' y2='10'%3E%3C/line%3E%3Cpath d='M9 16l2 2 4-4'%3E%3C/path%3E%3C/svg%3E">
    
    <style>
        :root {
            color-scheme: light dark;
            
            /* Color Palette */
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --focus-ring: #3b82f6;
            --btn-clear-bg: #f1f5f9;
            --btn-clear-hover: #e2e8f0;

            /* Status Colors */
            --status-valid-bg: #ecfdf5;
            --status-valid-border: #10b981;
            --status-valid-text: #065f46;
            --status-valid-badge: rgba(16, 185, 129, 0.15);

            --status-soon-bg: #fffbeb;
            --status-soon-border: #f59e0b;
            --status-soon-text: #92400e;
            --status-soon-badge: rgba(245, 158, 11, 0.15);

            --status-today-bg: #fff7ed;
            --status-today-border: #f97316;
            --status-today-text: #9a3412;
            --status-today-badge: rgba(249, 115, 22, 0.15);

            --status-expired-bg: #fef2f2;
            --status-expired-border: #ef4444;
            --status-expired-text: #991b1b;
            --status-expired-badge: rgba(239, 68, 68, 0.15);
            
            --error-text: #dc2626;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0f172a;
                --bg-card: #1e293b;
                
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: #334155;
                --focus-ring: #3b82f6;
                --btn-clear-bg: #334155;
                --btn-clear-hover: #475569;

                /* Dark mode optimized status colors for readability */
                --status-valid-bg: rgba(16, 185, 129, 0.1);
                --status-valid-badge: rgba(16, 185, 129, 0.2);
                --status-valid-text: #34d399;

                --status-soon-bg: rgba(245, 158, 11, 0.1);
                --status-soon-badge: rgba(245, 158, 11, 0.2);
                --status-soon-text: #fbbf24;

                --status-today-bg: rgba(249, 115, 22, 0.1);
                --status-today-badge: rgba(249, 115, 22, 0.2);
                --status-today-text: #fb923c;

                --status-expired-bg: rgba(239, 68, 68, 0.1);
                --status-expired-badge: rgba(239, 68, 68, 0.2);
                --status-expired-text: #f87171;
            }

            /* Adjustments for specific elements in dark mode */
            .btn-clear { color: #cbd5e1; }
            #dateInput::placeholder { color: #64748b; }
            #emptyState svg { color: #475569 !important; }
            .detail-row { border-bottom-color: rgba(255, 255, 255, 0.08); }
            .card { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3), 0 1px 3px 0 rgba(0, 0, 0, 0.3); }
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--bg-card);
            width: 100%;
            max-width: 460px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01), 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            padding: 32px;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 28px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .field-container {
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .field-controls {
            display: flex;
            gap: 12px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            flex-grow: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-card);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--focus-ring);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .input-wrapper.input-error {
            border-color: var(--error-text);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }

        #dateInput {
            flex-grow: 1;
            border: none;
            background: transparent;
            padding: 14px 16px;
            font-size: 16px;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-variant-numeric: tabular-nums;
        }

        #dateInput::placeholder {
            color: #94a3b8;
        }

        .calendar-icon-container {
            position: relative;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .calendar-icon-container svg {
            transition: color 0.2s;
        }

        .calendar-icon-container:hover svg {
            color: var(--text-main);
        }

        /* Hidden native date picker overlaid on the icon for flawless cross-browser compatibility */
        .picker-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .btn-clear {
            flex-shrink: 0;
            padding: 0 20px;
            background: var(--btn-clear-bg);
            color: #475569;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            outline: none;
        }

        .btn-clear:hover {
            background: var(--btn-clear-hover);
            color: var(--text-main);
        }

        .btn-clear:focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }

        .error-msg {
            display: none;
            color: var(--error-text);
            font-size: 14px;
            margin-top: 8px;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px 20px 20px;
            color: var(--text-muted);
        }

        .empty-state p {
            margin: 0;
            font-size: 15px;
        }

        .result-box {
            display: none;
            margin-top: 24px;
            border-radius: 12px;
            padding: 24px;
            border-left-width: 6px;
            border-left-style: solid;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-status {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .result-message {
            font-size: 15.5px;
            margin: 0 0 20px 0;
            line-height: 1.4;
            color: var(--text-main);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 14.5px;
        }

        .detail-val {
            color: var(--text-main);
            font-weight: 600;
            font-size: 14.5px;
            font-variant-numeric: tabular-nums;
        }

        .status-valid {
            background-color: var(--status-valid-bg);
            border-left-color: var(--status-valid-border);
        }
        .status-valid .result-status {
            background: var(--status-valid-badge);
            color: var(--status-valid-text);
        }

        .status-soon {
            background-color: var(--status-soon-bg);
            border-left-color: var(--status-soon-border);
        }
        .status-soon .result-status {
            background: var(--status-soon-badge);
            color: var(--status-soon-text);
        }

        .status-today {
            background-color: var(--status-today-bg);
            border-left-color: var(--status-today-border);
        }
        .status-today .result-status {
            background: var(--status-today-badge);
            color: var(--status-today-text);
        }

        .status-expired {
            background-color: var(--status-expired-bg);
            border-left-color: var(--status-expired-border);
        }
        .status-expired .result-status {
            background: var(--status-expired-badge);
            color: var(--status-expired-text);
        }

        /* Responsive adjustments */
        @media (max-width: 400px) {
            .field-controls { flex-direction: column; }
            .btn-clear { padding: 12px 20px; }
            .detail-row { flex-direction: column; gap: 4px; padding: 12px 0; }
        }
    </style>
</head>
<body>

    <main class="card">
        <header>
            <h1>3-Month Document Checker</h1>
            <p class="subtitle">Check whether a document is still within the last 3 months.</p>
        </header>
        
        <div class="field-container">
            <label for="dateInput" class="field-label">Document Date</label>
            <div class="field-controls">
                <div class="input-wrapper" id="inputWrapper">
                    <input type="text" id="dateInput" placeholder="MM/DD/YYYY" autocomplete="off" aria-label="Enter document date in MM/DD/YYYY format" />
                    
                    <div class="calendar-icon-container">
                        <!-- Calendar Icon SVG -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <!-- Invisible native date picker over the icon -->
                        <input type="date" id="datePicker" class="picker-overlay" tabindex="-1" aria-label="Select date from calendar" />
                    </div>
                </div>
                <button type="button" id="clearBtn" class="btn-clear" aria-label="Clear inputs and results">Clear</button>
            </div>
            <div id="errorMsg" class="error-msg" aria-live="polite"></div>
        </div>

        <div id="emptyState" class="empty-state">
            <!-- Empty state SVG illustration -->
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: #cbd5e1; margin-bottom: 16px;">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <p>Enter a document date to check its validity.</p>
        </div>

        <div id="resultBox" class="result-box" aria-live="polite">
            <div class="result-header">
                <span id="resultStatus" class="result-status"></span>
            </div>
            <p id="resultMessage" class="result-message"></p>
            
            <div class="result-details">
                <div class="detail-row">
                    <span class="detail-label">Document Date:</span>
                    <span id="resDocDate" class="detail-val"></span>
                </div>
                <div class="detail-row" id="expiryRow">
                    <span class="detail-label" id="resExpLabel">Expires:</span>
                    <span id="resExpDate" class="detail-val"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Today:</span>
                    <span id="resToday" class="detail-val"></span>
                </div>
                <div class="detail-row" id="daysRow">
                    <span class="detail-label" id="resDaysLabel">Days Remaining:</span>
                    <span id="resDays" class="detail-val"></span>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const dateInput = document.getElementById('dateInput');
            const datePicker = document.getElementById('datePicker');
            const clearBtn = document.getElementById('clearBtn');
            const errorMsg = document.getElementById('errorMsg');
            const inputWrapper = document.getElementById('inputWrapper');
            
            const emptyState = document.getElementById('emptyState');
            const resultBox = document.getElementById('resultBox');
            
            // Result Display Elements
            const resultStatus = document.getElementById('resultStatus');
            const resultMessage = document.getElementById('resultMessage');
            const resDocDate = document.getElementById('resDocDate');
            const resExpDate = document.getElementById('resExpDate');
            const resToday = document.getElementById('resToday');
            const resDays = document.getElementById('resDays');
            const resExpLabel = document.getElementById('resExpLabel');
            const resDaysLabel = document.getElementById('resDaysLabel');
            const daysRow = document.getElementById('daysRow');

            // --- HELPER FUNCTIONS ---

            // Check how many days are in a specific month and year explicitly (handles leap years safely)
            function getDaysInMonth(month, year) {
                if ([1, 3, 5, 7, 8, 10, 12].includes(month)) return 31;
                if ([4, 6, 9, 11].includes(month)) return 30;
                if (month === 2) {
                    return (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0)) ? 29 : 28;
                }
                return 0;
            }

            // Explicit calendar validity checker (avoids JS auto-correction)
            function isValidDate(m, d, y) {
                if (m < 1 || m > 12) return false;
                if (d < 1) return false;
                if (d > getDaysInMonth(m, y)) return false;
                return true;
            }

            // Zero-pad numbers less than 10
            function pad(n) {
                return n < 10 ? '0' + n : n;
            }

            // Format extracted date to MM/DD/YYYY
            function formatDate(m, d, y) {
                return `${pad(m)}/${pad(d)}/${y}`;
            }

            // Format days pluralization
            function formatDays(days) {
                return days === 1 ? '1 day' : `${days} days`;
            }

            // Calculates the date exactly 3 calendar months forward
            function addThreeCalendarMonths(m, d, y) {
                let targetM = m + 3;
                let targetY = y;

                // Handle year rollover
                if (targetM > 12) {
                    targetM -= 12;
                    targetY += 1;
                }

                // Handle end-of-month clamping (e.g. Nov 30 + 3 months -> Feb 28/29)
                let maxDays = getDaysInMonth(targetM, targetY);
                let targetD = Math.min(d, maxDays);

                return { m: targetM, d: targetD, y: targetY };
            }

            // Calculates absolute calendar days between two dates regardless of timezones
            function calculateDaysDifference(expM, expD, expY, todM, todD, todY) {
                // Using UTC at midnight to prevent Daylight Savings / timezone offset math errors
                const utcExp = Date.UTC(expY, expM - 1, expD);
                const utcTod = Date.UTC(todY, todM - 1, todD);
                return Math.round((utcExp - utcTod) / (1000 * 60 * 60 * 24));
            }

            // Parse and strictly validate manual string input
            function parseAndValidateInput(val) {
                let trimmed = val.trim();
                if (!trimmed) return { empty: true };

                // Handle pure digit inputs like MMDDYYYY (8 digits) or MMDDYY (6 digits)
                if (/^\d{8}$/.test(trimmed)) {
                    trimmed = `${trimmed.slice(0, 2)}/${trimmed.slice(2, 4)}/${trimmed.slice(4, 8)}`;
                } else if (/^\d{6}$/.test(trimmed)) {
                    trimmed = `${trimmed.slice(0, 2)}/${trimmed.slice(2, 4)}/${trimmed.slice(4, 6)}`;
                }

                // Matches flexible entry formats: M/D/YY, MM/DD/YY, M/D/YYYY, MM/DD/YYYY
                const regex = /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/;
                const match = trimmed.match(regex);

                if (!match) return { invalid: true };

                let m = parseInt(match[1], 10);
                let d = parseInt(match[2], 10);
                let y = parseInt(match[3], 10);

                // Interpret 2-digit years as 20xx
                if (y < 100) {
                    y += 2000;
                }

                if (!isValidDate(m, d, y)) return { invalid: true };

                return { m, d, y };
            }

            // --- UI STATE MANAGEMENT ---

            function clearError() {
                errorMsg.style.display = 'none';
                errorMsg.textContent = '';
                inputWrapper.classList.remove('input-error');
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
                inputWrapper.classList.add('input-error');
                hideResult();
            }

            function hideResult() {
                resultBox.style.display = 'none';
                emptyState.style.display = 'block';
                resultBox.className = 'result-box'; // reset classes
            }

            function resetChecker() {
                dateInput.value = '';
                datePicker.value = '';
                clearError();
                hideResult();
                dateInput.focus();
            }

            function renderResult(docM, docD, docY, expM, expD, expY, todM, todD, todY, diffDays) {
                // Populate dates
                resDocDate.textContent = formatDate(docM, docD, docY);
                resExpDate.textContent = formatDate(expM, expD, expY);
                resToday.textContent = formatDate(todM, todD, todY);

                // Reset state classes
                resultBox.className = 'result-box';
                daysRow.style.display = 'flex';
                resultMessage.style.display = 'block';

                if (diffDays > 7) {
                    // State 1: VALID
                    resultBox.classList.add('status-valid');
                    resultStatus.textContent = 'VALID';
                    resultMessage.textContent = 'This document is still within 3 months.';
                    resExpLabel.textContent = 'Expires:';
                    resDaysLabel.textContent = 'Days Remaining:';
                    resDays.textContent = formatDays(diffDays);

                } else if (diffDays > 0 && diffDays <= 7) {
                    // State 2: EXPIRING SOON
                    resultBox.classList.add('status-soon');
                    resultStatus.textContent = 'EXPIRING SOON';
                    resultMessage.textContent = 'This document is still valid but will expire soon.';
                    resExpLabel.textContent = 'Expires:';
                    resDaysLabel.textContent = 'Days Remaining:';
                    resDays.textContent = formatDays(diffDays);

                } else if (diffDays === 0) {
                    // State 3: EXPIRES TODAY
                    resultBox.classList.add('status-today');
                    resultStatus.textContent = 'EXPIRES TODAY';
                    resultMessage.style.display = 'none'; // No message needed for this state
                    resExpLabel.textContent = 'Expires:';
                    daysRow.style.display = 'none'; // Hide days remaining

                } else {
                    // State 4: EXPIRED
                    resultBox.classList.add('status-expired');
                    resultStatus.textContent = 'EXPIRED';
                    resultMessage.textContent = 'This document is more than 3 months old.';
                    resExpLabel.textContent = 'Expired On:';
                    resDaysLabel.textContent = 'Days Overdue:';
                    resDays.textContent = formatDays(Math.abs(diffDays));
                }

                emptyState.style.display = 'none';
                resultBox.style.display = 'block';
            }

            // Master process function when a valid date is received
            function processValidDate(m, d, y) {
                clearError();
                
                // Normalizes the input field to consistently display MM/DD/YYYY
                dateInput.value = formatDate(m, d, y);
                
                // Syncs the underlying hidden native date picker
                datePicker.value = `${y}-${pad(m)}-${pad(d)}`;

                // Compute exact 3-calendar-month expiry
                const expiry = addThreeCalendarMonths(m, d, y);

                // Fetch strictly current local date components
                const now = new Date();
                const todayM = now.getMonth() + 1;
                const todayD = now.getDate();
                const todayY = now.getFullYear();

                // Compute calendar day differences
                const diffDays = calculateDaysDifference(expiry.m, expiry.d, expiry.y, todayM, todayD, todayY);

                // Final render
                renderResult(m, d, y, expiry.m, expiry.d, expiry.y, todayM, todayD, todayY, diffDays);
            }

            // 1. Text Input event: Handles rapid validation when typing a full 4-digit year, or pasting.
            dateInput.addEventListener('input', (e) => {
                const val = dateInput.value.trim();
                
                if (val === '') {
                    clearError();
                    hideResult();
                    return;
                }

                // Auto-trigger immediately on 'input' if the user types a full 4-digit year format,
                // or an 8-digit continuous date string (MMDDYYYY).
                if (/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.test(val) || /^\d{8}$/.test(val)) {
                    const res = parseAndValidateInput(val);
                    if (!res.invalid && !res.empty) {
                        processValidDate(res.m, res.d, res.y);
                    }
                }
            });

            // 2. Change / Blur event: Validates input once the user completes typing or leaves the field.
            dateInput.addEventListener('change', (e) => {
                const val = dateInput.value.trim();
                if (val === '') return;
                
                const res = parseAndValidateInput(val);
                if (res.invalid) {
                    showError("Please enter a valid date.");
                } else if (!res.empty) {
                    processValidDate(res.m, res.d, res.y);
                }
            });

            // 3. Keydown event: Provides immediate execution if they hit Enter while focused.
            dateInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = dateInput.value.trim();
                    if (val === '') return;
                    
                    const res = parseAndValidateInput(val);
                    if (res.invalid) {
                        showError("Please enter a valid date.");
                    } else if (!res.empty) {
                        processValidDate(res.m, res.d, res.y);
                    }
                }
            });

            // 4. Native Date Picker listener
            datePicker.addEventListener('change', (e) => {
                const val = e.target.value; // Returns YYYY-MM-DD
                if (!val) return;
                
                const parts = val.split('-');
                if (parts.length === 3) {
                    const y = parseInt(parts[0], 10);
                    const m = parseInt(parts[1], 10);
                    const d = parseInt(parts[2], 10);
                    processValidDate(m, d, y);
                }
            });

            // 5. Clear Button
            clearBtn.addEventListener('click', resetChecker);
        });
    </script>
</body>
</html>
