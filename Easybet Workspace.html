<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easybet Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(10, 10, 10, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --panel-bg: rgba(15, 15, 15, 0.75);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        /* Background Layers */
        #app-background {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% -20%, #1a1a1a 0%, #000 80%);
            transition: all 0.5s ease-in-out;
        }

        #app-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease-out;
        }

        /* Sidebar Hover Logic */
        .sidebar-container {
            position: fixed;
            top: 0;
            bottom: 0;
            left: -320px;
            width: 320px;
            z-index: 50;
            background: var(--glass-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-right: 1px solid var(--glass-border);
            box-shadow: 20px 0 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }
        .sidebar-container::after {
            content: '';
            position: absolute;
            top: 0;
            right: -30px;
            width: 30px;
            height: 100%;
            cursor: e-resize;
        }
        .sidebar-container:hover, .sidebar-container.force-open {
            transform: translateX(320px);
        }

        /* Inputs & Sliders */
        input:focus { outline: none; }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        input[type=range]:focus::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* Iframe */
        iframe { background-color: transparent; }
    </style>
</head>
<body class="h-screen w-screen flex antialiased selection:bg-white/20 selection:text-white">

    <!-- Global Background Elements -->
    <div id="app-background"></div>
    <div id="app-overlay"></div>

    <!-- Workspace Main Area -->
    <main class="relative w-full h-full flex flex-col items-center justify-center transition-all duration-500">
        
        <!-- Empty State -->
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-0 transition-opacity duration-700">
            <div class="p-10 rounded-3xl bg-black/20 border border-white/10 backdrop-blur-xl shadow-2xl flex flex-col items-center max-w-lg text-center transform scale-100 transition-transform">
                <h1 class="text-3xl font-light text-white tracking-tight mb-8">Easybet Workspace</h1>
                <div class="flex gap-4 text-white/30 text-xs uppercase tracking-widest font-medium">
                    <span class="flex items-center gap-1"><i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Secure</span>
                    <span class="flex items-center gap-1"><i data-lucide="zap" class="w-3.5 h-3.5"></i> Fast</span>
                    <span class="flex items-center gap-1"><i data-lucide="layout" class="w-3.5 h-3.5"></i> Clean</span>
                </div>
            </div>
        </div>

        <!-- Iframe Container -->
        <div id="workspaceContainer" class="absolute inset-0 w-full h-full opacity-0 pointer-events-none transition-opacity duration-700 z-10 bg-transparent">
            <iframe id="mainFrame" class="w-full h-full border-none" allowtransparency="true"></iframe>
        </div>
    </main>

    <!-- Sidebar (Hidden by Default) -->
    <aside class="sidebar-container" id="sidebar">
        <!-- Header & Profile -->
        <div class="p-6 border-b border-white/[0.06] flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 flex-1">
                <div class="relative group cursor-pointer w-12 h-12 rounded-full overflow-hidden border border-white/10 bg-white/5 shrink-0 transition-all hover:border-white/30 hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]" onclick="document.getElementById('profileInput').click()">
                    <img id="profileImage" src="" alt="Profile" class="w-full h-full object-cover hidden" />
                    <div id="profilePlaceholder" class="w-full h-full flex items-center justify-center text-white/40">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </div>
                    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <i data-lucide="camera" class="w-4 h-4 text-white"></i>
                    </div>
                </div>
                <div class="flex-1 overflow-hidden">
                    <h2 class="text-white font-medium text-sm truncate">Workspace User</h2>
                    <p class="text-white/40 text-xs truncate">Easybet Environment</p>
                </div>
            </div>
            <button id="removeProfileBtn" class="text-white/30 hover:text-white transition-colors hidden" onclick="removeProfileImage()" title="Remove Avatar">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <input type="file" id="profileInput" accept="image/*" class="hidden" onchange="handleProfileUpload(event)">
        </div>

        <!-- Actions -->
        <div class="p-4 flex gap-2 border-b border-white/[0.06]">
            <button onclick="openLinkModal()" class="flex-1 flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10 border border-white/5 hover:border-white/10 text-white/80 hover:text-white py-2.5 rounded-xl transition-all text-xs font-medium">
                <i data-lucide="link" class="w-3.5 h-3.5"></i> Link
            </button>
            <button onclick="document.getElementById('fileInput').click()" class="flex-1 flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10 border border-white/5 hover:border-white/10 text-white/80 hover:text-white py-2.5 rounded-xl transition-all text-xs font-medium">
                <i data-lucide="file-plus" class="w-3.5 h-3.5"></i> Import
            </button>
            <button onclick="openBgSettingsModal()" class="w-10 flex items-center justify-center bg-white/5 hover:bg-white/10 border border-white/5 hover:border-white/10 text-white/80 hover:text-white py-2.5 rounded-xl transition-all" title="Appearance">
                <i data-lucide="image" class="w-3.5 h-3.5"></i>
            </button>
            <!-- Accepts both html and htm explicitly -->
            <input type="file" id="fileInput" accept=".html,.htm" multiple class="hidden" onchange="handleFileImport(event)">
        </div>

        <!-- Item List -->
        <div class="flex-1 overflow-y-auto p-3 space-y-1" id="itemList">
            <!-- Items injected via JS -->
        </div>
    </aside>

    <!-- Add Link Modal -->
    <div id="linkModal" class="fixed inset-0 bg-black/60 backdrop-blur-xl z-[100] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-[#0f0f0f]/90 border border-white/10 rounded-2xl p-6 w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-300 backdrop-blur-3xl" id="linkModalContent">
            <h3 class="text-white font-medium mb-4 flex items-center gap-2">
                <i data-lucide="link-2" class="w-4 h-4 text-white/50"></i> Add Website
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-white/40 text-xs mb-1.5 ml-1">Website Name</label>
                    <input type="text" id="linkName" placeholder="e.g. Easybet Portal" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/20 transition-colors focus:border-white/30 focus:bg-white/10">
                </div>
                <div>
                    <label class="block text-white/40 text-xs mb-1.5 ml-1">URL (https://...)</label>
                    <input type="url" id="linkUrl" placeholder="https://" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/20 transition-colors focus:border-white/30 focus:bg-white/10">
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="closeLinkModal()" class="flex-1 py-2.5 rounded-xl text-white/60 hover:text-white hover:bg-white/5 transition-all text-sm font-medium">Cancel</button>
                <button onclick="saveLink()" class="flex-1 py-2.5 rounded-xl bg-white text-black hover:bg-white/90 transition-all text-sm font-medium">Add Link</button>
            </div>
        </div>
    </div>

    <!-- Background Settings Modal -->
    <div id="bgSettingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-xl z-[100] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-[#0f0f0f]/90 border border-white/10 rounded-2xl p-6 w-full max-w-sm shadow-2xl transform scale-95 transition-transform duration-300 backdrop-blur-3xl" id="bgSettingsContent">
            <h3 class="text-white font-medium mb-5 flex items-center gap-2">
                <i data-lucide="image" class="w-4 h-4 text-white/50"></i> Appearance
            </h3>
            
            <div class="space-y-5">
                <!-- Image Upload -->
                <div>
                    <label class="block text-white/40 text-xs mb-2 ml-1">Background Image</label>
                    <div class="flex gap-2">
                        <button onclick="document.getElementById('bgImageInput').click()" class="flex-1 flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl py-2.5 text-sm text-white transition-all">
                            <i data-lucide="upload" class="w-4 h-4 text-white/60"></i> Upload
                        </button>
                        <button onclick="removeBackgroundImage()" class="px-4 bg-white/5 hover:bg-red-500/20 border border-white/10 hover:border-red-500/30 rounded-xl text-white/60 hover:text-red-400 transition-all" title="Reset to default">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <input type="file" id="bgImageInput" accept="image/jpeg, image/png, image/webp, image/gif" class="hidden" onchange="handleBgImageUpload(event)">
                </div>

                <!-- Dim Control -->
                <div>
                    <div class="flex justify-between items-center mb-2 ml-1 mr-1">
                        <label class="text-white/40 text-xs">Dim Overlay</label>
                        <span id="dimValueDisplay" class="text-white/60 text-xs font-mono">50%</span>
                    </div>
                    <input type="range" id="dimSlider" min="0" max="100" value="50" oninput="updateBgLivePreview()">
                </div>

                <!-- Blur Control -->
                <div>
                    <div class="flex justify-between items-center mb-2 ml-1 mr-1">
                        <label class="text-white/40 text-xs">Glass Blur</label>
                        <span id="blurValueDisplay" class="text-white/60 text-xs font-mono">10px</span>
                    </div>
                    <input type="range" id="blurSlider" min="0" max="40" value="10" oninput="updateBgLivePreview()">
                </div>
                
                <!-- Display Mode -->
                <div>
                    <label class="block text-white/40 text-xs mb-2 ml-1">Image Fit</label>
                    <select id="bgSizeSelect" onchange="updateBgLivePreview()" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-white/30 appearance-none">
                        <option value="cover" class="bg-[#0f0f0f]">Fill Screen (Cover)</option>
                        <option value="contain" class="bg-[#0f0f0f]">Fit Screen (Contain)</option>
                    </select>
                </div>
            </div>

            <div class="mt-6">
                <button onclick="closeBgSettingsModal()" class="w-full py-2.5 rounded-xl bg-white text-black hover:bg-white/90 transition-all text-sm font-medium">Done</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 flex flex-col gap-3 z-[110]"></div>

    <script>
        // Data State
        let workspaceItems = [];
        let activeItemId = null;
        let bgSettings = {
            image: null,
            dim: 50,
            blur: 10,
            size: 'cover'
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadProfileImage();
            loadBgSettings();
            loadItems();
            renderList();
            
            // Sidebar keep-open logic for modals
            const sidebar = document.getElementById('sidebar');
            const linkModal = document.getElementById('linkModal');
            const bgModal = document.getElementById('bgSettingsModal');
            
            linkModal.addEventListener('mouseenter', () => sidebar.classList.add('force-open'));
            linkModal.addEventListener('mouseleave', () => sidebar.classList.remove('force-open'));
            bgModal.addEventListener('mouseenter', () => sidebar.classList.add('force-open'));
            bgModal.addEventListener('mouseleave', () => sidebar.classList.remove('force-open'));
        });

        // Toast System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const icon = type === 'error' ? 'alert-circle' : 'check-circle';
            const color = type === 'error' ? 'text-red-400' : 'text-white';
            const border = type === 'error' ? 'border-red-500/20' : 'border-white/10';

            toast.className = `flex items-center gap-3 bg-[#0a0a0a]/90 backdrop-blur-xl border ${border} px-4 py-3 rounded-2xl shadow-2xl transform translate-y-4 opacity-0 transition-all duration-300`;
            toast.innerHTML = `
                <i data-lucide="${icon}" class="w-4 h-4 ${color}"></i>
                <span class="text-sm font-medium text-white/90">${message}</span>
            `;
            
            container.appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-95');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ==========================================
        // Profile Image Logic
        // ==========================================
        function loadProfileImage() {
            const imgData = localStorage.getItem('easybet_profile');
            const imgEl = document.getElementById('profileImage');
            const placeholder = document.getElementById('profilePlaceholder');
            const removeBtn = document.getElementById('removeProfileBtn');

            if (imgData) {
                imgEl.src = imgData;
                imgEl.classList.remove('hidden');
                placeholder.classList.add('hidden');
                removeBtn.classList.remove('hidden');
            } else {
                imgEl.src = '';
                imgEl.classList.add('hidden');
                placeholder.classList.remove('hidden');
                removeBtn.classList.add('hidden');
            }
        }

        function handleProfileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            compressAndSaveImage(file, 'easybet_profile', () => {
                loadProfileImage();
                showToast('Profile image updated');
            });
            event.target.value = '';
        }

        function removeProfileImage() {
            localStorage.removeItem('easybet_profile');
            loadProfileImage();
            showToast('Profile image removed');
        }

        // ==========================================
        // Background Image Logic
        // ==========================================
        function loadBgSettings() {
            try {
                const stored = localStorage.getItem('easybet_bg_settings');
                if (stored) {
                    bgSettings = { ...bgSettings, ...JSON.parse(stored) };
                }
                const imgData = localStorage.getItem('easybet_bg_image');
                if (imgData) {
                    bgSettings.image = imgData;
                }
            } catch(e) { console.error('Failed loading bg settings'); }

            applyBgToDOM();
            
            // Sync UI sliders
            document.getElementById('dimSlider').value = bgSettings.dim;
            document.getElementById('blurSlider').value = bgSettings.blur;
            document.getElementById('bgSizeSelect').value = bgSettings.size;
            updateSliderDisplays();
        }

        function saveBgSettings() {
            localStorage.setItem('easybet_bg_settings', JSON.stringify({
                dim: bgSettings.dim,
                blur: bgSettings.blur,
                size: bgSettings.size
            }));
        }

        function applyBgToDOM() {
            const bgEl = document.getElementById('app-background');
            const overlayEl = document.getElementById('app-overlay');

            if (bgSettings.image) {
                bgEl.style.backgroundImage = `url(${bgSettings.image})`;
            } else {
                bgEl.style.backgroundImage = 'radial-gradient(circle at 50% -20%, #1a1a1a 0%, #000 80%)';
            }
            
            bgEl.style.backgroundSize = bgSettings.size;
            bgEl.style.backgroundRepeat = bgSettings.size === 'contain' ? 'no-repeat' : 'initial';
            
            overlayEl.style.backgroundColor = `rgba(0, 0, 0, ${bgSettings.dim / 100})`;
            overlayEl.style.backdropFilter = `blur(${bgSettings.blur}px)`;
            overlayEl.style.webkitBackdropFilter = `blur(${bgSettings.blur}px)`;
        }

        function openBgSettingsModal() {
            const modal = document.getElementById('bgSettingsModal');
            const content = document.getElementById('bgSettingsContent');
            
            // Sync current state to inputs
            document.getElementById('dimSlider').value = bgSettings.dim;
            document.getElementById('blurSlider').value = bgSettings.blur;
            document.getElementById('bgSizeSelect').value = bgSettings.size;
            updateSliderDisplays();

            modal.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => content.classList.remove('scale-95'), 10);
            document.getElementById('sidebar').classList.add('force-open');
        }

        function closeBgSettingsModal() {
            const modal = document.getElementById('bgSettingsModal');
            const content = document.getElementById('bgSettingsContent');
            
            content.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('sidebar').classList.remove('force-open');
        }

        function updateSliderDisplays() {
            document.getElementById('dimValueDisplay').innerText = document.getElementById('dimSlider').value + '%';
            document.getElementById('blurValueDisplay').innerText = document.getElementById('blurSlider').value + 'px';
        }

        function updateBgLivePreview() {
            bgSettings.dim = parseInt(document.getElementById('dimSlider').value);
            bgSettings.blur = parseInt(document.getElementById('blurSlider').value);
            bgSettings.size = document.getElementById('bgSizeSelect').value;
            
            updateSliderDisplays();
            applyBgToDOM();
            saveBgSettings(); // Save instantly on drag
        }

        function handleBgImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Use compression to ensure large backgrounds don't break localStorage
            compressAndSaveImage(file, 'easybet_bg_image', (base64) => {
                bgSettings.image = base64;
                applyBgToDOM();
                showToast('Background updated');
            }, 1920); // Max width/height for backgrounds
            
            event.target.value = '';
        }

        function removeBackgroundImage() {
            localStorage.removeItem('easybet_bg_image');
            bgSettings.image = null;
            applyBgToDOM();
            showToast('Background reset to default');
        }

        // Image compression utility to prevent quota errors
        function compressAndSaveImage(file, storageKey, callback, maxDim = 800) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width;
                    let h = img.height;
                    
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; } 
                        else { w = Math.round(w * (maxDim / h)); h = maxDim; }
                    }
                    
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    // Use webp for better compression, fallback to jpeg
                    const dataUrl = canvas.toDataURL('image/webp', 0.85);
                    try {
                        localStorage.setItem(storageKey, dataUrl);
                        callback(dataUrl);
                    } catch (err) {
                        showToast('Image too large for local storage', 'error');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ==========================================
        // Item Management Logic
        // ==========================================
        function loadItems() {
            try {
                const stored = localStorage.getItem('easybet_items');
                if (stored) workspaceItems = JSON.parse(stored);
            } catch (e) { console.error('Failed to load items'); }
        }

        function saveItems() {
            try {
                localStorage.setItem('easybet_items', JSON.stringify(workspaceItems));
            } catch (e) {
                showToast('Storage full. Try removing old files or backgrounds.', 'error');
            }
        }

        // Link Modal Logic
        function openLinkModal() {
            const modal = document.getElementById('linkModal');
            const content = document.getElementById('linkModalContent');
            document.getElementById('linkName').value = '';
            document.getElementById('linkUrl').value = '';
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => content.classList.remove('scale-95'), 10);
            document.getElementById('sidebar').classList.add('force-open');
        }

        function closeLinkModal() {
            const modal = document.getElementById('linkModal');
            const content = document.getElementById('linkModalContent');
            
            content.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('sidebar').classList.remove('force-open');
        }

        function saveLink() {
            const name = document.getElementById('linkName').value.trim();
            let url = document.getElementById('linkUrl').value.trim();

            if (!name || !url) {
                showToast('Please fill out all fields', 'error');
                return;
            }

            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

            const newItem = { id: Date.now().toString(), type: 'link', name, url, isFavorite: false };
            workspaceItems.push(newItem);
            saveItems();
            renderList();
            closeLinkModal();
            showToast('Link added successfully');
        }

        // File Import Logic
        function handleFileImport(event) {
            const files = event.target.files;
            if (!files.length) return;

            Array.from(files).forEach(file => {
                const nameLower = file.name.toLowerCase();
                // Ensure it reads both .html and .htm
                if (!nameLower.endsWith('.html') && !nameLower.endsWith('.htm')) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const cleanName = file.name.replace(/\.html?$/i, '');
                    const newItem = {
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        type: 'file',
                        name: cleanName,
                        content: e.target.result,
                        isFavorite: false
                    };
                    
                    try {
                        workspaceItems.push(newItem);
                        saveItems();
                        renderList();
                        showToast(`File ${newItem.name} imported`);
                    } catch (err) {
                        workspaceItems.pop();
                        showToast(`Failed to import ${file.name}. File too large.`, 'error');
                    }
                };
                reader.readAsText(file);
            });
            event.target.value = '';
        }

        function toggleFavorite(id) {
            const item = workspaceItems.find(i => i.id === id);
            if (item) {
                item.isFavorite = !item.isFavorite;
                saveItems();
                renderList();
            }
        }

        function deleteItem(id) {
            workspaceItems = workspaceItems.filter(i => i.id !== id);
            saveItems();
            if (activeItemId === id) closeActiveItem();
            renderList();
        }

        // Smart Processor for HTML Files imported locally
        function processImportedHtmlForTransparency(content) {
            const injection = `
                <style id="easybet-workspace-transparency">
                    /* Easybet Workspace - Safe HTML Transparency System */
                    
                    /* 1. Base Layer Transparency */
                    html, body {
                        background: transparent !important;
                        background-color: transparent !important;
                    }
                    
                    body.workspace-transparent-mode {
                        backdrop-filter: none !important;
                        color-scheme: dark !important; 
                    }

                    /* 2. Target common full-page layout wrappers */
                    body.workspace-transparent-mode > div:first-of-type,
                    body.workspace-transparent-mode > main,
                    #app, #root, #__next, .min-h-screen, .h-screen {
                        background-color: transparent !important;
                        background-image: none !important;
                    }

                    /* 3. Convert major solid dark backgrounds to premium glass */
                    .bg-black, .bg-gray-950, .bg-zinc-950, .bg-neutral-950, .bg-slate-950,
                    .bg-\\[\\#000000\\], .bg-\\[\\#050505\\], .bg-\\[\\#0a0a0a\\], .bg-\\[\\#0f0f0f\\] {
                        background-color: rgba(10, 10, 10, 0.2) !important;
                        backdrop-filter: blur(12px) !important;
                        -webkit-backdrop-filter: blur(12px) !important;
                    }

                    .bg-gray-900, .bg-zinc-900, .bg-neutral-900, .bg-slate-900,
                    .bg-\\[\\#111111\\], .bg-\\[\\#1a1a1a\\], .bg-\\[\\#111\\] {
                        background-color: rgba(20, 20, 20, 0.3) !important;
                        backdrop-filter: blur(12px) !important;
                        -webkit-backdrop-filter: blur(12px) !important;
                    }

                    /* 4. Form Wrapper Transparency - Strip out opaque dark boxes using specific and wildcard selectors */
                    .input-container, .input-group, .input-wrap, .input-wrapper,
                    [class*="input-container"], [class*="input-group"], [class*="input-wrap"],
                    .search, .search-box, .search-bar, .search-input,
                    [class*="search-box"], [class*="search-bar"], [class*="search-wrapper"],
                    .field, .field-input, .field-group, .form-control, .form-group, .control,
                    [class*="form-control"], [class*="form-group"], [class*="field-group"],
                    .glass-panel, .multi-select-display, .custom-select-trigger,
                    [class*="select-trigger"], [class*="combo-box"] {
                        background-color: transparent !important;
                        background-image: none !important;
                        box-shadow: none !important;
                    }

                    /* 5. Safe defaults for forms/inputs to feel like premium dark glass */
                    input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not([type="color"]), 
                    textarea, select, 
                    [role="searchbox"], [role="textbox"], [contenteditable="true"],
                    [class*="input-field"], [class*="text-input"] {
                        background-color: rgba(10, 10, 10, 0.16) !important;
                        backdrop-filter: blur(8px) !important;
                        -webkit-backdrop-filter: blur(8px) !important;
                        color: #ffffff !important;
                        border: 1px solid rgba(255, 255, 255, 0.12) !important;
                        caret-color: #ffffff !important;
                        transition: all 0.2s ease !important;
                    }

                    /* Focus state for inputs - Subtle brighter edge and glow */
                    input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not([type="color"]):focus, 
                    textarea:focus, select:focus,
                    [role="searchbox"]:focus, [role="textbox"]:focus, [contenteditable="true"]:focus,
                    [class*="input-field"]:focus, [class*="text-input"]:focus {
                        background-color: rgba(10, 10, 10, 0.24) !important;
                        border-color: rgba(255, 255, 255, 0.3) !important;
                        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15) !important;
                        outline: none !important;
                    }
                    
                    ::placeholder, [class*="placeholder"] {
                        color: rgba(255, 255, 255, 0.35) !important;
                        opacity: 1 !important;
                    }

                    ::selection {
                        background-color: rgba(255, 255, 255, 0.2) !important;
                        color: #ffffff !important;
                    }

                    /* 6. Protect dropdown options so standard menus remain fully readable */
                    option, optgroup {
                        background-color: rgba(15, 15, 15, 0.95) !important;
                        color: #ffffff !important;
                    }

                    /* 7. Protect modals, dialogs, and absolute dropdowns */
                    dialog, [role="dialog"], .modal, [data-modal], [class*="modal-content"], [class*="dialog-panel"] {
                        background-color: rgba(15, 15, 15, 0.95) !important;
                        backdrop-filter: blur(20px) !important;
                        -webkit-backdrop-filter: blur(20px) !important;
                        border: 1px solid rgba(255, 255, 255, 0.1) !important;
                    }
                </style>
                <script>
                    // Safely add class without mutating HTML string destructively
                    document.addEventListener("DOMContentLoaded", () => {
                        document.body.classList.add("workspace-transparent-mode");
                    });
                    // Fallback if already loaded
                    if (document.body) {
                        document.body.classList.add("workspace-transparent-mode");
                    }
                <\/script>
            `;

            // Inject cleanly into the document head
            if (content.match(/<head[^>]*>/i)) {
                return content.replace(/(<head[^>]*>)/i, `$1\n${injection}`);
            } else if (content.match(/<html[^>]*>/i)) {
                return content.replace(/(<html[^>]*>)/i, `$1\n<head>\n${injection}\n</head>`);
            } else {
                return injection + content;
            }
        }

        function openItem(id) {
            const item = workspaceItems.find(i => i.id === id);
            if (!item) return;

            activeItemId = id;
            renderList();

            const iframe = document.getElementById('mainFrame');
            const container = document.getElementById('workspaceContainer');
            const emptyState = document.getElementById('emptyState');

            iframe.removeAttribute('srcdoc');
            iframe.removeAttribute('src');

            if (item.type === 'file') {
                const processedContent = processImportedHtmlForTransparency(item.content);
                iframe.srcdoc = processedContent;
                iframe.style.backgroundColor = "transparent";
            } else {
                iframe.src = item.url;
                iframe.style.backgroundColor = "#ffffff";
            }

            emptyState.classList.add('opacity-0');
            emptyState.classList.remove('pointer-events-auto');
            container.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.add('pointer-events-auto');
        }

        function closeActiveItem() {
            activeItemId = null;
            const iframe = document.getElementById('mainFrame');
            const container = document.getElementById('workspaceContainer');
            const emptyState = document.getElementById('emptyState');

            iframe.removeAttribute('srcdoc');
            iframe.removeAttribute('src');

            container.classList.add('opacity-0', 'pointer-events-none');
            container.classList.remove('pointer-events-auto');
            emptyState.classList.remove('opacity-0');
            emptyState.classList.add('pointer-events-auto');
            renderList();
        }

        // Render List
        function renderList() {
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';

            if (workspaceItems.length === 0) {
                listEl.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center p-4">
                        <div class="w-12 h-12 rounded-full bg-white/5 border border-white/10 flex items-center justify-center mb-3">
                            <i data-lucide="inbox" class="w-5 h-5 text-white/30"></i>
                        </div>
                        <p class="text-white/40 text-xs leading-relaxed">Workspace empty.<br>Import files or add links.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const sortedItems = [...workspaceItems].sort((a, b) => {
                if (a.isFavorite && !b.isFavorite) return -1;
                if (!a.isFavorite && b.isFavorite) return 1;
                return a.name.localeCompare(b.name);
            });

            sortedItems.forEach(item => {
                const isActive = item.id === activeItemId;
                const icon = item.type === 'link' ? 'globe' : 'file-code';
                
                const el = document.createElement('div');
                el.className = `group flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all ${isActive ? 'bg-white/10 border border-white/15 shadow-inner' : 'hover:bg-white/5 border border-transparent'}`;
                
                el.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden flex-1" onclick="openItem('${item.id}')">
                        <div class="w-8 h-8 rounded-lg ${isActive ? 'bg-white/15 text-white' : 'bg-white/5 text-white/50 group-hover:text-white/80'} flex items-center justify-center shrink-0 transition-colors">
                            <i data-lucide="${icon}" class="w-4 h-4"></i>
                        </div>
                        <div class="flex-1 overflow-hidden">
                            <p class="text-sm font-medium ${isActive ? 'text-white' : 'text-white/70 group-hover:text-white'} truncate transition-colors">${item.name}</p>
                            <p class="text-[10px] ${isActive ? 'text-white/50' : 'text-white/30'} truncate uppercase tracking-wider">${item.type}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-2 shrink-0">
                        <button onclick="toggleFavorite('${item.id}')" class="p-1.5 rounded-lg hover:bg-white/10 text-white/40 hover:text-yellow-400 transition-colors" title="${item.isFavorite ? 'Unpin' : 'Pin'}">
                            <i data-lucide="star" class="w-4 h-4 ${item.isFavorite ? 'fill-yellow-400 text-yellow-400' : ''}"></i>
                        </button>
                        <button onclick="deleteItem('${item.id}')" class="p-1.5 rounded-lg hover:bg-red-500/20 text-white/40 hover:text-red-400 transition-colors" title="Delete">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;

                if(isActive) el.querySelector('.opacity-0').classList.remove('opacity-0');
                listEl.appendChild(el);
            });

            // Add clear active item button if something is open
            if(activeItemId) {
                const clearBtn = document.createElement('div');
                clearBtn.className = 'mt-4 pt-4 border-t border-white/[0.06]';
                clearBtn.innerHTML = `
                    <button onclick="closeActiveItem()" class="w-full flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10 border border-white/5 text-white/60 hover:text-white py-2 rounded-xl transition-all text-xs font-medium">
                        <i data-lucide="x-circle" class="w-3.5 h-3.5"></i> Close Active View
                    </button>
                `;
                listEl.appendChild(clearBtn);
            }

            lucide.createIcons();
        }
    </script>
</body>
</html>
