
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Support Spiel Generator</title>
    <style>
        :root {
            /* Background Mesh Gradient Colors */
            --bg-base: #050706; /* Deep black with a microscopic hint of green */
            --bg-glow-1: rgba(16, 185, 129, 0.12); /* Emerald glow */
            --bg-glow-2: rgba(0, 255, 136, 0.08); /* Bright neon glow */
            --bg-glow-3: rgba(2, 44, 34, 0.4); /* Deep forest shadow glow */

            /* Glass Card Properties (Dark Mode) */
            --card-bg: rgba(18, 24, 20, 0.45); /* Dark tinted glass */
            --card-border: rgba(16, 185, 129, 0.15); /* Subtle green frosted border */
            --card-hover-border: rgba(16, 185, 129, 0.3);
            --card-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            --card-inset: inset 0 1px 1px rgba(255, 255, 255, 0.03), inset 0 0 30px rgba(16, 185, 129, 0.03);
            --blur: blur(24px);
            --radius-large: 24px;
            --radius-pill: 50px;

            /* Typography & Accents */
            --text-title: #ffffff;
            --text-title-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
            --text-main: #e2e8f0; /* Off-white for high legibility */
            --text-muted: #94a3b8; /* Slate 400 */
            --text-faint: #475569; /* Slate 600 for headers */
            
            /* High contrast neon green for active elements */
            --accent-bg: linear-gradient(135deg, #00ff88, #10b981);
            --accent-text: #022c22; /* Very dark green (almost black) for active tab text */
            --accent-shadow: 0 8px 24px -6px rgba(0, 255, 136, 0.4);
            
            --success-bg: rgba(6, 78, 59, 0.85);
            --success-border: rgba(16, 185, 129, 0.4);
            
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-base);
            /* Dark mode mesh gradient with green orbs */
            background-image: 
                radial-gradient(circle at 15% 20%, var(--bg-glow-1) 0%, transparent 40%),
                radial-gradient(circle at 85% 10%, var(--bg-glow-2) 0%, transparent 35%),
                radial-gradient(circle at 50% 100%, var(--bg-glow-3) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 3rem 2rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-title);
            text-shadow: var(--text-title-shadow);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            max-width: 1300px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        @media (max-width: 960px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .premium-card {
            background: var(--card-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-large);
            box-shadow: var(--card-shadow), var(--card-inset);
            transition: var(--transition);
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .template-tabs {
            display: flex;
            padding: 0.5rem;
            border-radius: var(--radius-pill);
            background: rgba(0, 0, 0, 0.4); /* Darker inset container for tabs */
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 1.1rem 2rem;
            border-radius: var(--radius-pill);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--accent-bg);
            color: var(--accent-text);
            font-weight: 800;
            box-shadow: var(--accent-shadow);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2.5rem;
            min-height: 450px;
        }

        .panel-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header span:last-child {
            color: var(--text-faint);
            font-size: 0.75rem;
        }

        textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1.1rem;
            line-height: 1.8;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: var(--text-faint);
            font-weight: 400;
            font-style: italic;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
        }

        .preview-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2.5rem;
            cursor: pointer;
            position: relative;
        }

        /* Interactive hover effects for the copy-card */
        .preview-wrapper:hover {
            border-color: var(--card-hover-border);
            transform: translateY(-2px);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.9), var(--card-inset), 0 0 30px rgba(16, 185, 129, 0.1);
        }

        .preview-wrapper:active {
            transform: translateY(1px);
        }

        .preview-content {
            font-size: 1.1rem;
            line-height: 1.8;
            white-space: pre-wrap;
            color: var(--text-muted); /* Main spiel text is muted */
        }

        .custom-note-preview {
            color: #00ff88; /* Bright neon green for user input */
            font-weight: 500;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .empty-note-placeholder {
            color: var(--text-faint);
            font-style: italic;
            opacity: 0.6;
        }

        .toast {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px) scale(0.9);
            background: var(--success-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--success-border);
            color: #ffffff;
            padding: 1rem 2.5rem;
            border-radius: var(--radius-pill);
            font-weight: 600;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(16, 185, 129, 0.2);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast-icon {
            color: #00ff88;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0) scale(1);
            opacity: 1;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(16, 185, 129, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>Support Spiel Generator</h1>
    </header>

    <main class="container">
        
        <!-- Left Side: Controls & Input -->
        <section class="left-panel">
            <div class="template-tabs premium-card">
                <button class="tab-btn active" data-template="set1">Set 1 (First Contact)</button>
                <button class="tab-btn" data-template="set2">Set 2 (Follow Up)</button>
            </div>

            <div class="input-wrapper premium-card">
                <div class="panel-header">
                    <span>Custom Note</span>
                </div>
                <textarea id="noteInput" placeholder="Type your custom note here..." spellcheck="false"></textarea>
            </div>
        </section>

        <!-- Right Side: Live Preview (Clickable Card) -->
        <section class="right-panel">
            <div class="preview-wrapper premium-card" id="previewCard" title="Click anywhere to copy">
                <div class="panel-header">
                    <span>Live Preview</span>
                    <span style="color: var(--text-muted);">Click Card to Copy</span>
                </div>
                <div class="preview-content" id="previewContent"></div>
            </div>
        </section>

    </main>

    <!-- Success Toast -->
    <div class="toast" id="toastMsg">
        <span class="toast-icon">✓</span> Copied to clipboard
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Data
            const templates = {
                set1: {
                    greeting: "Greetings,\n\nThank you for reaching out to Easybet Customer support! My name is Raya, and I’ll be your support today.\n\n",
                    closing: "\n\nPlease don’t worry, I’m here to assist you every step of the way. You’re welcome to reply to this email or reach our support team via Live Chat at https://easybet.co.za/page/Landing-Page.\n\nWe value your cooperation and thank you for choosing Easybet!"
                },
                set2: {
                    greeting: "Greetings,\n\nThank you for getting back to Easybet Customer Support. My name is Raya, and I will be your support today.\n\n",
                    closing: "\n\nPlease don’t worry, I’m here to assist you every step of the way. You’re welcome to reply to this email or reach our support team via Live Chat at https://easybet.co.za/page/Landing-Page.\n\nWe value your cooperation and thank you for choosing Easybet!"
                }
            };

            let currentTemplateKey = 'set1';

            // DOM Elements
            const noteInput = document.getElementById('noteInput');
            const previewContent = document.getElementById('previewContent');
            const previewCard = document.getElementById('previewCard');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const toastMsg = document.getElementById('toastMsg');

            // Render Preview HTML
            function renderPreview() {
                const template = templates[currentTemplateKey];
                const userNote = noteInput.value;
                
                let noteHtml = '';
                if (userNote.trim() !== '') {
                    noteHtml = `<span class="custom-note-preview">${escapeHTML(userNote)}</span>`;
                } else {
                    noteHtml = `<span class="empty-note-placeholder">[Your custom note will appear here]</span>`;
                }

                // Main template text remains muted, custom note is highlighted
                const fullHtml = 
                    `<span style="color: var(--text-main);">${escapeHTML(template.greeting)}</span>` + 
                    noteHtml + 
                    `<span style="color: var(--text-main);">${escapeHTML(template.closing)}</span>`;
                    
                previewContent.innerHTML = fullHtml;
            }

            // Get Plain Text for Clipboard
            function getPlainTextForCopy() {
                const template = templates[currentTemplateKey];
                const userNote = noteInput.value.trim();
                return template.greeting + userNote + template.closing;
            }

            // XSS Prevention
            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        "'": '&#39;',
                        '"': '&quot;'
                    }[tag])
                );
            }

            // Toast Animation Logic
            let toastTimeout;
            function showToast() {
                toastMsg.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastMsg.classList.remove('show');
                }, 2500);
            }

            // Real-time input rendering
            noteInput.addEventListener('input', renderPreview);

            // Tab Switching Logic
            tabBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTemplateKey = e.target.getAttribute('data-template');
                    renderPreview();
                });
            });

            // Click-to-Copy Logic
            previewCard.addEventListener('click', () => {
                const textToCopy = getPlainTextForCopy();
                
                // Modern Clipboard API
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        showToast();
                    }).catch(err => fallbackCopy(textToCopy));
                } else {
                    fallbackCopy(textToCopy);
                }
            });

            // Fallback for older browsers / restrictive environments
            function fallbackCopy(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(textArea);
            }

            // Initialize App
            renderPreview();
        });
    </script>
</body>
</html>
