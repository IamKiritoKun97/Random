<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Support 1st and Second Touch</title>
    
    <!-- SVG Favicon in Easybet Orange Theme -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23141624'/><path d='M30 32C30 27.5817 33.5817 24 38 24H62C66.4183 24 70 27.5817 70 32V52C70 56.4183 66.4183 60 62 60H50L36 72V60H38C33.5817 60 30 56.4183 30 52V32Z' fill='url(%23orangeGrad)'/><circle cx='42' cy='42' r='4' fill='%23ffffff'/><circle cx='50' cy='42' r='4' fill='%23ffffff'/><circle cx='58' cy='42' r='4' fill='%23ffffff'/><defs><linearGradient id='orangeGrad' x1='30' y1='24' x2='70' y2='72' gradientUnits='userSpaceOnUse'><stop stop-color='%23F97316'/><stop offset='1' stop-color='%23EA580C'/></linearGradient></defs></svg>">

    <style>
        :root {
            /* Palette Theme Variables */
            --bg-base: #141624;         /* Deep dark background */
            --panel-bg: #1E2132;        /* Panel / Sidebar color base */
            --border-subtle: #2D3147;   /* Subtle panel borders */
            --border-highlight: #3B405A;/* Border hover/focus highlight */
            --text-muted: #8B93A6;      /* Secondary / Muted text */
            --text-light: #E2E4EB;      /* Primary text */
            --text-faint: #52586B;      /* Headers & placeholders */
            
            /* Accent Colors */
            --accent-orange: #F97316;   /* Easybet orange accent */
            --accent-orange-bg: rgba(249, 115, 22, 0.08);
            --accent-blue: #3b82f6;     /* Secondary blue accent */
            --accent-gradient: linear-gradient(135deg, #F97316, #ea580c);
            --accent-shadow: 0 8px 24px -6px rgba(249, 115, 22, 0.4);

            /* Glass Card Properties */
            --card-bg: rgba(30, 33, 50, 0.65); /* Translucent panel color */
            --card-border: var(--border-subtle);
            --card-hover-border: var(--border-highlight);
            --card-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            --card-inset: inset 0 1px 1px rgba(255, 255, 255, 0.05), inset 0 0 30px rgba(249, 115, 22, 0.02);
            --blur: blur(24px);
            --radius-large: 24px;
            --radius-pill: 50px;

            /* Notifications & Toast */
            --success-bg: rgba(30, 33, 50, 0.95);
            --success-border: rgba(249, 115, 22, 0.5);

            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-base);
            /* Dark overlay combined with Unsplash image */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(249, 115, 22, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 10%, rgba(59, 130, 246, 0.1) 0%, transparent 35%),
                linear-gradient(135deg, rgba(20, 22, 36, 0.88), rgba(20, 22, 36, 0.82)),
                url('https://images.unsplash.com/photo-1789011310705-a6ebc5d3ebb5');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 3rem 2rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-light);
            text-shadow: 0 0 20px rgba(249, 115, 22, 0.25);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            max-width: 1300px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        @media (max-width: 960px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .premium-card {
            background: var(--card-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-large);
            box-shadow: var(--card-shadow), var(--card-inset);
            transition: var(--transition);
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .template-tabs {
            display: flex;
            padding: 0.5rem;
            border-radius: var(--radius-pill);
            background: rgba(20, 22, 36, 0.6);
            border: 1px solid var(--border-subtle);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 1.1rem 2rem;
            border-radius: var(--radius-pill);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.04);
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            font-weight: 800;
            box-shadow: var(--accent-shadow);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2.5rem;
            min-height: 450px;
        }

        .panel-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header span:last-child {
            color: var(--text-faint);
            font-size: 0.75rem;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 640px) {
            .controls-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
                margin-bottom: 1.5rem;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .control-group input,
        .control-group select {
            width: 100%;
            background: rgba(20, 22, 36, 0.6);
            border: 1px solid var(--border-subtle);
            color: var(--text-light);
            padding: 0.85rem 1rem;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        .control-group input:focus,
        .control-group select:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.2);
            background: rgba(20, 22, 36, 0.85);
        }

        .control-group select option {
            background-color: var(--panel-bg);
            color: var(--text-light);
        }

        .reset-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .reset-btn:hover {
            background: var(--accent-orange-bg);
            color: var(--accent-orange);
            border-color: var(--accent-orange);
        }

        textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-light);
            font-family: inherit;
            font-size: 1.1rem;
            line-height: 1.8;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: var(--text-faint);
            font-weight: 400;
            font-style: italic;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
        }

        .preview-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2.5rem;
            cursor: pointer;
            position: relative;
        }

        .preview-wrapper:hover {
            border-color: var(--border-highlight);
            transform: translateY(-2px);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.7), var(--card-inset), 0 0 30px rgba(249, 115, 22, 0.12);
        }

        .preview-wrapper:active {
            transform: translateY(1px);
        }

        .preview-content {
            font-size: 1.1rem;
            line-height: 1.8;
            white-space: pre-wrap;
            color: var(--text-muted);
        }

        /* Highlighted Custom Note Preview */
        .custom-note-preview {
            color: var(--accent-orange);
            font-weight: 600;
            text-shadow: 0 0 15px rgba(249, 115, 22, 0.35);
        }

        .empty-note-placeholder {
            color: var(--text-faint);
            font-style: italic;
            opacity: 0.7;
        }

        /* Success Toast Notification */
        .toast {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px) scale(0.9);
            background: var(--success-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--success-border);
            color: var(--text-light);
            padding: 1rem 2.5rem;
            border-radius: var(--radius-pill);
            font-weight: 600;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(249, 115, 22, 0.25);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast-icon {
            color: var(--accent-orange);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0) scale(1);
            opacity: 1;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: var(--border-highlight);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--accent-orange);
        }
    </style>
</head>
<body>

    <header>
        <h1>Support Spiel Generator</h1>
    </header>

    <main class="container">
        
        <!-- Left Side: Controls & Input -->
        <section class="left-panel">
            <div class="template-tabs premium-card">
                <button class="tab-btn active" data-template="set1">Set 1 (First Contact)</button>
                <button class="tab-btn" data-template="set2">Set 2 (Follow Up)</button>
            </div>

            <div class="input-wrapper premium-card">
                <div class="panel-header">
                    <span>Personalization</span>
                    <button id="resetBtn" class="reset-btn">Reset Settings</button>
                </div>

                <div class="controls-grid">
                    <div class="control-group">
                        <label for="agentName">Agent Name</label>
                        <input type="text" id="agentName" value="Raya" autocomplete="off" spellcheck="false">
                    </div>
                    
                    <div class="control-group">
                        <label for="greetingSelect">Greeting</label>
                        <select id="greetingSelect">
                            <option value="Greetings,">Greetings,</option>
                            <option value="Hi,">Hi,</option>
                            <option value="Hello,">Hello,</option>
                            <option value="Hello there,">Hello there,</option>
                            <option value="Hi there,">Hi there,</option>
                            <option value="Good day,">Good day,</option>
                            <option value="Good morning,">Good morning,</option>
                            <option value="Good afternoon,">Good afternoon,</option>
                            <option value="Good evening,">Good evening,</option>
                        </select>
                    </div>
                </div>

                <div class="panel-header">
                    <span>Custom Note</span>
                </div>
                <textarea id="noteInput" placeholder="Type your custom note here..." spellcheck="false"></textarea>
            </div>
        </section>

        <!-- Right Side: Live Preview (Clickable Card) -->
        <section class="right-panel">
            <div class="preview-wrapper premium-card" id="previewCard" title="Click anywhere to copy">
                <div class="panel-header">
                    <span>Live Preview</span>
                    <span style="color: var(--accent-orange);">Click Card to Copy</span>
                </div>
                <div class="preview-content" id="previewContent"></div>
            </div>
        </section>

    </main>

    <!-- Success Toast -->
    <div class="toast" id="toastMsg">
        <span class="toast-icon">✓</span> Copied to clipboard
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Default Settings
            const DEFAULT_SETTINGS = {
                agentName: "Raya",
                greeting: "Greetings,",
                customNote: "",
                template: "set1"
            };

            // DOM Elements
            const agentNameInput = document.getElementById('agentName');
            const greetingSelect = document.getElementById('greetingSelect');
            const noteInput = document.getElementById('noteInput');
            const previewContent = document.getElementById('previewContent');
            const previewCard = document.getElementById('previewCard');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const toastMsg = document.getElementById('toastMsg');
            const resetBtn = document.getElementById('resetBtn');

            let currentTemplateKey = DEFAULT_SETTINGS.template;

            // Shared Template Logic
            const sharedClosing = "\n\nPlease don’t worry, I’m here to assist you every step of the way. You’re welcome to reply to this email or reach our support team via Live Chat at https://easybet.co.za/page/Landing-Page.\n\nWe value your cooperation and thank you for choosing Easybet!";

            function getDynamicIntro(key, name, greeting) {
                const safeName = name.trim() || DEFAULT_SETTINGS.agentName;
                
                if (key === 'set1') {
                    return `${greeting}\n\nThank you for reaching out to Easybet Customer support! My name is ${safeName}, and I’ll be your support today.\n\n`;
                }
                
                if (key === 'set2') {
                    return `${greeting}\n\nThank you for getting back to Easybet Customer Support. My name is ${safeName}, and I will be your support today.\n\n`;
                }
            }

            // LocalStorage Logic
            function loadSettings() {
                const savedName = localStorage.getItem('easybet_agent_name');
                if (savedName !== null) agentNameInput.value = savedName;

                const savedGreeting = localStorage.getItem('easybet_greeting');
                if (savedGreeting !== null) greetingSelect.value = savedGreeting;

                const savedNote = localStorage.getItem('easybet_custom_note');
                if (savedNote !== null) noteInput.value = savedNote;

                const savedTemplate = localStorage.getItem('easybet_template');
                if (savedTemplate !== null && (savedTemplate === 'set1' || savedTemplate === 'set2')) {
                    currentTemplateKey = savedTemplate;
                    tabBtns.forEach(b => {
                        if (b.getAttribute('data-template') === currentTemplateKey) {
                            b.classList.add('active');
                        } else {
                            b.classList.remove('active');
                        }
                    });
                }
            }

            function saveSettings() {
                localStorage.setItem('easybet_agent_name', agentNameInput.value);
                localStorage.setItem('easybet_greeting', greetingSelect.value);
                localStorage.setItem('easybet_custom_note', noteInput.value);
                localStorage.setItem('easybet_template', currentTemplateKey);
            }

            function resetSettings() {
                agentNameInput.value = DEFAULT_SETTINGS.agentName;
                greetingSelect.value = DEFAULT_SETTINGS.greeting;
                noteInput.value = DEFAULT_SETTINGS.customNote;
                currentTemplateKey = DEFAULT_SETTINGS.template;

                // Reset UI Tabs
                tabBtns.forEach(b => {
                    if (b.getAttribute('data-template') === currentTemplateKey) {
                        b.classList.add('active');
                    } else {
                        b.classList.remove('active');
                    }
                });

                // Clear from LocalStorage
                localStorage.removeItem('easybet_agent_name');
                localStorage.removeItem('easybet_greeting');
                localStorage.removeItem('easybet_custom_note');
                localStorage.removeItem('easybet_template');

                renderPreview();
            }

            // XSS Prevention
            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        "'": '&#39;',
                        '"': '&quot;'
                    }[tag])
                );
            }

            // Render Preview HTML
            function renderPreview() {
                const userNote = noteInput.value;
                const dynamicIntro = getDynamicIntro(currentTemplateKey, agentNameInput.value, greetingSelect.value);
                
                let noteHtml = '';
                if (userNote.trim() !== '') {
                    noteHtml = `<span class="custom-note-preview">${escapeHTML(userNote)}</span>`;
                } else {
                    noteHtml = `<span class="empty-note-placeholder">[Your custom note will appear here]</span>`;
                }

                const fullHtml = 
                    `<span style="color: var(--text-light);">${escapeHTML(dynamicIntro)}</span>` + 
                    noteHtml + 
                    `<span style="color: var(--text-light);">${escapeHTML(sharedClosing)}</span>`;
                    
                previewContent.innerHTML = fullHtml;
            }

            // Get Plain Text for Clipboard
            function getPlainTextForCopy() {
                const userNote = noteInput.value.trim();
                const dynamicIntro = getDynamicIntro(currentTemplateKey, agentNameInput.value, greetingSelect.value);
                return dynamicIntro + userNote + sharedClosing;
            }

            // iPhone-style message tone (Web Audio, no external files)
            let audioCtx;
            function playMessageTone() {
                try {
                    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const notes = [1318.51, 1046.50, 1174.66]; // E6, C6, D6 - three soft bell tones
                    const start = audioCtx.currentTime + 0.01;
                    const step = 0.13;
                    notes.forEach((freq, i) => {
                        const t = start + i * step;
                        [[freq, 0.32], [freq * 2.01, 0.09], [freq * 3.02, 0.03]].forEach(([f, vol]) => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.type = 'sine';
                            osc.frequency.value = f;
                            gain.gain.setValueAtTime(0, t);
                            gain.gain.linearRampToValueAtTime(vol, t + 0.008);
                            gain.gain.exponentialRampToValueAtTime(0.0001, t + (i === 2 ? 0.9 : 0.42));
                            osc.connect(gain).connect(audioCtx.destination);
                            osc.start(t);
                            osc.stop(t + 1);
                        });
                    });
                } catch (err) {
                    console.error('Sound unavailable', err);
                }
            }

            // Toast Animation
            let toastTimeout;
            function showToast() {
                playMessageTone();
                toastMsg.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastMsg.classList.remove('show');
                }, 2500);
            }

            // Event Listeners for Live Updates & Persistence
            const updateAndSave = () => {
                saveSettings();
                renderPreview();
            };

            agentNameInput.addEventListener('input', updateAndSave);
            greetingSelect.addEventListener('change', updateAndSave);
            noteInput.addEventListener('input', updateAndSave);
            
            resetBtn.addEventListener('click', resetSettings);

            // Tab Switching Logic
            tabBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTemplateKey = e.target.getAttribute('data-template');
                    updateAndSave();
                });
            });

            // Click-to-Copy Logic
            previewCard.addEventListener('click', () => {
                const textToCopy = getPlainTextForCopy();
                
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        showToast();
                    }).catch(() => fallbackCopy(textToCopy));
                } else {
                    fallbackCopy(textToCopy);
                }
            });

            function fallbackCopy(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(textArea);
            }

            // Initialize
            loadSettings();
            renderPreview();
        });
    </script>
</body>
</html>
