            flex-direction: column;

            right: -36px;

            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);

        }

        .toast.visible {
            opacity: 1;

        @media (max-width: 768px) {

            .promo-actions {

                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    showToast(successMessage);
                } else {
                    // Fallback for older browsers
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "absolute";
                    textArea.style.left = "-999999px";
                    document.body.prepend(textArea);

                    document.execCommand('copy');

                sidebarContent.appendChild(label);

                unstarredList.forEach(p => {
                    sidebarContent.appendChild(createItemElement(p, false));
                });
            }
        };

        const createItemElement = (promo, isStarred) => {
            const div = document.createElement('div');
            div.className = 'promo-item';
            // Only make it draggable if it's starred AND AZ sorting is OFF
            if (isStarred && !state.sortAZ && state.searchQuery === '') {
                div.classList.add('draggable');
                div.setAttribute('draggable', 'true');
                attachDragEvents(div, promo.id);
            }
            div.dataset.id = promo.id;

            const starBtn = document.createElement('button');
            starBtn.className = `star-btn ${isStarred ? 'starred' : ''}`;
            starBtn.innerHTML = isStarred ? '★' : '☆';
            starBtn.setAttribute('aria-label', isStarred ? 'Remove from favorites' : 'Add to favorites');
            
            const nameSpan = document.createElement('span');
            nameSpan.className = 'promo-name';
            nameSpan.textContent = promo.name;
            
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'promo-actions';
            
            const copyNameBtn = document.createElement('button');
            copyNameBtn.className = 'action-btn';
            copyNameBtn.textContent = 'Copy Name';
            
            const copyLinkBtn = document.createElement('button');
            copyLinkBtn.className = 'action-btn';
            copyLinkBtn.textContent = 'Copy Link';

            // Events
            starBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleStar(promo.id);
            });

            copyNameBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                copyToClipboard(promo.name, 'Name copied');
            });

            copyLinkBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                copyToClipboard(promo.url, 'Link copied');
            });

            // Main Row Click
            div.addEventListener('click', (e) => {
                if(e.target.closest('.star-btn') || e.target.closest('.action-btn')) return;
                copyToClipboard(promo.url, 'Link copied');
            });

            actionsDiv.appendChild(copyNameBtn);
            actionsDiv.appendChild(copyLinkBtn);
            div.appendChild(starBtn);
            div.appendChild(nameSpan);
            div.appendChild(actionsDiv);

            return div;
        };

        const toggleStar = (id) => {
            if (state.starredIds.includes(id)) {
                state.starredIds = state.starredIds.filter(starredId => starredId !== id);
            } else {
                state.starredIds.push(id);
            }
            saveState();
            render();
        };

        let draggedId = null;

        const attachDragEvents = (el, id) => {
            el.addEventListener('dragstart', (e) => {
                draggedId = id;
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => el.classList.add('dragging'), 0);
            });

            el.addEventListener('dragend', () => {
                draggedId = null;
                el.classList.remove('dragging');
                document.querySelectorAll('.promo-item').forEach(item => {
                    item.classList.remove('drag-over');
                });
            });

            el.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (draggedId === id) return;
                el.classList.add('drag-over');
            });

            el.addEventListener('dragleave', () => {
                el.classList.remove('drag-over');
            });

            el.addEventListener('drop', (e) => {
                e.preventDefault();
                el.classList.remove('drag-over');
                if (draggedId && draggedId !== id) {
                    reorderStarred(draggedId, id);
                }
            });
        };

        const reorderStarred = (draggedId, targetId) => {
            const oldIndex = state.starredIds.indexOf(draggedId);
            const newIndex = state.starredIds.indexOf(targetId);
            
            if (oldIndex === -1 || newIndex === -1) return;
            
            // Remove from old
            const [movedItem] = state.starredIds.splice(oldIndex, 1);
            // Insert at new
            state.starredIds.splice(newIndex, 0, movedItem);
            
            saveState();
            render();
        };

        // Initial render
        render();
    </script>
</body>
</html>
