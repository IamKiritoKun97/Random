<style>
/* ---------- Tokens ---------- */
:root{
  --sw:min(320px,85vw);
  --ink:#eef4f1; --mute:#93a69d; --line:rgba(255,255,255,.09);
  --glass:rgba(14,14,16,.55); --accent:#a8d8bd; --star:#e8c877;
  --ease:cubic-bezier(.32,.72,0,1);
  --io:cubic-bezier(.65,0,.35,1);  /* ease-in-out for the sidebar */
  --dur:.65s;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Source Sans 3","Segoe UI","SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:#0b0b0d;overflow:hidden;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;font-kerning:normal;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Background ---------- */
.bg{
  position:fixed;inset:0;z-index:-2;background:#0b0b0d
    url("https://images.unsplash.com/photo-1789011310705-a6ebc5d3ebb5");
  background-size:cover;background-position:center;
}
.veil{
  position:fixed;inset:0;z-index:-1;
  /* neutral black only: no colour tint, original photo colours preserved */
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.12),rgba(0,0,0,.50) 100%),rgba(0,0,0,.26);
}

/* ---------- Main title ---------- */
/* Main content never moves: the sidebar overlays it */
main{height:100dvh;display:grid;place-items:center;padding:24px}
h1{
  max-width:18ch;text-align:center;text-wrap:balance;
  font-size:clamp(2.25rem,5.8vw,4.25rem);font-weight:600;letter-spacing:-.025em;line-height:1.08;
  text-shadow:0 2px 30px rgba(0,0,0,.45);
}
/* Typewriter: the not-yet-typed remainder stays in the layout (invisible) so the title never jumps or re-wraps */
.rest{color:transparent;text-shadow:none;user-select:none}
.caret{display:inline-block;width:0;position:relative}
.caret::after{
  content:"";position:absolute;left:2px;bottom:.12em;width:.06em;min-width:2px;height:.85em;
  background:var(--ink);border-radius:2px;opacity:0;transition:opacity .5s ease;
}
h1.typing .caret::after{opacity:.9;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}

/* ---------- Sidebar ---------- */
.side{
  position:fixed;z-index:20;top:12px;bottom:12px;left:0;width:var(--sw);
  display:flex;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
  border:1px solid var(--line);border-left:0;border-radius:0 22px 22px 0;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  opacity:0;visibility:hidden;transform:translate3d(-100%,0,0);will-change:transform,opacity;
  transition:transform var(--dur) var(--io),opacity var(--dur) var(--io),visibility 0s linear var(--dur);
}
body.open .side{
  opacity:1;visibility:visible;transform:translate3d(0,0,0);
  transition:transform var(--dur) var(--io),opacity var(--dur) var(--io),visibility 0s;
}
/* panel contents fade in just after the panel starts moving, and out first when closing */
.side>*{opacity:0;transition:opacity .3s ease}
body.open .side>*{opacity:1;transition:opacity .45s ease .2s}

/* The arrow tab uses the exact same transform + curve, so it stays attached to the panel edge */
.tab{
  position:fixed;z-index:30;top:50%;left:0;transform:translate3d(0,-50%,0);will-change:transform;
  width:28px;height:64px;display:grid;place-items:center;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-left:0;border-radius:0 14px 14px 0;
  transition:transform var(--dur) var(--io),background .2s;
}
.tab:hover{background:rgba(255,255,255,.12)}
.tab svg{width:16px;height:16px;transition:transform var(--dur) var(--io)}
body.open .tab{transform:translate3d(var(--sw),-50%,0)}
body.open .tab svg{transform:rotate(180deg)}

/* Search + sort */
.tools{display:flex;gap:8px;padding:18px 16px 12px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--mute);pointer-events:none}
input{
  width:100%;height:40px;padding:0 12px 0 36px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:inherit;font-size:1rem;
  transition:border-color .2s,background .2s;
}
input::placeholder{color:var(--mute)}
input:focus{border-color:rgba(168,216,189,.4);background:rgba(255,255,255,.08);outline:none}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sort{
  height:40px;padding:0 12px;border-radius:12px;cursor:pointer;font-size:.9rem;font-weight:600;color:var(--mute);
  border:1px solid var(--line);background:rgba(255,255,255,.05);transition:all .2s;
}
.sort[aria-pressed="true"]{color:var(--accent);border-color:rgba(168,216,189,.35);background:rgba(168,216,189,.08)}

/* List */
.list{flex:1;overflow-y:auto;padding:0 10px 14px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
ul{list-style:none;padding:0;display:grid;gap:2px}
.lbl{font-size:.8rem;letter-spacing:.03em;color:var(--mute);padding:14px 10px 6px}
.empty{font-size:.95rem;color:var(--mute);text-align:center;padding:28px 0}

.row{
  position:relative;display:flex;align-items:flex-start;gap:2px;padding:8px 6px 8px 2px;
  border:1px solid transparent;border-radius:12px;
  transition:background .2s,border-color .2s,transform .2s,opacity .2s;
}
.row:hover,.row:focus-within{background:rgba(255,255,255,.06);border-color:var(--line);transform:translateY(-1px)}
.star{
  flex:none;width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;
  background:none;color:var(--mute);font-size:17px;line-height:1;cursor:pointer;transition:color .2s;
}
.star:hover{color:var(--ink)}
.star[aria-pressed="true"]{color:var(--star)}
.star.pop{animation:pop .3s var(--ease)}
@keyframes pop{40%{transform:scale(1.35)}}

.body{flex:1;min-width:0;padding-top:5px}
.name{
  display:block;color:var(--ink);text-decoration:none;font-size:1.02rem;font-weight:500;line-height:1.35;overflow-wrap:anywhere;
}
.name:hover{text-decoration:underline;text-decoration-color:rgba(255,255,255,.4);text-underline-offset:3px}

/* Hover actions: Copy Name / Copy Link */
.actions{
  display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-3px);
  transition:grid-template-rows .25s var(--ease),opacity .2s,transform .25s var(--ease);
}
.actions>div{overflow:hidden;min-height:0;display:flex;gap:6px;padding:0 2px}
.row:hover .actions,.row:focus-within .actions{grid-template-rows:1fr;opacity:1;transform:none}
.actions button{
  margin:8px 0 3px;height:26px;padding:0 10px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600;
  border:1px solid var(--line);background:rgba(255,255,255,.06);transition:background .2s,color .2s,border-color .2s;
}
.actions button:hover{background:rgba(255,255,255,.13)}
.actions button.ok{color:var(--accent);border-color:rgba(168,216,189,.4)}
@media(hover:none){ /* touch: keep actions visible */
  .actions{grid-template-rows:1fr;opacity:1;transform:none}
  .row:hover{transform:none}
}

/* Drag handle + states */
.grip{
  flex:none;width:24px;height:32px;display:grid;place-items:center;border:0;background:none;
  color:var(--mute);opacity:.55;cursor:grab;touch-action:none;transition:opacity .2s;
}
.row:hover .grip,.grip:focus-visible{opacity:1}
.row.dragging{opacity:.4}
.row.drop-before::before,.row.drop-after::after{
  content:"";position:absolute;left:8px;right:8px;height:2px;border-radius:2px;background:var(--accent);
}
.row.drop-before::before{top:-2px}
.row.drop-after::after{bottom:-2px}

/* Copy confirmation */
.toast{
  position:fixed;z-index:40;left:50%;bottom:28px;transform:translate(-50%,8px);
  padding:10px 18px;border-radius:999px;font-size:.95rem;font-weight:500;
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .3s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:720px){input{font-size:16px}}
@media(prefers-reduced-motion:reduce){.star.pop,h1.typing .caret::after{animation:none}}
</style>
</head>

<script>
/* ---------- Title typewriter ----------
   Types the title immediately on load, then again every 20 seconds.
   Time-based (requestAnimationFrame), so it stays reliable even if the tab is busy.
   The untyped remainder stays in the layout (invisible) so the title never shifts. */
(function () {
  var h1 = document.querySelector("h1");
  var text = h1.textContent.trim();
  var chars = Array.from(text);
  h1.setAttribute("aria-label", text);
  h1.innerHTML = '<span aria-hidden="true"><span class="typed"></span><i class="caret"></i><span class="rest"></span></span>';
  var typed = h1.querySelector(".typed"), rest = h1.querySelector(".rest");
  var run = 0;

  function show(n) { typed.textContent = chars.slice(0, n).join(""); rest.textContent = chars.slice(n).join(""); }

  function type() {
    var id = ++run, t = 40, times = [], shown = 0;
    chars.forEach(function (c) { t += 45 + Math.random() * 45 + (c === " " ? 60 : 0); times.push(t); }); // natural rhythm
    var t0 = performance.now();
    h1.classList.add("typing");
    show(0);
    (function frame() {
      if (id !== run) return;                                   // a newer cycle took over
      var el = performance.now() - t0;
      if (times[shown] <= el) show(++shown);                    // exactly one letter per step, never a burst
      if (shown < chars.length) requestAnimationFrame(frame);
      else setTimeout(function () { if (id === run) h1.classList.remove("typing"); }, 900);
    })();
  }

  type();                          // starts immediately on load
  setInterval(type, 20000);        // repeats every 20 seconds
})();
</script>

/* ---------- State ---------- */
const KEY = "easybetPromotionsState";
const byId = new Map(promotions.map(p => [p.id, p]));
const $ = id => document.getElementById(id);
const [$list, $q, $sort, $tab, $toast, $side] = ["list", "q", "sort", "tab", "toast", "side"].map($);
let starred = load();   // ordered array of starred ids (order = manual drag order)
let sortAZ = true;
let query = "";

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(s && s.starred)) return [...new Set(s.starred.filter(id => byId.has(id)))];
  } catch (e) {}
  return [];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ starred })); } catch (e) {} }

/* ---------- Clipboard + toast ---------- */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try { // fallback for older browsers / restricted contexts
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", "");
    t.style.cssText = "position:fixed;top:-100px;opacity:0";
    document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy"); t.remove(); return ok;
  } catch (e) { return false; }
}
let timer;
function toast(msg) {
  $toast.textContent = msg; $toast.classList.add("show");
  clearTimeout(timer); timer = setTimeout(() => $toast.classList.remove("show"), 1800);
}

/* ---------- Rendering ---------- */
const GRIP = '<button class="grip" type="button"><svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="3" r="1.3"/><circle cx="8" cy="3" r="1.3"/><circle cx="2" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="2" cy="13" r="1.3"/><circle cx="8" cy="13" r="1.3"/></svg></button>';

function makeRow(p, isStar) {
  const li = document.createElement("li");
  li.className = "row" + (isStar ? " starred" : "");
  li.dataset.id = p.id;
  li.innerHTML =
    '<button class="star" type="button"></button>' +
    '<div class="body"><a class="name" target="_blank" rel="noopener noreferrer"></a>' +
    '<div class="actions"><div><button type="button" data-copy="name">Copy Name</button>' +
    '<button type="button" data-copy="url">Copy Link</button></div></div></div>' + (isStar ? GRIP : "");
  const a = li.querySelector(".name");
  a.textContent = p.name;
  a.setAttribute("href", p.url);            // URL kept exactly as supplied
  const s = li.querySelector(".star");
  s.textContent = isStar ? "★" : "☆";
  s.setAttribute("aria-pressed", isStar);
  s.setAttribute("aria-label", (isStar ? "Unstar " : "Star ") + p.name);
  li.querySelectorAll("[data-copy]").forEach(b => b.setAttribute("aria-label", b.textContent + ": " + p.name));
  const g = li.querySelector(".grip");
  if (g) g.setAttribute("aria-label", "Reorder " + p.name + ". Use up and down arrow keys.");
  return li;
}

function section(items, isStar) {
  const ul = document.createElement("ul");
  items.forEach(p => ul.appendChild(makeRow(p, isStar)));
  return ul;
}
function label(text) {
  const d = document.createElement("div"); d.className = "lbl"; d.textContent = text; return d;
}

function render() {
  const q = query.trim().toLowerCase();
  const match = p => p.name.toLowerCase().includes(q);
  const stars = starred.map(id => byId.get(id)).filter(match);
  const rest = promotions.filter(p => !starred.includes(p.id) && match(p));
  if (sortAZ) rest.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));

  $list.replaceChildren();
  if (!stars.length && !rest.length) {
    const d = document.createElement("div"); d.className = "empty"; d.textContent = "No promotions found";
    $list.appendChild(d); return;
  }
  if (stars.length) { $list.append(label("Starred"), section(stars, true)); }
  if (rest.length) { if (stars.length) $list.appendChild(label("All promotions")); $list.appendChild(section(rest, false)); }
}

/* ---------- Starring ---------- */
function toggleStar(id) {
  starred = starred.includes(id) ? starred.filter(x => x !== id) : [...starred, id];
  save(); render();
  const s = $list.querySelector('[data-id="' + id + '"] .star');
  if (s) { s.focus({ preventScroll: true }); s.classList.add("pop"); }
}

/* ---------- Reordering (pointer-based; works with mouse and touch) ---------- */
function moveStar(id, targetId, after) {
  const arr = starred.filter(x => x !== id);
  arr.splice(arr.indexOf(targetId) + (after ? 1 : 0), 0, id);
  starred = arr; save();
}

function startDrag(e, el) {
  e.preventDefault();
  const id = el.dataset.id;
  let target = null, after = false;
  el.classList.add("dragging");
  const clear = () => $list.querySelectorAll(".drop-before,.drop-after").forEach(n => n.classList.remove("drop-before", "drop-after"));
  const move = ev => {
    clear();
    const hit = document.elementFromPoint(ev.clientX, ev.clientY);
    const r = hit && hit.closest(".row.starred");
    if (r && r !== el) {
      const b = r.getBoundingClientRect();
      after = ev.clientY > b.top + b.height / 2; target = r;
      r.classList.add(after ? "drop-after" : "drop-before");
    } else target = null;
  };
  const end = ev => {
    ["pointermove", "pointerup", "pointercancel"].forEach((t, i) => window.removeEventListener(t, [move, end, end][i]));
    if (target && ev.type === "pointerup") moveStar(id, target.dataset.id, after);
    render();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end);
  window.addEventListener("pointercancel", end);
}

/* ---------- List events (delegated) ---------- */
$list.addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b) return;
  const p = byId.get(b.closest(".row").dataset.id);
  if (b.classList.contains("star")) return toggleStar(p.id);
  if (b.dataset.copy) {
    const isName = b.dataset.copy === "name";
    const ok = await copyText(isName ? p.name : p.url);
    toast(ok ? (isName ? "Name copied" : "Link copied") : "Couldn’t copy");
    if (ok) { b.classList.add("ok"); setTimeout(() => b.classList.remove("ok"), 1200); }
  }
});
$list.addEventListener("pointerdown", e => {
  const g = e.target.closest(".grip");
  if (g && e.button === 0) startDrag(e, g.closest(".row"));
});
$list.addEventListener("keydown", e => { // keyboard reordering on the grip
  const g = e.target.closest(".grip");
  if (!g || !["ArrowUp", "ArrowDown"].includes(e.key)) return;
  e.preventDefault();
  const row = g.closest(".row"), down = e.key === "ArrowDown";
  const n = down ? row.nextElementSibling : row.previousElementSibling;
  if (!n || !n.classList.contains("starred")) return;
  moveStar(row.dataset.id, n.dataset.id, down); render();
  $list.querySelector('[data-id="' + row.dataset.id + '"] .grip').focus();
});
$list.addEventListener("animationend", e => e.target.classList.remove("pop"));

/* ---------- Search, sort, sidebar ---------- */
$q.addEventListener("input", () => { query = $q.value; render(); });
$sort.addEventListener("click", () => {
  sortAZ = !sortAZ; $sort.setAttribute("aria-pressed", sortAZ); render();
});
function setOpen(open) {
  document.body.classList.toggle("open", open);
  $tab.setAttribute("aria-expanded", open);
  $tab.setAttribute("aria-label", open ? "Close promotions sidebar" : "Open promotions sidebar");
}
$tab.addEventListener("click", () => setOpen(!document.body.classList.contains("open")));
document.addEventListener("keydown", e => { if (e.key === "Escape") setOpen(false); });
// Click/tap anywhere outside the sidebar (and its arrow) closes it.
// pointerdown is used so list re-renders or drag releases can't cause false closes.
document.addEventListener("pointerdown", e => {
  if (document.body.classList.contains("open") && !e.target.closest("#side, #tab")) setOpen(false);
});

render();
</script>
