<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAST Live - Premium Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0e14;
            --card-bg: #111821;
            --accent: #ffcc00; /* Easybet Yellow */
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .glass-card {
            background: linear-gradient(145deg, #161e29, #0d131a);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 40px;
            padding: 2.5rem 3rem;
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
            width: 90%;
            max-width: 600px;
            z-index: 10;
        }
        .time-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            margin: 0.5rem 0;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
        }
        .ampm {
            font-size: 2rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 10px;
        }
        .location-tag {
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }
        .date-display {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 300;
            margin-bottom: 2rem;
        }
        .shift-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .shift-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            margin-bottom: 1rem;
            font-weight: 700;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .stat-box {
            text-align: left;
        }
        .stat-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .progress-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-top: 1rem;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 1s linear;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }
        .brand-footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .easybet-logo {
            color: var(--accent);
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        @media (max-width: 640px) {
            .time-display { font-size: 3.5rem; }
            .ampm { font-size: 1.5rem; }
            .glass-card { padding: 2rem 1.5rem; }
        }
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 204, 0, 0.03) 0%, rgba(10, 14, 20, 0) 70%);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="glass-card">
        <div class="location-tag">
            <span class="text-[10px] border border-slate-700 px-1.5 py-0.5 rounded text-slate-500">ZA</span>
            <span>South Africa Standard Time</span>
        </div>

        <div class="time-display" id="clock">
            <span id="hours-mins">00:00</span><span class="text-slate-600">:</span><span id="seconds" class="text-slate-400">00</span>
            <span class="ampm" id="ampm">AM</span>
        </div>

        <div class="date-display" id="date">
            Loading Date...
        </div>

        <!-- Shift Tracker -->
        <div class="shift-container" id="shift-tracker">
            <div class="shift-header" id="shift-header">PHT Shift Progress</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">Hours Worked</span>
                    <span class="stat-value" id="hours-worked">0h 00m</span>
                </div>
                <div class="stat-box text-right">
                    <span class="stat-label">Time Remaining</span>
                    <span class="stat-value" id="hours-remaining">0h 00m</span>
                </div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="brand-footer">
            <div class="easybet-logo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/>
                </svg>
                EASYBET
            </div>
            <div class="flex items-center gap-2">
                <span class="dot"></span>
                <span id="status-text">OFF SHIFT</span>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // 1. Update SAST Clock
            const timeOptions = { timeZone: 'Africa/Johannesburg', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const dateOptions = { timeZone: 'Africa/Johannesburg', month: 'short', day: '2-digit', year: 'numeric' };

            const saTimeStr = now.toLocaleTimeString('en-US', timeOptions);
            const saDateStr = now.toLocaleDateString('en-US', dateOptions);

            const parts = saTimeStr.split(' ');
            const timeParts = parts[0].split(':');
            const ampm = parts[1];

            document.getElementById('hours-mins').textContent = `${timeParts[0]}:${timeParts[1]}`;
            document.getElementById('seconds').textContent = timeParts[2];
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('date').textContent = saDateStr;

            // 2. Calculate PHT Shift (Philippine Standard Time)
            const phtNow = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
            const currentDay = phtNow.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
            const currentHour = phtNow.getHours();
            const currentMinute = phtNow.getMinutes();
            const totalMinutesToday = (currentHour * 60) + currentMinute;

            // Shift Configuration
            // Regular: 22:00 (10 PM) to 06:00 (6 AM) next day
            // Monday (Meeting): 21:30 (9:30 PM) to 06:00 (6 AM) next day
            
            let shiftStartHour = 22;
            let shiftStartMinute = 0;
            const shiftEndHour = 6;
            
            // If it's Monday, start at 9:30 PM (21:30)
            if (currentDay === 1) {
                shiftStartHour = 21;
                shiftStartMinute = 30;
            }

            const startTotalMinutes = (shiftStartHour * 60) + shiftStartMinute;
            const endTotalMinutes = (shiftEndHour * 60);
            
            // Total duration in minutes (handles crossing midnight)
            const totalDuration = (1440 - startTotalMinutes) + endTotalMinutes;

            let minutesWorked = 0;
            let onShift = false;

            // Logic to check if currently on shift (Shift crosses midnight)
            if (totalMinutesToday >= startTotalMinutes) {
                // Between start time and midnight
                onShift = true;
                minutesWorked = totalMinutesToday - startTotalMinutes;
            } else if (totalMinutesToday < endTotalMinutes) {
                // Between midnight and end time
                onShift = true;
                minutesWorked = (1440 - startTotalMinutes) + totalMinutesToday;
            }

            const headerEl = document.getElementById('shift-header');
            const statusText = document.getElementById('status-text');
            const workedEl = document.getElementById('hours-worked');
            const remainingEl = document.getElementById('hours-remaining');
            const progressFill = document.getElementById('progress-fill');

            // Format start time for header display (12hr format)
            const displayStartHour = shiftStartHour > 12 ? shiftStartHour - 12 : shiftStartHour;
            const displayStartMins = String(shiftStartMinute).padStart(2, '0');
            const displayAmpm = shiftStartHour >= 12 ? 'PM' : 'AM';
            headerEl.textContent = `PHT Shift Progress (${displayStartHour}:${displayStartMins}${displayAmpm} - 06:00AM)`;

            if (onShift) {
                statusText.textContent = "ON SHIFT";
                statusText.parentElement.querySelector('.dot').style.backgroundColor = "#22c55e";
                statusText.parentElement.querySelector('.dot').style.boxShadow = "0 0 10px #22c55e";
                
                const minutesRemaining = totalDuration - minutesWorked;
                
                workedEl.textContent = `${Math.floor(minutesWorked / 60)}h ${String(minutesWorked % 60).padStart(2, '0')}m`;
                remainingEl.textContent = `${Math.floor(minutesRemaining / 60)}h ${String(minutesRemaining % 60).padStart(2, '0')}m`;
                
                const progressPercent = (minutesWorked / totalDuration) * 100;
                progressFill.style.width = `${progressPercent}%`;
            } else {
                statusText.textContent = "OFF SHIFT";
                statusText.parentElement.querySelector('.dot').style.backgroundColor = "#ef4444";
                statusText.parentElement.querySelector('.dot').style.boxShadow = "0 0 10px #ef4444";
                
                workedEl.textContent = "0h 00m";
                remainingEl.textContent = `${Math.floor(totalDuration / 60)}h ${String(totalDuration % 60).padStart(2, '0')}m`;
                progressFill.style.width = `0%`;
            }
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-card');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            const card = document.querySelector('.glass-card');
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
