<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAST Live - Premium Gold Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --accent-gold: #D4AF37; /* Classic Premium Gold */
            --accent-gold-bright: #FFD700;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --success: #10b981;
            --danger: #ef4444;
            --glass-bg: rgba(18, 18, 18, 0.8);
            --glass-border: rgba(212, 175, 55, 0.25);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Deep Ambient Background */
        .ambient-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
        }

        /* Subtle Gold Shimmer */
        .gold-dust {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--accent-gold) 0.5px, transparent 0.5px);
            background-size: 40px 40px;
            opacity: 0.05;
            z-index: 1;
        }

        /* Floating Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 3.5rem;
            text-align: center;
            position: relative;
            width: 95%;
            max-width: 640px;
            z-index: 10;
            animation: card-float 8s infinite ease-in-out;
        }

        @keyframes card-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .clock-container {
            margin: 2rem 0;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .clock-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 1.5rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .clock-row:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: var(--accent-gold);
            transform: scale(1.01);
        }

        .clock-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            color: var(--accent-gold);
            margin-bottom: 0.75rem;
            font-weight: 800;
        }

        .time-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -4px;
            line-height: 1;
            transition: all 0.4s ease;
            color: #ffffff;
        }

        .clock-row:hover .time-val {
            color: var(--accent-gold-bright);
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }

        .ampm-tag {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 300;
            margin-left: 15px;
            opacity: 0.5;
            letter-spacing: 2px;
        }

        /* Shift Tracker */
        .shift-container {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar-bg {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 1.5rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold), #fff);
            width: 0%;
            transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 20px var(--accent-gold);
        }

        #copy-toast {
            position: fixed;
            top: 40px;
            background: var(--accent-gold);
            color: #000;
            padding: 14px 32px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.3);
            transform: translateY(-120px);
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 1000;
        }

        #copy-toast.show { transform: translateY(0); }

        .status-pill {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            height: 8px; width: 8px; border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        @media (max-width: 640px) {
            .time-val { font-size: 3rem; letter-spacing: -2px; }
            .glass-card { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="gold-dust"></div>

    <div id="copy-toast">Copied to clipboard!</div>

    <div class="glass-card">
        <!-- Header -->
        <div class="flex flex-col items-center gap-3 mb-8">
            <div class="flex items-center gap-3">
                <span class="text-[10px] bg-white text-black px-2 py-0.5 rounded font-black">ZA</span>
                <span class="uppercase tracking-[0.6em] text-[10px] font-black text-white">South Africa Standard Time</span>
            </div>
            <div class="text-white text-base font-light tracking-wide opacity-80" id="date">Loading Date...</div>
        </div>

        <!-- Clocks -->
        <div class="clock-container">
            <div class="clock-row" onclick="copyTime('12')">
                <span class="clock-label">Standard Time</span>
                <div class="flex items-baseline">
                    <span class="time-val" id="hms-12">00:00:00</span>
                    <span class="ampm-tag" id="ampm-12">AM</span>
                </div>
            </div>

            <div class="clock-row" onclick="copyTime('24')">
                <span class="clock-label">24-Hour Military</span>
                <div class="flex items-baseline">
                    <span class="time-val" id="hms-24">00:00:00</span>
                    <span class="ampm-tag" id="ampm-24">AM</span>
                </div>
            </div>
        </div>

        <!-- Shift Tracker -->
        <div class="shift-container">
            <div class="flex justify-between items-center mb-6">
                <div class="text-[11px] font-black uppercase tracking-[0.2em] text-[#D4AF37]" id="shift-header">PHT Shift Progress</div>
                <div class="status-pill">
                    <span class="dot" id="status-dot"></span>
                    <span class="text-[10px] font-bold text-white tracking-widest" id="status-text">OFF SHIFT</span>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="text-left">
                    <span class="block text-[9px] uppercase tracking-[0.3em] text-white/40 mb-2 font-bold">Time Elapsed</span>
                    <span class="font-['JetBrains_Mono'] text-2xl font-bold text-white" id="hours-worked">0h 00m</span>
                </div>
                <div class="text-right">
                    <span class="block text-[9px] uppercase tracking-[0.3em] text-white/40 mb-2 font-bold">Remaining</span>
                    <span class="font-['JetBrains_Mono'] text-2xl font-bold text-white" id="hours-remaining">0h 00m</span>
                </div>
            </div>
            
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Brand Footer -->
        <div class="mt-10 pt-8 border-t border-white/10 flex justify-between items-center">
            <div class="flex items-center gap-3 text-[#D4AF37] font-black tracking-tighter text-3xl">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/>
                </svg>
                EASYBET
            </div>
            <div class="text-right">
                <div class="text-white text-[10px] font-black uppercase tracking-[0.4em]">Operations Console</div>
                <div class="text-[9px] text-white/30 font-mono mt-1">v3.0.1-GOLD</div>
            </div>
        </div>
    </div>

    <script>
        function copyTime(format) {
            const hms12 = document.getElementById('hms-12').textContent;
            const ampm12 = document.getElementById('ampm-12').textContent;
            const hms24 = document.getElementById('hms-24').textContent;
            
            const text = format === '12' ? `${hms12} ${ampm12}` : hms24;
            
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const toast = document.getElementById('copy-toast');
            toast.textContent = `COPIED: ${text}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function updateClock() {
            const now = new Date();
            
            const sa12 = now.toLocaleTimeString('en-US', { timeZone: 'Africa/Johannesburg', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            const sa24 = now.toLocaleTimeString('en-GB', { timeZone: 'Africa/Johannesburg', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const saDate = now.toLocaleDateString('en-US', { timeZone: 'Africa/Johannesburg', weekday: 'long', month: 'long', day: '2-digit', year: 'numeric' });

            const parts12 = sa12.split(' ');
            document.getElementById('hms-12').textContent = parts12[0];
            document.getElementById('ampm-12').textContent = parts12[1];
            document.getElementById('hms-24').textContent = sa24;
            document.getElementById('ampm-24').textContent = parts12[1];
            document.getElementById('date').textContent = saDate;

            // Shift Calculation
            const phtNow = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
            const currentDay = phtNow.getDay(); 
            const totalMins = (phtNow.getHours() * 60) + phtNow.getMinutes();

            let startH = 22, startM = 0;
            if (currentDay === 1) { startH = 21; startM = 30; }

            const startTotal = (startH * 60) + startM;
            const endTotal = 360; 
            const duration = (1440 - startTotal) + endTotal;

            let worked = 0, onShift = false;
            if (totalMins >= startTotal) {
                onShift = true;
                worked = totalMins - startTotal;
            } else if (totalMins < endTotal) {
                onShift = true;
                worked = (1440 - startTotal) + totalMins;
            }

            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const workedEl = document.getElementById('hours-worked');
            const remainingEl = document.getElementById('hours-remaining');
            const progressFill = document.getElementById('progress-fill');

            if (onShift) {
                statusText.textContent = "ON SHIFT";
                statusDot.style.color = "#10b981";
                statusDot.style.backgroundColor = "#10b981";
                const remaining = duration - worked;
                workedEl.textContent = `${Math.floor(worked / 60)}h ${String(worked % 60).padStart(2, '0')}m`;
                remainingEl.textContent = `${Math.floor(remaining / 60)}h ${String(remaining % 60).padStart(2, '0')}m`;
                progressFill.style.width = `${(worked / duration) * 100}%`;
            } else {
                statusText.textContent = "OFF SHIFT";
                statusDot.style.color = "#ef4444";
                statusDot.style.backgroundColor = "#ef4444";
                workedEl.textContent = "0h 00m";
                remainingEl.textContent = "0h 00m";
                progressFill.style.width = "0%";
            }
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
