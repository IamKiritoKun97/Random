<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAST Live - Premium Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0e14;
            --card-bg: #111821;
            --accent: #ffcc00; /* Easybet Yellow */
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .glass-card {
            background: linear-gradient(145deg, #161e29, #0d131a);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 40px;
            padding: 3rem;
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
            width: 90%;
            max-width: 600px;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 204, 0, 0.2);
        }

        .time-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            margin: 1rem 0;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 10px;
        }

        .ampm {
            font-size: 2rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 10px;
        }

        .location-tag {
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0.5rem;
        }

        .flag-icon {
            width: 20px;
            height: 14px;
            background: linear-gradient(to bottom, #e03e2d 33%, #fff 33%, #fff 66%, #007a4d 66%);
            position: relative;
            border-radius: 2px;
        }

        .date-display {
            font-size: 1.5rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .brand-footer {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .easybet-logo {
            color: var(--accent);
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        @media (max-width: 640px) {
            .time-display { font-size: 3.5rem; }
            .ampm { font-size: 1.5rem; }
            .glass-card { padding: 2rem; }
        }

        /* Subtle Background glow */
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 204, 0, 0.05) 0%, rgba(10, 14, 20, 0) 70%);
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="glass-card">
        <div class="location-tag">
            <span class="text-xs border border-slate-700 px-1.5 py-0.5 rounded text-slate-500">ZA</span>
            <span>South Africa</span>
        </div>

        <div class="time-display" id="clock">
            <span id="hours-mins">00:00</span><span class="text-slate-600">:</span><span id="seconds" class="text-slate-400">00</span>
            <span class="ampm" id="ampm">AM</span>
        </div>

        <div class="date-display" id="date">
            Loading Date...
        </div>

        <div class="brand-footer">
            <div class="easybet-logo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/>
                </svg>
                EASYBET
            </div>
            <div class="flex items-center gap-2">
                <span class="dot"></span>
                <span>LIVE SAST</span>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            // Get current time in South Africa Standard Time (UTC+2)
            const now = new Date();
            
            // Formatters for SAST specifically
            const timeOptions = {
                timeZone: 'Africa/Johannesburg',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };

            const dateOptions = {
                timeZone: 'Africa/Johannesburg',
                month: 'short',
                day: '2-digit',
                year: 'numeric'
            };

            const saTimeStr = now.toLocaleTimeString('en-US', timeOptions);
            const saDateStr = now.toLocaleDateString('en-US', dateOptions);

            // Parsing the string for custom display parts
            // Expected format: "hh:mm:ss AM/PM"
            const parts = saTimeStr.split(' ');
            const timeParts = parts[0].split(':');
            const ampm = parts[1];

            document.getElementById('hours-mins').textContent = `${timeParts[0]}:${timeParts[1]}`;
            document.getElementById('seconds').textContent = timeParts[2];
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('date').textContent = saDateStr;
        }

        // Run immediately and then every second
        setInterval(updateClock, 1000);
        updateClock();

        // Add a slight parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-card');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            const card = document.querySelector('.glass-card');
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
