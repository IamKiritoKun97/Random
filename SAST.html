<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAST Live - Premium Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a;
            --accent: #ffcc00; /* Easybet Yellow */
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --glass-bg: rgba(17, 24, 33, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Animated Mesh Background */
        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.4;
        }

        .blob {
            position: absolute;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            background: var(--accent);
            animation: move 20s infinite alternate;
        }

        .blob-2 {
            background: #4f46e5;
            right: -10%;
            bottom: -10%;
            animation-duration: 25s;
        }

        @keyframes move {
            from { transform: translate(-20%, -20%) rotate(0deg); }
            to { transform: translate(20%, 20%) rotate(360deg); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 3rem;
            text-align: center;
            position: relative;
            transition: transform 0.1s ease-out;
            width: 95%;
            max-width: 680px;
            z-index: 10;
        }

        .clock-container {
            margin: 2rem 0;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .clock-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            padding: 1.5rem;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .clock-row:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 204, 0, 0.4);
            transform: scale(1.02);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.6);
        }

        .clock-row:active {
            transform: scale(0.98);
        }

        .clock-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .time-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .time-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4.2rem;
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
            background: linear-gradient(to bottom, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .clock-row:hover .time-val {
            background: linear-gradient(to bottom, var(--accent), #ffaa00);
            -webkit-background-clip: text;
        }

        .ampm-tag {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 1px;
        }

        /* Shift Tracker UI */
        .shift-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            padding: 1.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 1rem;
        }

        .progress-bar-bg {
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-top: 1.25rem;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff8800);
            width: 0%;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
            border-radius: 12px;
        }

        /* Toast UI */
        #copy-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #fff;
            color: #000;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #copy-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.1); opacity: 0.7; box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0px rgba(16, 185, 129, 0); }
        }

        @media (max-width: 640px) {
            .time-val { font-size: 3rem; letter-spacing: -1px; }
            .glass-card { padding: 2rem 1.25rem; }
            .ampm-tag { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="mesh-gradient">
        <div class="blob"></div>
        <div class="blob blob-2"></div>
    </div>

    <div id="copy-toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>Copied to clipboard!</span>
    </div>

    <div class="glass-card" id="main-card">
        <div class="flex justify-center items-center gap-3 mb-2">
            <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-1 rounded-md border border-slate-700 font-bold">ZA</span>
            <span class="uppercase tracking-[0.4em] text-[10px] font-black text-slate-400">South Africa Standard Time</span>
        </div>

        <div class="clock-container">
            <!-- 12-Hour Row -->
            <div class="clock-row" onclick="copyTime('12')">
                <span class="clock-label">Standard Format</span>
                <div class="time-wrapper">
                    <span class="time-val" id="hms-12">00:00:00</span>
                    <span class="ampm-tag" id="ampm-12">AM</span>
                </div>
            </div>

            <!-- 24-Hour Row -->
            <div class="clock-row" onclick="copyTime('24')">
                <span class="clock-label">Military / 24H Format</span>
                <div class="time-wrapper">
                    <span class="time-val" id="hms-24">00:00:00</span>
                    <span class="ampm-tag" id="ampm-24">AM</span>
                </div>
            </div>
        </div>

        <div class="text-slate-400 text-lg font-light mb-8 italic" id="date">
            Loading Date...
        </div>

        <!-- Shift Tracker -->
        <div class="shift-container">
            <div class="flex justify-between items-center mb-4">
                <div class="text-[10px] font-black uppercase tracking-[0.2em] text-[#ffcc00]" id="shift-header">PHT Shift Progress</div>
                <div class="status-pill">
                    <span class="dot" id="status-dot"></span>
                    <span id="status-text">OFF SHIFT</span>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="text-left">
                    <span class="block text-[9px] uppercase tracking-widest text-slate-500 mb-1 font-bold">Hours Worked</span>
                    <span class="font-['JetBrains_Mono'] text-xl font-bold text-white" id="hours-worked">0h 00m</span>
                </div>
                <div class="text-right">
                    <span class="block text-[9px] uppercase tracking-widest text-slate-500 mb-1 font-bold">Remaining</span>
                    <span class="font-['JetBrains_Mono'] text-xl font-bold text-white" id="hours-remaining">0h 00m</span>
                </div>
            </div>
            
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Branding -->
        <div class="mt-10 pt-6 border-t border-white/5 flex justify-between items-center">
            <div class="flex items-center gap-2 text-[#ffcc00] font-black tracking-tighter text-xl">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/>
                </svg>
                EASYBET
            </div>
            <div class="text-slate-500 text-[10px] font-bold uppercase tracking-widest opacity-60">
                Operations Live Dashboard
            </div>
        </div>
    </div>

    <script>
        function copyTime(format) {
            let textToCopy = "";
            const hms12 = document.getElementById('hms-12').textContent;
            const ampm12 = document.getElementById('ampm-12').textContent;
            const hms24 = document.getElementById('hms-24').textContent;
            const ampm24 = document.getElementById('ampm-24').textContent;

            if (format === '12') {
                textToCopy = `${hms12} ${ampm12}`;
            } else {
                textToCopy = `${hms24} ${ampm24}`;
            }

            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`Copied ${format}H Format: ${textToCopy}`);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showToast(message) {
            const toast = document.getElementById('copy-toast');
            toast.querySelector('span').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function updateClock() {
            const now = new Date();
            
            const options12 = { timeZone: 'Africa/Johannesburg', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const options24 = { timeZone: 'Africa/Johannesburg', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const dateOptions = { timeZone: 'Africa/Johannesburg', weekday: 'long', month: 'long', day: '2-digit', year: 'numeric' };

            const saTimeStr12 = now.toLocaleTimeString('en-US', options12);
            const saTimeStr24 = now.toLocaleTimeString('en-GB', options24);
            const saDateStr = now.toLocaleDateString('en-US', dateOptions);

            const parts12 = saTimeStr12.split(' ');
            document.getElementById('hms-12').textContent = parts12[0];
            document.getElementById('ampm-12').textContent = parts12[1];
            document.getElementById('hms-24').textContent = saTimeStr24;
            document.getElementById('ampm-24').textContent = parts12[1];
            document.getElementById('date').textContent = saDateStr;

            // Shift Logic
            const phtNow = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
            const currentDay = phtNow.getDay(); 
            const currentHour = phtNow.getHours();
            const currentMinute = phtNow.getMinutes();
            const totalMinutesToday = (currentHour * 60) + currentMinute;

            let shiftStartHour = 22;
            let shiftStartMinute = 0;
            const shiftEndHour = 6;

            if (currentDay === 1) { // Monday
                shiftStartHour = 21;
                shiftStartMinute = 30;
            }

            const startTotalMinutes = (shiftStartHour * 60) + shiftStartMinute;
            const endTotalMinutes = (shiftEndHour * 60);
            const totalDuration = (1440 - startTotalMinutes) + endTotalMinutes;

            let minutesWorked = 0;
            let onShift = false;

            if (totalMinutesToday >= startTotalMinutes) {
                onShift = true;
                minutesWorked = totalMinutesToday - startTotalMinutes;
            } else if (totalMinutesToday < endTotalMinutes) {
                onShift = true;
                minutesWorked = (1440 - startTotalMinutes) + totalMinutesToday;
            }

            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const workedEl = document.getElementById('hours-worked');
            const remainingEl = document.getElementById('hours-remaining');
            const progressFill = document.getElementById('progress-fill');

            if (onShift) {
                statusText.textContent = "ON SHIFT";
                statusDot.style.backgroundColor = "#10b981";
                statusDot.style.boxShadow = "0 0 15px #10b981";
                const minutesRemaining = totalDuration - minutesWorked;
                workedEl.textContent = `${Math.floor(minutesWorked / 60)}h ${String(minutesWorked % 60).padStart(2, '0')}m`;
                remainingEl.textContent = `${Math.floor(minutesRemaining / 60)}h ${String(minutesRemaining % 60).padStart(2, '0')}m`;
                progressFill.style.width = `${(minutesWorked / totalDuration) * 100}%`;
            } else {
                statusText.textContent = "OFF SHIFT";
                statusDot.style.backgroundColor = "#ef4444";
                statusDot.style.boxShadow = "0 0 15px #ef4444";
                workedEl.textContent = "0h 00m";
                remainingEl.textContent = `Shift Paused`;
                progressFill.style.width = `0%`;
            }
        }

        setInterval(updateClock, 1000);
        updateClock();

        // 3D Tilt Effect
        const card = document.getElementById('main-card');
        document.addEventListener('mousemove', (e) => {
            const rotateX = (window.innerHeight / 2 - e.clientY) / 40;
            const rotateY = (e.clientX - window.innerWidth / 2) / 40;
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
