<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAST Live - Premium Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0e14;
            --card-bg: #111821;
            --accent: #ffcc00; /* Easybet Yellow */
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --border-glow: rgba(255, 204, 0, 0.15);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .glass-card {
            background: linear-gradient(145deg, #161e29, #0d131a);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 40px;
            padding: 2.5rem 3rem;
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
            width: 90%;
            max-width: 650px;
            z-index: 10;
        }
        
        /* Premium Clock Section */
        .clock-container {
            margin: 1.5rem 0 2rem 0;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
        }

        .clock-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 1rem;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .clock-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-glow);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .clock-row:hover .time-val {
            color: var(--accent);
        }

        .clock-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .time-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
        }

        .time-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .ampm-tag {
            font-size: 1.4rem;
            color: var(--text-secondary);
            font-weight: 400;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
        }

        /* Toast notification */
        #copy-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent);
            color: #000;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(255, 204, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        #copy-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .location-tag {
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1rem;
        }
        .date-display {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }
        .shift-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .shift-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            margin-bottom: 1rem;
            font-weight: 700;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .stat-box {
            text-align: left;
        }
        .stat-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .progress-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-top: 1rem;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 1s linear;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }
        .brand-footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .easybet-logo {
            color: var(--accent);
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        @media (max-width: 640px) {
            .time-val { font-size: 2.8rem; }
            .ampm-tag { font-size: 1rem; }
            .glass-card { padding: 2rem 1.5rem; }
        }
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 204, 0, 0.04) 0%, rgba(10, 14, 20, 0) 70%);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    <div id="copy-toast">Copied to clipboard!</div>

    <div class="glass-card">
        <div class="location-tag">
            <span class="text-[10px] border border-slate-700 px-1.5 py-0.5 rounded text-slate-500">ZA</span>
            <span>South Africa Standard Time</span>
        </div>

        <div class="clock-container">
            <!-- 12-Hour Row -->
            <div class="clock-row" onclick="copyTime('12')">
                <span class="clock-label">12-Hour Format</span>
                <div class="time-wrapper">
                    <span class="time-val" id="hms-12">00:00:00</span>
                    <span class="ampm-tag" id="ampm-12">AM</span>
                </div>
            </div>

            <!-- 24-Hour Row -->
            <div class="clock-row" onclick="copyTime('24')">
                <span class="clock-label">24-Hour Format</span>
                <div class="time-wrapper">
                    <span class="time-val" id="hms-24">00:00:00</span>
                    <span class="ampm-tag" id="ampm-24">AM</span>
                </div>
            </div>
        </div>

        <div class="date-display" id="date">
            Loading Date...
        </div>

        <!-- Shift Tracker -->
        <div class="shift-container" id="shift-tracker">
            <div class="shift-header" id="shift-header">PHT Shift Progress</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">Hours Worked</span>
                    <span class="stat-value" id="hours-worked">0h 00m</span>
                </div>
                <div class="stat-box text-right">
                    <span class="stat-label">Time Remaining</span>
                    <span class="stat-value" id="hours-remaining">0h 00m</span>
                </div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="brand-footer">
            <div class="easybet-logo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/>
                </svg>
                EASYBET
            </div>
            <div class="flex items-center gap-2">
                <span class="dot"></span>
                <span id="status-text">OFF SHIFT</span>
            </div>
        </div>
    </div>

    <script>
        function copyTime(format) {
            let textToCopy = "";
            const hms12 = document.getElementById('hms-12').textContent;
            const ampm12 = document.getElementById('ampm-12').textContent;
            const hms24 = document.getElementById('hms-24').textContent;
            const ampm24 = document.getElementById('ampm-24').textContent;

            if (format === '12') {
                textToCopy = `${hms12} ${ampm12}`;
            } else {
                textToCopy = `${hms24} ${ampm24}`;
            }

            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`Copied ${format}h: ${textToCopy}`);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showToast(message) {
            const toast = document.getElementById('copy-toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function updateClock() {
            const now = new Date();
            
            // 1. Update SAST Clocks
            const options12 = { timeZone: 'Africa/Johannesburg', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const options24 = { timeZone: 'Africa/Johannesburg', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const dateOptions = { timeZone: 'Africa/Johannesburg', month: 'long', day: '2-digit', year: 'numeric' };

            const saTimeStr12 = now.toLocaleTimeString('en-US', options12);
            const saTimeStr24 = now.toLocaleTimeString('en-GB', options24);
            const saDateStr = now.toLocaleDateString('en-US', dateOptions);

            // Parsing 12h
            const parts12 = saTimeStr12.split(' ');
            document.getElementById('hms-12').textContent = parts12[0];
            document.getElementById('ampm-12').textContent = parts12[1];

            // Parsing 24h
            document.getElementById('hms-24').textContent = saTimeStr24;
            // For the 24h AM/PM as requested
            document.getElementById('ampm-24').textContent = parts12[1];

            document.getElementById('date').textContent = saDateStr;

            // 2. Calculate PHT Shift
            const phtNow = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
            const currentDay = phtNow.getDay(); 
            const currentHour = phtNow.getHours();
            const currentMinute = phtNow.getMinutes();
            const totalMinutesToday = (currentHour * 60) + currentMinute;

            let shiftStartHour = 22;
            let shiftStartMinute = 0;
            const shiftEndHour = 6;
            
            if (currentDay === 1) {
                shiftStartHour = 21;
                shiftStartMinute = 30;
            }

            const startTotalMinutes = (shiftStartHour * 60) + shiftStartMinute;
            const endTotalMinutes = (shiftEndHour * 60);
            const totalDuration = (1440 - startTotalMinutes) + endTotalMinutes;

            let minutesWorked = 0;
            let onShift = false;

            if (totalMinutesToday >= startTotalMinutes) {
                onShift = true;
                minutesWorked = totalMinutesToday - startTotalMinutes;
            } else if (totalMinutesToday < endTotalMinutes) {
                onShift = true;
                minutesWorked = (1440 - startTotalMinutes) + totalMinutesToday;
            }

            const headerEl = document.getElementById('shift-header');
            const statusText = document.getElementById('status-text');
            const workedEl = document.getElementById('hours-worked');
            const remainingEl = document.getElementById('hours-remaining');
            const progressFill = document.getElementById('progress-fill');

            const displayStartHour = shiftStartHour > 12 ? shiftStartHour - 12 : (shiftStartHour === 0 ? 12 : shiftStartHour);
            const displayStartMins = String(shiftStartMinute).padStart(2, '0');
            const displayAmpm = shiftStartHour >= 12 ? 'PM' : 'AM';
            headerEl.textContent = `PHT Shift Progress (${displayStartHour}:${displayStartMins}${displayAmpm} - 06:00AM)`;

            if (onShift) {
                statusText.textContent = "ON SHIFT";
                statusText.parentElement.querySelector('.dot').style.backgroundColor = "#22c55e";
                statusText.parentElement.querySelector('.dot').style.boxShadow = "0 0 10px #22c55e";
                const minutesRemaining = totalDuration - minutesWorked;
                workedEl.textContent = `${Math.floor(minutesWorked / 60)}h ${String(minutesWorked % 60).padStart(2, '0')}m`;
                remainingEl.textContent = `${Math.floor(minutesRemaining / 60)}h ${String(minutesRemaining % 60).padStart(2, '0')}m`;
                const progressPercent = (minutesWorked / totalDuration) * 100;
                progressFill.style.width = `${progressPercent}%`;
            } else {
                statusText.textContent = "OFF SHIFT";
                statusText.parentElement.querySelector('.dot').style.backgroundColor = "#ef4444";
                statusText.parentElement.querySelector('.dot').style.boxShadow = "0 0 10px #ef4444";
                workedEl.textContent = "0h 00m";
                remainingEl.textContent = `${Math.floor(totalDuration / 60)}h ${String(totalDuration % 60).padStart(2, '0')}m`;
                progressFill.style.width = `0%`;
            }
        }

        setInterval(updateClock, 1000);
        updateClock();

        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-card');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 60;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 60;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            const card = document.querySelector('.glass-card');
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
