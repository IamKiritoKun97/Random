<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAST Live - Premium Time Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030508;
            --accent: #ffcc00; /* Easybet Yellow */
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --glass-bg: rgba(13, 17, 23, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Mesh */
        .mesh-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            filter: blur(100px);
            opacity: 0.3;
        }

        .blob {
            position: absolute;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            animation: float-bg 20s infinite alternate ease-in-out;
        }

        .blob-2 {
            background: radial-gradient(circle, #4f46e5 0%, transparent 70%);
            right: -10%; bottom: -10%;
            animation-duration: 25s;
            animation-delay: -5s;
        }

        @keyframes float-bg {
            0% { transform: translate(-10%, -10%) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.1); }
        }

        /* Cursor Glow Follower */
        #cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 204, 0, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        /* Floating Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border-radius: 48px;
            padding: 3.5rem;
            text-align: center;
            position: relative;
            width: 95%;
            max-width: 640px;
            z-index: 10;
            animation: card-float 6s infinite ease-in-out;
        }

        @keyframes card-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .clock-container {
            margin: 2.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .clock-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 1.25rem;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
        }

        .clock-row::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.5s;
        }

        .clock-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 204, 0, 0.3);
        }

        .clock-row:hover::before {
            left: 100%;
        }

        .clock-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        .time-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
            transition: color 0.3s ease;
            color: #fff;
        }

        .clock-row:hover .time-val {
            color: var(--accent);
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
        }

        .ampm-tag {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-left: 12px;
            opacity: 0.7;
        }

        /* Progress UI Enhancements */
        .shift-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 28px;
            padding: 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .progress-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-top: 1.25rem;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 15px var(--accent);
        }

        #copy-toast {
            position: fixed;
            top: 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            color: #000;
            padding: 12px 24px;
            border-radius: 100px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(-100px);
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 1000;
        }

        #copy-toast.show { transform: translateY(0); }

        .status-dot {
            height: 10px; width: 10px; border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        @media (max-width: 640px) {
            .time-val { font-size: 2.8rem; letter-spacing: -1px; }
            .glass-card { padding: 2rem 1.5rem; border-radius: 32px; }
        }
    </style>
</head>
<body>

    <div class="mesh-gradient">
        <div class="blob"></div>
        <div class="blob blob-2"></div>
    </div>

    <div id="cursor-glow"></div>

    <div id="copy-toast">Copied to clipboard!</div>

    <div class="glass-card">
        <!-- Top Bar -->
        <div class="flex flex-col items-center gap-2 mb-6">
            <div class="flex items-center gap-2 opacity-60">
                <span class="text-[9px] bg-white/10 px-1.5 py-0.5 rounded font-bold border border-white/10">ZA</span>
                <span class="uppercase tracking-[0.5em] text-[10px] font-black">SA Standard Time</span>
            </div>
            <div class="text-slate-400 text-sm font-medium" id="date">Loading...</div>
        </div>

        <div class="clock-container">
            <div class="clock-row" onclick="copyTime('12')">
                <span class="clock-label">Standard</span>
                <div class="flex items-baseline">
                    <span class="time-val" id="hms-12">00:00:00</span>
                    <span class="ampm-tag" id="ampm-12">AM</span>
                </div>
            </div>

            <div class="clock-row" onclick="copyTime('24')">
                <span class="clock-label">24-Hour</span>
                <div class="flex items-baseline">
                    <span class="time-val" id="hms-24">00:00:00</span>
                    <span class="ampm-tag" id="ampm-24">AM</span>
                </div>
            </div>
        </div>

        <!-- Shift Tracker -->
        <div class="shift-container">
            <div class="flex justify-between items-center mb-6">
                <div class="text-[10px] font-black uppercase tracking-widest text-[#ffcc00]" id="shift-header">PHT Shift Progress</div>
                <div class="bg-white/5 px-3 py-1 rounded-full border border-white/5 flex items-center">
                    <span class="status-dot" id="status-dot"></span>
                    <span class="text-[10px] font-bold tracking-tighter" id="status-text">OFF SHIFT</span>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-8">
                <div class="text-left">
                    <span class="block text-[9px] uppercase tracking-widest text-slate-500 mb-1 font-bold">Elapsed</span>
                    <span class="font-['JetBrains_Mono'] text-xl font-bold text-white" id="hours-worked">0h 00m</span>
                </div>
                <div class="text-right">
                    <span class="block text-[9px] uppercase tracking-widest text-slate-500 mb-1 font-bold">Remaining</span>
                    <span class="font-['JetBrains_Mono'] text-xl font-bold text-white" id="hours-remaining">0h 00m</span>
                </div>
            </div>
            
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Brand Footer -->
        <div class="mt-8 pt-6 border-t border-white/5 flex justify-between items-center">
            <div class="flex items-center gap-2 text-[#ffcc00] font-black tracking-tighter text-2xl group cursor-default">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/>
                </svg>
                EASYBET
            </div>
            <div class="text-right">
                <div class="text-slate-500 text-[9px] font-black uppercase tracking-[0.2em]">Ops Console</div>
                <div class="text-[8px] text-slate-600 font-mono">v2.0.4-Luxe</div>
            </div>
        </div>
    </div>

    <script>
        // Cursor Follow Logic
        const glow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.opacity = '1';
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        function copyTime(format) {
            const text = format === '12' 
                ? `${document.getElementById('hms-12').textContent} ${document.getElementById('ampm-12').textContent}`
                : `${document.getElementById('hms-24').textContent}`;
            
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const toast = document.getElementById('copy-toast');
            toast.textContent = `Copied ${format}H: ${text}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function updateClock() {
            const now = new Date();
            
            const sa12 = now.toLocaleTimeString('en-US', { timeZone: 'Africa/Johannesburg', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            const sa24 = now.toLocaleTimeString('en-GB', { timeZone: 'Africa/Johannesburg', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const saDate = now.toLocaleDateString('en-US', { timeZone: 'Africa/Johannesburg', weekday: 'long', month: 'short', day: '2-digit', year: 'numeric' });

            const parts12 = sa12.split(' ');
            document.getElementById('hms-12').textContent = parts12[0];
            document.getElementById('ampm-12').textContent = parts12[1];
            document.getElementById('hms-24').textContent = sa24;
            document.getElementById('ampm-24').textContent = parts12[1];
            document.getElementById('date').textContent = saDate;

            // Shift Calculation
            const phtNow = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
            const currentDay = phtNow.getDay(); 
            const totalMins = (phtNow.getHours() * 60) + phtNow.getMinutes();

            let startH = 22, startM = 0;
            if (currentDay === 1) { startH = 21; startM = 30; }

            const startTotal = (startH * 60) + startM;
            const endTotal = 360; // 06:00 AM
            const duration = (1440 - startTotal) + endTotal;

            let worked = 0, onShift = false;
            if (totalMins >= startTotal) {
                onShift = true;
                worked = totalMins - startTotal;
            } else if (totalMins < endTotal) {
                onShift = true;
                worked = (1440 - startTotal) + totalMins;
            }

            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');
            const workedEl = document.getElementById('hours-worked');
            const remainingEl = document.getElementById('hours-remaining');
            const progressFill = document.getElementById('progress-fill');

            if (onShift) {
                statusText.textContent = "ON SHIFT";
                statusDot.style.backgroundColor = "#10b981";
                statusDot.style.boxShadow = "0 0 10px #10b981";
                const remaining = duration - worked;
                workedEl.textContent = `${Math.floor(worked / 60)}h ${String(worked % 60).padStart(2, '0')}m`;
                remainingEl.textContent = `${Math.floor(remaining / 60)}h ${String(remaining % 60).padStart(2, '0')}m`;
                progressFill.style.width = `${(worked / duration) * 100}%`;
            } else {
                statusText.textContent = "OFF SHIFT";
                statusDot.style.backgroundColor = "#ef4444";
                statusDot.style.boxShadow = "0 0 10px #ef4444";
                workedEl.textContent = "0h 00m";
                remainingEl.textContent = "---";
                progressFill.style.width = "0%";
            }
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
