<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUNBOX DJ – Your Personal Sound Effects Studio</title>
<style>
:root{--bg:#060714;--bg2:#0d1030;--p:rgba(255,255,255,.055);--b:rgba(255,255,255,.1);--t:#eef0ff;--m:#a3a8d1;--pu:#a855f7;--cy:#22d3ee;--mg:#ec4899;--bl:#3b82f6;--r:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a1262 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#0a2a5e 0,transparent 55%),var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:12px 20px;background:rgba(6,7,20,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--b)}
.brand{display:flex;gap:12px;align-items:center;margin-right:auto}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 0 10px var(--pu))}
.brand h1{margin:0;font-size:1.25rem;letter-spacing:.08em;font-weight:800;background:linear-gradient(90deg,var(--cy),var(--pu),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:0;font-size:.75rem;color:var(--m)}
.pill{display:flex;align-items:center;gap:8px;background:var(--p);border:1px solid var(--b);border-radius:99px;padding:6px 12px;font-size:.85rem}
.master input{width:110px}
.ic{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--b);background:var(--p);transition:.15s}
.ic:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.ic[aria-pressed=true]{background:linear-gradient(135deg,var(--pu),var(--mg));border-color:transparent}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{border:1px solid var(--b);background:var(--p);border-radius:10px;padding:8px 14px;font-weight:600;transition:.15s}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.go{background:linear-gradient(135deg,var(--pu),var(--bl));border-color:transparent;box-shadow:0 4px 20px rgba(168,85,247,.4)}
.btn.stop,.btn.danger{background:linear-gradient(135deg,#e11d48,var(--mg));border-color:transparent;box-shadow:0 4px 18px rgba(236,72,153,.4)}
.btn.stop{font-weight:800;letter-spacing:.04em}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px 0}
.tools input[type=search],.tools select,.modal-in{background:rgba(255,255,255,.07);border:1px solid var(--b);border-radius:10px;padding:8px 12px}
.tools input[type=search]{flex:1 1 220px;min-width:0}
select option{background:#14183a}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--b);background:var(--p);border-radius:99px;padding:5px 14px;font-size:.85rem;color:var(--m)}
.chip[aria-pressed=true]{color:#fff;background:linear-gradient(135deg,var(--pu),var(--mg));border-color:transparent}
.wrap{display:grid;grid-template-columns:1fr 290px;gap:18px;padding:0 20px 40px;align-items:start}
.drop{display:flex;align-items:center;gap:14px;border:2px dashed rgba(168,85,247,.5);border-radius:var(--r);padding:12px 16px;background:rgba(168,85,247,.07);margin-bottom:14px;transition:.15s}
.drop.over{border-color:var(--cy);background:rgba(34,211,238,.14);transform:scale(1.01)}
.drop svg{width:34px;height:34px;flex:none;fill:none;stroke:var(--cy);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.drop b{display:block;letter-spacing:.06em}
.drop span{color:var(--m);font-size:.85rem}
.drop .btn{margin-left:auto;flex:none}
#status{font-size:.85rem;color:var(--cy);min-height:1.2em;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.compact .grid,.grid.compact{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.pad{--c:#a855f7;position:relative;border-radius:var(--r);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#10132e),#0b0d24 75%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden;transition:transform .15s,box-shadow .2s}
.pad:hover{transform:translateY(-2px)}
.pad.playing{box-shadow:0 0 0 1px var(--c),0 0 26px color-mix(in srgb,var(--c) 70%,transparent)}
.pad.hit{animation:hit .3s}
@keyframes hit{50%{transform:scale(.96);filter:brightness(1.5)}}
.main{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 14px 10px;min-height:84px}
.emoji{grid-row:span 2;font-size:2rem;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--c) 30%,transparent)}
.compact .emoji{width:40px;height:40px;font-size:1.5rem}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:end}
.meta{font-size:.76rem;color:var(--m);align-self:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key{position:absolute;top:8px;right:10px;font-size:.7rem;font-weight:700;border:1px solid var(--b);border-radius:6px;padding:0 6px;background:rgba(0,0,0,.4);color:var(--m)}
.eq{position:absolute;bottom:44px;right:12px;display:none;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;background:var(--c);border-radius:2px;animation:eq .8s ease-in-out infinite;height:100%;transform-origin:bottom}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
.playing .eq{display:flex}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.bar{height:4px;margin:0 14px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 8px var(--c)}
.ctrl{display:flex;align-items:center;gap:6px;padding:8px 10px 10px}
.ctrl .ic{width:30px;height:30px;border-radius:8px;flex:none}
.ctrl input{flex:1;min-width:30px}
input[type=range]{accent-color:var(--pu);height:18px}
.np{background:var(--p);border:1px solid var(--b);border-radius:var(--r);padding:12px 14px;position:sticky;top:84px}
.np summary{font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;margin-top:10px;font-size:.85rem}
.nrow .bar{grid-column:2/4;margin:0}
.nrow .ic{width:28px;height:28px}
.hint{font-size:.78rem;color:var(--m)}
.empty{text-align:center;padding:50px 20px;border:1px solid var(--b);border-radius:var(--r);background:var(--p)}
.empty .big{font-size:3.5rem}
.empty h2{margin:.3em 0;letter-spacing:.05em}
.empty p{color:var(--m);max-width:44ch;margin:.5em auto 1.2em}
.spin{width:34px;height:34px;border:3px solid var(--b);border-top-color:var(--cy);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.act{display:flex;gap:2px;align-items:flex-end;height:16px}
.act i{width:3px;height:100%;background:var(--m);border-radius:2px;transform:scaleY(.2);transform-origin:bottom}
.act.on i{background:var(--cy);animation:eq .7s ease-in-out infinite}
.act.on i:nth-child(2){animation-delay:.15s}.act.on i:nth-child(3){animation-delay:.3s}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(92vw,380px)}
.toast{background:#171a3c;border:1px solid var(--b);border-left:4px solid var(--cy);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:in .25s}
.toast.err{border-left-color:var(--mg)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
dialog{background:#10132e;color:var(--t);border:1px solid var(--b);border-radius:var(--r);padding:18px 20px;width:min(94vw,480px);max-height:88vh;box-shadow:0 20px 60px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(3,4,12,.75);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 12px;font-size:1.1rem}
dialog .x{position:absolute;top:12px;right:12px}
dialog label{display:block;font-size:.8rem;color:var(--m);margin:12px 0 4px}
.modal-in{width:100%}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.sw button[aria-pressed=true]{border-color:#fff}
.sw .emo{background:var(--p);border-radius:8px;font-size:1.1rem;border-color:var(--b)}
.kb{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem}
kbd{border:1px solid var(--b);border-radius:5px;padding:0 6px;background:rgba(255,255,255,.08)}
.crow{display:flex;gap:6px;margin-top:6px}
main{min-width:0}
.list{display:grid;gap:8px}
.trk{--c:#a855f7;position:relative;display:grid;grid-template-columns:auto auto minmax(110px,1.1fr) minmax(190px,2.2fr) auto auto;grid-template-areas:"h p i s k a";align-items:center;gap:6px 10px;padding:9px 12px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,#10132e),#0b0d24 70%);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);transition:box-shadow .2s}
.trk>*{min-width:0}
.trk.playing{box-shadow:0 0 0 1px var(--c),0 0 22px color-mix(in srgb,var(--c) 60%,transparent)}
.trk.hit{animation:hit .3s}
.trk.drag{z-index:5;opacity:.9;box-shadow:0 12px 30px rgba(0,0,0,.6);pointer-events:none}
.trk.ins-b{box-shadow:0 -4px 0 0 var(--cy)}.trk.ins-a{box-shadow:0 4px 0 0 var(--cy)}
.hd{grid-area:h;cursor:grab;touch-action:none;width:28px;letter-spacing:-2px}
.pb{grid-area:p;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--c) 45%,transparent);font-size:.95rem}
.info{grid-area:i}.sk{grid-area:s}.skips{grid-area:k;display:flex;gap:4px}.acts{grid-area:a;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.nl{display:flex;gap:6px;align-items:center;font-weight:700}
.nl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmi{padding:4px 8px;min-width:0}
.seek{width:100%;display:block;margin:0}
.tm{display:flex;justify-content:space-between;font-size:.72rem;color:var(--m);font-variant-numeric:tabular-nums}
.skips .ic{width:36px;font-size:.78rem;font-weight:700}
.acts .ic{width:32px;height:32px}
.rm{border-color:rgba(236,72,153,.6);color:#ff9cc7;padding:6px 10px;white-space:nowrap}
.list.compact .trk{padding:5px 10px}.list.compact .tm{display:none}
@media(max-width:1100px){.trk{grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"h p i a" "s s s s" "k k k k"}.skips{justify-content:space-between}.skips .ic{flex:1}}
@media(max-width:520px){.lbl{display:none}.acts .ic{width:30px}}
.calm *,.calm *::before{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.np{position:static;order:-1}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.top{padding:10px 12px}.tools,.chips{padding-left:12px;padding-right:12px}.wrap{padding:0 12px 40px}.master input{width:80px}.brand p{display:none}}
@media(max-width:480px){.drop{flex-wrap:wrap}.drop .btn{width:100%}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.emoji{width:40px;height:40px;font-size:1.5rem}.main{padding:12px 10px 8px}.pill.cnt{display:none}}
</style>
</head>
<body>
<header class="top">
 <div class="brand">
  <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><circle cx="24" cy="24" r="21" fill="#0d1030" stroke="url(#g)" stroke-width="3"/><circle cx="24" cy="24" r="12" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="3 3"/><circle cx="24" cy="24" r="4" fill="url(#g)"/></svg>
  <div><h1>FUNBOX DJ</h1><p>Your Personal Sound Effects Studio</p></div>
 </div>
 <div class="pill cnt" title="Imported sounds"><b id="cnt">0</b> sounds</div>
 <div class="pill master" title="Master volume">
  <div class="act" id="act" aria-hidden="true"><i></i><i></i><i></i></div>
  <button class="ic" id="mute" aria-pressed="false" aria-label="Mute all output" title="Master mute"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="mw" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <input type="range" id="mv" min="0" max="1" step="0.01" aria-label="Master volume"><span id="mvl">100%</span>
 </div>
 <button class="btn stop" id="stopAll" title="Stop all sounds (Esc)">■ STOP ALL</button>
 <button class="ic" id="setBtn" aria-label="Settings" title="Settings and shortcuts"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg></button>
</header>
<div class="tools">
 <input type="search" id="q" placeholder="Search sounds…" aria-label="Search sounds by name">
 <select id="sort" aria-label="Sort sounds"><option value="custom">Custom Order</option><option value="recent">Recently Added</option><option value="name">Name A–Z</option><option value="dur">Duration</option></select>
 <button class="ic" id="view" aria-pressed="false" aria-label="Compact grid" title="Toggle compact grid"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
 <button class="btn go" id="imp">＋ Import Sounds</button><button class="btn danger" id="clr" title="Delete every imported sound">Clear all sounds</button>
</div>
<nav class="chips" id="chips" aria-label="Filter by category"></nav>
<div class="wrap">
 <main>
  <div class="drop" id="drop">
   <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
   <div><b>DROP YOUR SOUNDS HERE</b><span>Import MP3s, funny effects, memes, and short music clips.</span></div>
   <button class="btn" id="imp2">Choose files</button>
  </div>
  <p id="status" role="status"></p>
  <div class="list" id="list" aria-label="Sound tracks"></div>
 </main>
 <details class="np" id="np" open><summary>Now Playing <span id="npc"></span></summary><div id="nplist"></div>
  <div class="row"><button class="btn" id="kbBtn">Shortcuts</button></div>
  <p class="hint" id="lib"></p></details>
</div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="file" multiple accept="audio/*,.mp3,.wav,.ogg,.aac,.m4a" hidden>
<script>
"use strict";
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
// Safe DOM builder: text is always set via textContent, never innerHTML.
const h=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='class')e.className=v;else if(a==='text')e.textContent=v;else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(a,v===true?'':v)}for(const c of k.flat())if(c!=null)e.append(c);return e};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=s=>{s=Math.round(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const mb=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const tick=()=>new Promise(r=>setTimeout(r,0));
const PAL=['#a855f7','#22d3ee','#ec4899','#3b82f6','#f59e0b','#10b981','#f43f5e','#8b5cf6','#06b6d4','#d946ef'];
const EMO=['😂','🤣','💀','🔥','👏','🎺','🥁','🎸','🎹','🎤','🐔','🐶','🦆','💩','😱','🙈','🚨','📢','🎉','🤡','👻','🛸','💥','🔔'];
const BUILT=['Funny','Memes','Reactions','DJ Drops','Music','Fails','Applause','Custom'];
const UNC='Uncategorized';
const META=['id','name','orig','dur','cat','fav','color','emoji','loop','vol','key','added','size','type','order','start','end'];

/* ============ state ============ */
let S=[];                       // sounds (metadata + blob + lazy audio)
let cfg={sort:'custom',compact:false,master:1,mute:false,calm:false,cats:[]};
let flt={q:'',cat:'all'};       // cat: 'all' | 'fav' | category name
let vis=[],keyMap=new Map(),refs=new Map(),playing=new Set(),npRefs=new Map();
let db=null,chain=Promise.resolve(),raf=0;
const nextOrder=()=>S.reduce((m,s)=>Math.max(m,s.order),-1)+1;
const allCats=()=>BUILT.concat(cfg.cats);

/* ============ IndexedDB ============ */
// Stores: sounds (metadata), blobs (raw audio keyed by id), meta (settings).
function openDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('IndexedDB is not available in this browser.'));const r=indexedDB.open('funbox-dj',1);
 r.onupgradeneeded=()=>{const d=r.result;['sounds','blobs','meta'].forEach(n=>d.createObjectStore(n))};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('Could not open storage.'));r.onblocked=()=>rej(new Error('Storage is blocked by another tab.'))})}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const txDone=t=>new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Storage write aborted'))});
const pickMeta=s=>Object.fromEntries(META.map(k=>[k,s[k]]));
async function dbAddSound(s){const t=db.transaction(['sounds','blobs'],'readwrite');t.objectStore('sounds').put(pickMeta(s),s.id);t.objectStore('blobs').put(s.blob,s.id);return txDone(t)}
async function dbDelSound(id){const t=db.transaction(['sounds','blobs'],'readwrite');t.objectStore('sounds').delete(id);t.objectStore('blobs').delete(id);return txDone(t)}
const timers=new Map();
// Debounced metadata save so sliders don't hammer IndexedDB.
function save(s){if(!db)return;clearTimeout(timers.get(s.id));timers.set(s.id,setTimeout(async()=>{try{const t=db.transaction('sounds','readwrite');t.objectStore('sounds').put(pickMeta(s),s.id);await txDone(t)}catch(e){toast(storeMsg(e),1)}},250))}
async function saveCfg(){if(!db)return;try{const t=db.transaction('meta','readwrite');t.objectStore('meta').put(cfg,'cfg');await txDone(t)}catch(e){toast(storeMsg(e),1)}}
const storeMsg=e=>e&&e.name==='QuotaExceededError'?'Browser storage is full. Delete some sounds or free disk space, then try again.':'Could not save to browser storage: '+(e&&e.message||'unknown error');

/* ============ toasts ============ */
function toast(m,err){const t=h('div',{class:'toast'+(err?' err':''),text:m});$('#toasts').append(t);setTimeout(()=>t.remove(),err?5500:2600)}

/* ============ audio engine (ONE track at a time) ============ */
const eff=s=>cfg.mute?0:Math.min(1,s.vol*cfg.master);
const fmtT=t=>{const q=Math.round(Math.max(0,t||0)*10),m=Math.floor(q/600),x=(q%600)/10;return m+':'+(x<10?'0':'')+x.toFixed(1)};
const dur=s=>{const a=s.audio;return a&&isFinite(a.duration)&&a.duration>0?a.duration:s.dur};
const segStart=s=>Math.min(s.start||0,Math.max(0,s.dur-.05));
const segEnd=s=>(s.end>0&&s.end<s.dur)?s.end:0;
// Each track has one lazily created HTMLAudioElement; toggle() pauses all others first.
function ensureAudio(s){if(s.audio)return s.audio;s.url=URL.createObjectURL(s.blob);const a=new Audio(s.url);a.preload='auto';a.volume=eff(s);try{a.currentTime=segStart(s)}catch(e){}
 a.addEventListener('play',()=>setPlaying(s.id,true));
 a.addEventListener('pause',()=>setPlaying(s.id,false));
 a.addEventListener('ended',()=>{setPlaying(s.id,false);a.currentTime=segStart(s);if(s.loop)a.play().catch(()=>{});paint(s)});
 ['timeupdate','seeked','loadedmetadata'].forEach(n=>a.addEventListener(n,()=>{enforce(s);paint(s)}));

 const addC=()=>{const v=nc.value.trim();if(!v||allCats().includes(v)||v===UNC)return toast('Pick a unique, non-empty name.',1);cfg.cats.push(v);nc.value='';saveCfg();render();paint();toast('Category "'+v+'" created')};
 paint();
 const body=h('div',{},h('label',{},calm,' Disable decorative animations'),h('label',{text:'Custom categories'}),cl,h('div',{class:'crow'},nc,h('button',{class:'btn go',text:'Add',onclick:addC})),h('label',{text:'Library'}),stat);
 if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{stat.textContent=S.length+' sounds · audio '+mb(S.reduce((a,s)=>a+(s.size||0),0))+' · browser is using '+mb(e.usage||0)+' of roughly '+mb(e.quota||0)+' available (limits vary by browser and device).'}).catch(()=>{});
 else stat.textContent=S.length+' sounds · audio '+mb(S.reduce((a,s)=>a+(s.size||0),0))+'.';
 modal('Settings',body)}
function kbDlg(){modal('Keyboard shortcuts',h('div',{class:'kb'},h('kbd',{text:'1–9'}),h('span',{text:'Play or pause the first nine visible tracks'}),h('kbd',{text:'Esc'}),h('span',{text:'Stop all sounds'}),h('kbd',{text:'Your key'}),h('span',{text:'Assign one per sound in a pad\'s ⋯ options'}),h('kbd',{text:'Tab / Enter'}),h('span',{text:'Navigate controls and press them'}),h('kbd',{text:'Double-click'}),h('span',{text:'Renames a track'}),h('span',{}),h('span',{class:'hint',text:'Shortcuts are paused while you type in a field or a dialog is open.'})))}

/* ============ wiring (all listeners attached exactly once) ============ */
function syncMaster(){$('#mv').value=cfg.master;$('#mvl').textContent=cfg.mute?'Muted':Math.round(cfg.master*100)+'%';const m=$('#mute');m.setAttribute('aria-pressed',cfg.mute);$('#mw').style.display=cfg.mute?'none':''}
function wire(){
 $('#imp').onclick=$('#imp2').onclick=()=>$('#file').click();
 $('#file').onchange=e=>{importFiles(e.target.files);e.target.value=''};
 $('#stopAll').onclick=stopAll;$('#clr').onclick=clearAll;$('#setBtn').onclick=settingsDlg;$('#kbBtn').onclick=kbDlg;
 $('#mv').oninput=e=>{cfg.master=+e.target.value;applyVol();syncMaster();saveCfg()};
 $('#mute').onclick=()=>{cfg.mute=!cfg.mute;applyVol();syncMaster();saveCfg();toast(cfg.mute?'Output muted':'Output unmuted')};
 $('#q').oninput=e=>{flt.q=e.target.value;render()};
 $('#sort').onchange=e=>{cfg.sort=e.target.value;saveCfg();render()};
 $('#view').onclick=()=>{cfg.compact=!cfg.compact;saveCfg();render()};
 let dc=0;const drop=$('#drop');
 addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dc++;drop.classList.add('over')}});
 addEventListener('dragleave',()=>{dc=Math.max(0,dc-1);if(!dc)drop.classList.remove('over')});
 addEventListener('dragover',e=>e.preventDefault());
 addEventListener('drop',e=>{e.preventDefault();dc=0;drop.classList.remove('over');if(e.dataTransfer&&e.dataTransfer.files.length)importFiles(e.dataTransfer.files)});
 addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||document.querySelector('dialog[open]'))return;
  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(e.key==='Escape'){stopAll();return}
  if(e.repeat)return;const id=keyMap.get(e.key.toLowerCase());if(id){e.preventDefault();trigger(id)}});
 if(innerWidth<=860)$('#np').open=false;
}

/* ============ boot ============ */
(async function init(){
 wire();$('#list').append(h('div',{class:'spin',role:'status','aria-label':'Loading your library'}));renderNP();
 try{db=await openDB();
  const t=db.transaction(['sounds','blobs','meta'],'readonly');
  const [metas,ids,blobs,c]=await Promise.all([rq(t.objectStore('sounds').getAll()),rq(t.objectStore('blobs').getAllKeys()),rq(t.objectStore('blobs').getAll()),rq(t.objectStore('meta').get('cfg'))]);
  if(c)cfg=Object.assign(cfg,c);
  const bm=new Map(ids.map((k,i)=>[k,blobs[i]]));
  S=metas.filter(m=>bm.has(m.id)).map(m=>Object.assign(m,{blob:bm.get(m.id)}));
  // Migrate older libraries: give every track an order and segment fields (nothing else is touched).
  let mx=Math.max(-1,...S.filter(s=>typeof s.order==='number').map(s=>s.order));
  S.filter(s=>typeof s.order!=='number').sort((a,b)=>a.added-b.added).forEach(s=>{s.order=++mx;save(s)});
  S.forEach(s=>{s.start=s.start||0;s.end=s.end||0});
  if(!cfg.v2){cfg.v2=1;cfg.sort='custom';saveCfg()}
 }catch(e){db=null;toast('Saving is unavailable: '+e.message+' Sounds will only last until you close this page.',1)}
 document.body.classList.toggle('calm',cfg.calm);$('#sort').value=cfg.sort;syncMaster();render();
})();
</script>
