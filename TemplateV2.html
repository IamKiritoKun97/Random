<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- PREMIUM DESIGN TOKENS --- */
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: rgba(25, 25, 30, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --accent-dim: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --glass-blur: 24px;
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- WALLPAPER PIPELINE STYLES --- */
        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #111111 0%, #000000 100%);
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #bg-layer.is-loaded {
            opacity: 1;
        }

        #bg-layer.is-fallback {
            opacity: 1;
            background: radial-gradient(circle at top right, #1a1a1a, #000);
        }

        /* --- LAYOUT --- */
        .app-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .main-header {
            text-align: center;
            animation: fadeInDown 0.6s ease-out;
        }

        .main-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            /* FIX: Allow dropdown to overflow */
            overflow: visible;
        }

        /* --- COMPONENTS --- */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            /* FIX: Allow dropdown to overflow */
            overflow: visible;
        }

        .selection-area {
            animation: fadeInUp 0.5s ease-out;
            /* FIX: Higher stacking context for selection area */
            position: relative;
            z-index: 5000;
            overflow: visible;
        }

        .dropdown-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        /* --- CUSTOM DARK SEARCHABLE DROPDOWN STYLES --- */
        .custom-select {
            position: relative;
            width: 100%;
            /* FIX: Elevated z-index */
            z-index: 6000;
        }

        .custom-select-trigger {
            width: 100%;
            min-height: 56px;
            padding: 14px 48px 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            backdrop-filter: blur(18px);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .custom-select-trigger:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .custom-select-trigger::after {
            content: '';
            width: 10px;
            height: 10px;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(45deg);
            margin-top: -4px;
            transition: var(--transition);
        }

        .custom-select.is-open .custom-select-trigger::after {
            transform: rotate(-135deg);
            margin-top: 4px;
        }

        .custom-select-menu {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 10px);
            /* FIX: Highest z-index for dropdown visibility */
            z-index: 99999;
            max-height: 320px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(12, 14, 18, 0.98);
            backdrop-filter: blur(24px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: var(--transition);
            overflow: visible;
        }

        .custom-select.is-open .custom-select-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .custom-select-search {
            width: 100%;
            margin-bottom: 10px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .custom-select-search:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .custom-select-options {
            overflow-y: auto;
            flex-grow: 1;
        }

        .custom-select-option {
            width: 100%;
            display: block;
            padding: 12px 14px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: rgba(255, 255, 255, 0.8);
            text-align: left;
            cursor: pointer;
            font-size: 15px;
            transition: var(--transition);
            margin-bottom: 2px;
        }

        .custom-select-option:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .custom-select-option.is-selected {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-weight: 600;
        }

        /* --- EMPTY STATE --- */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            border: 2px dashed rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
        }

        .empty-icon {
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            margin: 0 0 10px 0;
            color: white;
        }

        /* --- CONTENT GRID --- */
        .content-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.4s ease-out;
            /* FIX: Keep content grid low in z-index */
            position: relative;
            z-index: 1;
        }

        .card-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            position: relative;
            z-index: 1;
        }

        #textAreas {
            position: relative;
            z-index: 1;
        }

        .editor-card {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 0;
            overflow: hidden; /* Kept hidden for card design per instruction */
            position: relative;
            z-index: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 0;
        }

        .textarea-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .styled-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 20px;
            font-size: 1.05rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 200px;
        }

        /* --- BUTTONS --- */
        .copy-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .copy-icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* --- TOAST --- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: white;
            color: black;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 100000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .card-pair {
                grid-template-columns: 1fr;
            }
            .main-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <script>
        const REMOTE_WALLPAPER_URL = "https://images.unsplash.com/photo-1775334006478-865fa1b777de?q=80&w=1920&auto=format&fit=crop";
        const LOCAL_WALLPAPER_URL = "wallpaper.jpg";

        function setWallpaperSource(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = async () => {
                    try { if (img.decode) await img.decode(); resolve(url); } catch (e) { resolve(url); }
                };
                img.onerror = reject;
                img.src = url;
            });
        }

        async function initWallpaper() {
            const bgLayer = document.getElementById("bg-layer");
            if (!bgLayer) return;
            const sources = [REMOTE_WALLPAPER_URL, LOCAL_WALLPAPER_URL];
            for (const source of sources) {
                try {
                    const loadedSource = await setWallpaperSource(source);
                    bgLayer.style.backgroundImage = `linear-gradient(135deg, rgba(0,0,0,0.85), rgba(0,0,0,0.5)), url("${loadedSource}")`;
                    bgLayer.classList.add("is-loaded");
                    return;
                } catch (e) { continue; }
            }
            bgLayer.classList.add("is-fallback");
        }

            initWallpaper();

            // Alphabetical Sort logic for native select options
            const options = Array.from(actionDropdown.options).slice(1);
            options.sort((a, b) => a.textContent.toUpperCase().localeCompare(b.textContent.toUpperCase()));
            while (actionDropdown.options.length > 1) actionDropdown.remove(1);
            options.forEach(option => actionDropdown.add(option));

            // Custom Dropdown Logic
            function buildCustomDropdown() {
                customOptionsContainer.innerHTML = '';
                Array.from(actionDropdown.options).forEach(opt => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'custom-select-option';
                    btn.textContent = opt.textContent;
                    btn.dataset.value = opt.value;
                    btn.addEventListener('click', () => selectOption(opt.value, opt.textContent));
                    customOptionsContainer.appendChild(btn);
                });
            }

            function selectOption(val, text) {
                actionDropdown.value = val;
                customTrigger.textContent = text;
                customDropdown.classList.remove('is-open');
                
                // Dispatch change event to trigger existing template logic
                actionDropdown.dispatchEvent(new Event('change'));
                
                // Highlight selected
                customOptionsContainer.querySelectorAll('.custom-select-option').forEach(btn => {
                    btn.classList.toggle('is-selected', btn.dataset.value === val);
                });
            }

            customTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                customDropdown.classList.toggle('is-open');
                if (customDropdown.classList.contains('is-open')) customSearch.focus();
            });

            customSearch.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                customOptionsContainer.querySelectorAll('.custom-select-option').forEach(btn => {
                    const matches = btn.textContent.toLowerCase().includes(term);
                    btn.style.display = matches ? 'block' : 'none';
                });
            });

            document.addEventListener('click', () => customDropdown.classList.remove('is-open'));
            customMenu.addEventListener('click', (e) => e.stopPropagation());

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') customDropdown.classList.remove('is-open');
            });

            // Initial build
            buildCustomDropdown();

            // Original template logic
            function autoResize(textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = textarea.scrollHeight + 'px';
            }

            function showToast(msg = "Copied!") {
                toast.textContent = msg;
                toast.classList.add('visible');
                setTimeout(() => toast.classList.remove('visible'), 2000);
            }

            function copyToClipboard(text) {
                const temp = document.createElement('textarea');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                try { document.execCommand('copy'); showToast(); } catch (err) { }
                document.body.removeChild(temp);
            }

            actionDropdown.addEventListener('change', function() {
                const val = this.value;
                if (actionTextMap[val]) {
                    emptyState.style.display = 'none';
                    textAreasDiv.style.display = 'block';

                    if (val === 'reKey') {
                        const today = new Date();
                        const dateStr = `${today.getMonth() + 1}/${today.getDate()}/${today.getFullYear()}`;
                        staticTextarea.value = `${dateStr} - Rekey to show the rental equipment the patient has.\n\nREKEYED SO#CODE: Rekey to show the rental equipment the patient has.`;
                    } else {
                        staticTextarea.value = actionTextMap[val].static;
                    }
                    dynamicTextarea.value = actionTextMap[val].dynamic;

                    setTimeout(() => {
                        autoResize(staticTextarea);
                        autoResize(dynamicTextarea);
                    }, 50);
                } else {
                    emptyState.style.display = 'block';
                    textAreasDiv.style.display = 'none';
                }
            });

            staticTextarea.addEventListener('input', () => autoResize(staticTextarea));
            dynamicTextarea.addEventListener('input', () => autoResize(dynamicTextarea));

            document.querySelectorAll('.copy-icon-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetId = btn.getAttribute('data-target');
                    const area = document.getElementById(targetId);
                    if (area) copyToClipboard(area.value);
                });
            });
        });
