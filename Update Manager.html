
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updates Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/emoji-js/3.8.0/emoji.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(10px); }
        }

        .update-card-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .update-card-leave {
            animation: fadeOut 0.3s ease-in forwards;
        }

        /* Toast Animation */
        @keyframes slideInUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes slideOutDown {
            from { transform: translate(-50%, 0); opacity: 1; }
            to { transform: translate(-50%, 100%); opacity: 0; }
        }
        
        .toast-show {
            animation: slideInUp 0.3s ease-out forwards;
        }
        .toast-hide {
            animation: slideOutDown 0.3s ease-in forwards;
        }

        /* Modal transitions */
        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease-out;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            transform: scale(0.95) translateY(-20px);
            opacity: 0;
            transition: all 0.3s ease-out;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* Search highlight */
        mark.search-highlight {
            background: linear-gradient(180deg, #fde68a 0%, #f2b90c 100%);
            color: #1c1300;
            padding: 0 2px;
            border-radius: 3px;
            font-weight: 700;
            box-shadow: 0 0 0 1px rgba(217, 160, 10, 0.45);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center bg-slate-950 text-slate-200">

    <div class="max-w-4xl w-full">
        
        <!-- Header & Actions -->
        <header class="bg-slate-900 rounded-2xl shadow-lg border border-slate-800 p-6 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Updates Manager</h1>
                <p class="text-sm text-slate-400 mt-1">Manage and share team announcements</p>
            </div>
            <div class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="openModal('add')" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-xl transition-colors shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900">
                    + New Update
                </button>
                <div class="flex gap-2 flex-1 md:flex-none">
                    <button onclick="exportJSON()" class="flex-1 md:flex-none bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 px-3 rounded-xl transition-colors border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Export
                    </button>
                    <label class="flex-1 md:flex-none bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 px-3 rounded-xl transition-colors border border-slate-700 text-sm cursor-pointer text-center focus-within:ring-2 focus-within:ring-slate-500">
                        <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Import
                        <input type="file" id="importFile" accept=".json" class="hidden" onchange="importJSON(event)">
                    </label>
                </div>
            </div>
        </header>

        <!-- Search Section -->
        <div class="mb-6">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-slate-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </div>
                <input type="text" id="searchInput" placeholder="Search updates by title, author, or content..." 
                    class="block w-full pl-11 pr-4 py-3 bg-slate-900 border border-slate-700 text-slate-200 rounded-xl leading-5 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm shadow-sm transition-shadow">
            </div>
        </div>

        <!-- Updates Container -->
        <div id="updatesContainer" class="space-y-4">
            <!-- Updates will be rendered here -->
        </div>

    </div>

    <!-- Modal for Add/Edit -->
    <div id="updateModal" class="modal-overlay fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="modal-content bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                <h3 id="modalTitle" class="text-lg font-semibold text-white">New Update</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white focus:outline-none p-1 rounded-md hover:bg-slate-800 transition-colors">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <form id="updateForm" onsubmit="handleFormSubmit(event)" class="p-6 overflow-y-auto flex-1">
                <input type="hidden" id="updateId">
                
                <div class="space-y-4">
                    <div>
                        <label for="title" class="block text-sm font-medium text-slate-300 mb-1">Title</label>
                        <input type="text" id="title" required
                            class="w-full px-3 py-2 bg-slate-950 border border-slate-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors">
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="author" class="block text-sm font-medium text-slate-300 mb-1">From Who</label>
                            <input type="text" id="author" required
                                class="w-full px-3 py-2 bg-slate-950 border border-slate-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors">
                        </div>
                        <div>
                            <label for="date" class="block text-sm font-medium text-slate-300 mb-1">Date</label>
                            <input type="date" id="date" required
                                class="w-full px-3 py-2 bg-slate-950 border border-slate-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors [color-scheme:dark]">
                        </div>
                    </div>

                    <div>
                        <label for="content" class="block text-sm font-medium text-slate-300 mb-1">Content</label>
                        <textarea id="content" rows="6" required
                            class="w-full px-3 py-2 bg-slate-950 border border-slate-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors font-mono text-sm resize-y"></textarea>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-3 border-t border-slate-800 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-slate-500 transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-blue-500 transition-colors">
                        Save Update
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-2 opacity-0 pointer-events-none z-50">
        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMessage" class="text-sm font-medium">Copied to clipboard!</span>
    </div>

    <script>
        // State
        let updates = [];
        let searchQuery = '';

        // Helper: Convert Slack emoji shortcodes to Unicode emojis
        function convertEmojis(text) {
            if (typeof EmojiConvertor !== 'undefined') {
                if (!window.emojiInstance) {
                    window.emojiInstance = new EmojiConvertor();
                    window.emojiInstance.replace_mode = 'unified';
                    window.emojiInstance.allow_native = true;
                }
                return window.emojiInstance.replace_colons(text);
            }
            return text;
        }

        // Initial Sample Data
        const sampleUpdate = {
            id: generateId(),
            title: "FIRST WITHDRAWAL :tada:",
            author: "Paolo",
            date: "2026-08-12",
            content: `:memo: Team, whenever you flag a first or initial withdrawal request in the #withdrawal-requests channel, please make sure to clearly indicate that it is the customer’s first withdrawal. This will help the Withdrawals Team identify these requests more easily and prioritize them accordingly.\n\nSample:\n\nFIRST WITHDRAWAL\nHello Team. Kindly review & approve this CX's first withdrawal request if eligible. Thank you.\n\nEric Borja| 12121212 |\nEmail: EricB@gmail.com\nPhone: +273232323232`
        };

        // Initialize App
        function init() {
            // Load from localStorage or use sample
            const stored = localStorage.getItem('updatesManagerData');
            if (stored) {
                try {
                    updates = JSON.parse(stored);
                } catch(e) {
                    updates = [sampleUpdate];
                }
            } else {
                updates = [sampleUpdate];
                saveData();
            }

            renderUpdates();

            // Set up search listener
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderUpdates();
            });
            
            // Set default date in modal to today
            document.getElementById('date').valueAsDate = new Date();
        }

        // Helper: Generate unique ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // Helper: Save to localStorage
        function saveData() {
            localStorage.setItem('updatesManagerData', JSON.stringify(updates));
        }

        // Helper: Escape HTML special characters so raw text can be safely injected
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Helper: Escape a string for safe use inside a RegExp
        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Helper: Escape text, then wrap all case-insensitive matches of the
        // current search query in a highlight <mark>. Returns safe HTML.
        function highlightText(text, query) {
            const escaped = escapeHtml(text != null ? text : '');
            if (!query) return escaped;

            try {
                const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
                return escaped.replace(regex, '<mark class="search-highlight">$1</mark>');
            } catch (e) {
                return escaped;
            }
        }

        // Format Date for display
        function formatDateDisplay(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        // Render Updates List
        function renderUpdates() {
            const container = document.getElementById('updatesContainer');
            container.innerHTML = '';

            // Filter and Sort
            const filteredUpdates = updates.filter(u => {
                if (!searchQuery) return true;
                return u.title.toLowerCase().includes(searchQuery) ||
                       u.author.toLowerCase().includes(searchQuery) ||
                       u.content.toLowerCase().includes(searchQuery);
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filteredUpdates.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-slate-900 rounded-2xl border border-dashed border-slate-700">
                        <svg class="mx-auto h-12 w-12 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        <h3 class="mt-2 text-sm font-medium text-slate-300">No updates found</h3>
                        <p class="mt-1 text-sm text-slate-500">Get started by creating a new update or importing a JSON file.</p>
                    </div>`;
                return;
            }

            filteredUpdates.forEach(update => {
                const card = document.createElement('div');
                card.className = 'update-card-enter bg-slate-900 rounded-2xl shadow-lg border border-slate-800 overflow-hidden relative group hover:border-slate-600 transition-colors duration-200';
                card.id = `update-${update.id}`;
                
                // Convert Slack emojis to Unicode
                const titleWithEmojis = convertEmojis(update.title);
                const contentWithEmojis = convertEmojis(update.content);

                // Build highlighted (but still safely-escaped) HTML for display.
                // The underlying `updates` data is never modified, so copying
                // and editing always use the original, un-highlighted content.
                const titleDisplay = highlightText(titleWithEmojis, searchQuery);
                const titleAttr = escapeHtml(titleWithEmojis);
                const authorDisplay = highlightText(update.author, searchQuery);
                const dateDisplay = highlightText(formatDateDisplay(update.date), searchQuery);

                // Format content with breaks for HTML display, but keep raw for copy
                const displayContent = highlightText(contentWithEmojis, searchQuery).replace(/\n/g, '<br>');

                card.innerHTML = `
                    <!-- Clickable area for copy -->
                    <div class="p-6 cursor-pointer relative z-10" onclick="copyUpdate('${update.id}')" tabindex="0" role="button" aria-label="Copy ${titleAttr}">
                        
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h2 class="text-xl font-bold text-white group-hover:text-blue-400 transition-colors">${titleDisplay}</h2>
                                <div class="flex items-center gap-3 mt-1 text-sm text-slate-400">
                                    <span class="flex items-center gap-1">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                        ${authorDisplay}
                                    </span>
                                    <span class="text-slate-600">&bull;</span>
                                    <span class="flex items-center gap-1">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        ${dateDisplay}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="text-slate-300 whitespace-pre-wrap font-mono text-sm bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">${displayContent}</div>
                        
                        <!-- Non-intrusive copy indicator -->
                        <div class="absolute top-6 right-6 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center gap-1 text-xs font-medium text-slate-400 bg-slate-800 border border-slate-700 px-2 py-1 rounded-md shadow-sm">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                            Copy
                        </div>
                    </div>
                    
                    <!-- Action Buttons (prevent event bubbling so they don't trigger copy) -->
                    <div class="absolute bottom-4 right-4 z-30 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="event.stopPropagation(); openModal('edit', '${update.id}')" class="p-2 text-slate-400 hover:text-blue-400 bg-slate-800 hover:bg-slate-700 rounded-lg shadow-sm border border-slate-700 transition-colors" title="Edit">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </button>
                        <button onclick="event.stopPropagation(); deleteUpdate('${update.id}')" class="p-2 text-slate-400 hover:text-red-400 bg-slate-800 hover:bg-slate-700 rounded-lg shadow-sm border border-slate-700 transition-colors" title="Delete">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Copy to clipboard
        function copyUpdate(id) {
            const update = updates.find(u => u.id === id);
            if (!update) return;

            const titleWithEmojis = convertEmojis(update.title);
            const contentWithEmojis = convertEmojis(update.content);

            // Format for clipboard: Title followed by converted content
            const textToCopy = `${titleWithEmojis}\n\n${contentWithEmojis}`;
            
            // Create a temporary textarea to execute copy
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            
            // Avoid scrolling to bottom
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if(successful) {
                    showToast('Copied to clipboard!');
                } else {
                    showToast('Failed to copy', true);
                }
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showToast('Failed to copy', true);
            }

            document.body.removeChild(textArea);
        }

        // Show Toast Notification
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toastMessage');
            
            msgSpan.textContent = message;
            
            // Adjust styling based on error
            if(isError) {
                toast.classList.replace('bg-slate-800', 'bg-red-900');
                toast.querySelector('svg').classList.replace('text-emerald-400', 'text-slate-100');
            } else {
                toast.classList.replace('bg-red-900', 'bg-slate-800');
                toast.querySelector('svg').classList.replace('text-slate-100', 'text-emerald-400');
            }

            toast.classList.remove('toast-hide');
            toast.classList.add('toast-show');

            setTimeout(() => {
                toast.classList.remove('toast-show');
                toast.classList.add('toast-hide');
            }, 2500);
        }

        // Delete Update
        function deleteUpdate(id) {
            if (confirm('Are you sure you want to delete this update?')) {
                const card = document.getElementById(`update-${id}`);
                // Add exit animation
                card.classList.remove('update-card-enter');
                card.classList.add('update-card-leave');
                
                setTimeout(() => {
                    updates = updates.filter(u => u.id !== id);
                    saveData();
                    renderUpdates();
                    showToast('Update deleted');
                }, 300); // match animation duration
            }
        }

        // Modal logic
        const modal = document.getElementById('updateModal');
        const form = document.getElementById('updateForm');

        function openModal(mode, id = null) {
            const titleEl = document.getElementById('modalTitle');
            form.reset();
            document.getElementById('updateId').value = '';

            if (mode === 'edit' && id) {
                const update = updates.find(u => u.id === id);
                if (update) {
                    titleEl.textContent = 'Edit Update';
                    document.getElementById('updateId').value = update.id;
                    document.getElementById('title').value = update.title;
                    document.getElementById('author').value = update.author;
                    document.getElementById('date').value = update.date;
                    document.getElementById('content').value = update.content;
                }
            } else {
                titleEl.textContent = 'New Update';
                document.getElementById('date').valueAsDate = new Date(); // default today
            }

            modal.classList.add('active');
            
            // Focus title input on open for accessibility/convenience
            setTimeout(() => document.getElementById('title').focus(), 100);
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // Close modal on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // Handle Form Submit (Create/Update)
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('updateId').value;
            const newUpdate = {
                id: id || generateId(),
                title: document.getElementById('title').value.trim(),
                author: document.getElementById('author').value.trim(),
                date: document.getElementById('date').value,
                content: document.getElementById('content').value.trim()
            };

            if (id) {
                // Update existing
                const index = updates.findIndex(u => u.id === id);
                if (index !== -1) {
                    updates[index] = newUpdate;
                    showToast('Update saved');
                }
            } else {
                // Create new
                updates.push(newUpdate);
                showToast('Update created');
            }

            saveData();
            renderUpdates();
            closeModal();
            
            // Reset search when adding new to ensure it's visible
            if(!id) {
                document.getElementById('searchInput').value = '';
                searchQuery = '';
                renderUpdates();
            }
        }

        // Export JSON
        function exportJSON() {
            if (updates.length === 0) {
                alert("No updates to export.");
                return;
            }
            
            const dataStr = JSON.stringify(updates, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = `updates_export_${new Date().toISOString().split('T')[0]}.json`;
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            
            showToast('JSON Exported');
        }

        // Import JSON
        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // Basic validation to check if it looks like our data structure
                    if (Array.isArray(importedData) && importedData.length > 0 && 'title' in importedData[0]) {
                        
                        if (confirm(`This will replace your current ${updates.length} updates with ${importedData.length} imported updates. Proceed?`)) {
                            // Re-generate IDs to ensure uniqueness if needed, or trust the import
                            updates = importedData;
                            saveData();
                            renderUpdates();
                            showToast('Import successful!');
                        }
                    } else if (Array.isArray(importedData) && importedData.length === 0){
                         if (confirm(`Importing an empty list. This will clear your current updates. Proceed?`)) {
                            updates = [];
                            saveData();
                            renderUpdates();
                            showToast('Cleared updates (empty import)');
                        }
                    } else {
                        alert("Invalid JSON format. Please upload a file generated by this tool.");
                    }
                } catch (error) {
                    alert("Error parsing JSON file. Please ensure it is a valid JSON.");
                    console.error("Import error:", error);
                }
                
                // Reset file input so same file can be imported again if needed
                event.target.value = '';
            };
            
            reader.readAsText(file);
        }

        // Run init on load
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
