<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Case Converter</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2363cab7'/%3E%3Cstop offset='1' stop-color='%237c6fdb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='30' fill='%230b0d11'%3EAa%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --font-display: 'Syne', sans-serif;
  --font-mono: 'DM Mono', monospace;

  --bg-base:        #0b0d11;
  --bg-surface:     #12151c;
  --bg-elevated:    #181c27;
  --bg-glass:       rgba(24, 28, 39, 0.72);
  --border:         rgba(255,255,255,0.07);
  --border-accent:  rgba(99,202,183,0.35);

  --text-primary:   #eef0f5;
  --text-muted:     #454d5e;
  --text-secondary: #7c8494;

  --accent:         #63cab7;
  --accent-glow:    rgba(99,202,183,0.18);
  --accent2:        #7c6fdb;

  --danger:         #e2607a;
  --success:        #5ecb8a;

  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-xl: 26px;

  --shadow-card: 0 4px 32px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.04) inset;
  --transition:  0.22s cubic-bezier(0.4,0,0.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-display);
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 20%, rgba(99,202,183,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 80%, rgba(124,111,219,0.07) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

.page-wrap { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  background: var(--bg-glass);
  border-bottom: 1px solid var(--border);
  padding: 0 clamp(16px, 4vw, 40px);
  height: 64px;
  display: flex; align-items: center;
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); }
.logo-mark {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; color: #0b0d11;
  box-shadow: 0 0 16px var(--accent-glow);
  letter-spacing: -1px;
}
.logo-text { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.logo-text span { color: var(--accent); }

/* Main */
.main {
  flex: 1;
  padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 40px);
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
  display: flex;
  align-items: flex-start;
}

.card {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.card:focus-within {
  border-color: var(--border-accent);
  box-shadow: var(--shadow-card), 0 0 0 2px var(--accent-glow);
}

.textarea-header {
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-muted);
  display: flex; align-items: center; gap: 7px;
}
.textarea-header svg { color: var(--accent); }

#main-textarea {
  width: 100%;
  min-height: clamp(190px, 31vh, 400px);
  resize: vertical;
  background: transparent;
  border: none; outline: none;
  padding: 22px 24px;
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 300;
  color: var(--text-primary);
  line-height: 1.8;
  caret-color: var(--accent);
}
#main-textarea::placeholder { color: var(--text-muted); font-style: italic; }

/* Toolbar */
.toolbar {
  padding: 16px 20px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg-elevated);
  display: flex; flex-wrap: wrap; gap: 8px;
}

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 15px;
  border-radius: var(--radius-md);
  font-family: var(--font-display);
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-secondary);
  transition: all var(--transition);
  white-space: nowrap;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover {
  border-color: var(--border-accent);
  color: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.35), 0 0 12px var(--accent-glow);
}
.btn:active { transform: translateY(0) scale(0.97); box-shadow: none; }
.btn.is-active {
  background: var(--accent-glow);
  border-color: var(--border-accent);
  color: var(--accent);
}
.btn-icon { font-size: 15px; }

.btn-copy {
  margin-left: auto;
  background: linear-gradient(135deg, var(--accent), #4ab8a8);
  border-color: transparent;
  color: #0b1a18;
  font-weight: 700;
}
.btn-copy:hover { color: #071210; border-color: transparent; }

/* Toast */
.toast-container {
  position: fixed; bottom: 28px; right: 24px; z-index: 999;
  display: flex; flex-direction: column-reverse; gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 11px 18px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-accent);
  border-radius: var(--radius-md);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  font-size: 14px; font-weight: 500;
  animation: toastIn 0.3s ease both;
}
.toast.error { border-color: rgba(226,96,122,0.4); }
.toast.out { animation: toastOut 0.25s ease forwards; }
@keyframes toastIn  { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to   { opacity: 0; transform: translateX(24px); } }

@media (max-width: 600px) {
  .btn { padding: 8px 12px; font-size: 12px; }
  #main-textarea { font-size: 16px; padding: 16px; }
  .toast-container { bottom: 16px; right: 12px; left: 12px; }
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }
</style>
</head>
<body>
<div class="page-wrap">

  <header class="header" role="banner">
    <a class="logo" href="#" aria-label="Case Converter">
      <div class="logo-mark" aria-hidden="true">Aa</div>
      <span class="logo-text">Case<span>Converter</span></span>
    </a>
  </header>

  <main class="main" role="main">
    <div class="card" role="region" aria-label="Text editor">

      <div class="textarea-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Input Text
      </div>

      <textarea
        id="main-textarea"
        placeholder="Click here to paste your copied text, or type something…"
        aria-label="Text input area"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
      ></textarea>

      <div class="toolbar" role="toolbar" aria-label="Case transformations">
        <button class="btn" data-action="sentence"><span class="btn-icon" aria-hidden="true">⊕</span> Sentence case</button>
        <button class="btn" data-action="lower"><span class="btn-icon" aria-hidden="true">↓</span> lowercase</button>
        <button class="btn" data-action="upper"><span class="btn-icon" aria-hidden="true">↑</span> UPPERCASE</button>
        <button class="btn" data-action="capitalize"><span class="btn-icon" aria-hidden="true">◈</span> Capitalized Case</button>
        <button class="btn" data-action="alternating"><span class="btn-icon" aria-hidden="true">⇅</span> aLtErNaTiNg</button>
        <button class="btn is-active" data-action="title"><span class="btn-icon" aria-hidden="true">❑</span> Title Case</button>
        <button class="btn" data-action="inverse"><span class="btn-icon" aria-hidden="true">⊘</span> iNVERSE cAsE</button>
        <button class="btn btn-copy" id="copyBtn" aria-label="Copy text">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span id="copyLabel">Copy</span>
        </button>
      </div>

    </div>
  </main>

</div>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  const textarea = document.getElementById('main-textarea');
  const toastContainer = document.getElementById('toastContainer');
  const buttons = document.querySelectorAll('[data-action]');

  /* ── Transformations ── */
  const transformers = {
    sentence(text) {
      return text.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g, c => c.toUpperCase());
    },
    lower(text) { return text.toLowerCase(); },
    upper(text) { return text.toUpperCase(); },
    capitalize(text) { return text.replace(/\b\w/g, c => c.toUpperCase()); },
    alternating(text) {
      let i = 0;
      return text.split('').map(c =>
        /[a-zA-Z]/.test(c) ? (i++ % 2 === 0 ? c.toLowerCase() : c.toUpperCase()) : c
      ).join('');
    },
    title(text) {
      const minors = new Set(['a','an','the','and','but','or','for','nor','on','at','to','by','in','of','up','as','is','it']);
      return text.toLowerCase().replace(/\b\w+/g, (word, offset, str) => {
        if (offset === 0) return word.charAt(0).toUpperCase() + word.slice(1);
        const prev = str.slice(0, offset).replace(/\s+$/, '');
        if (/[.!?:]\s*$/.test(prev)) return word.charAt(0).toUpperCase() + word.slice(1);
        if (minors.has(word)) return word;
        return word.charAt(0).toUpperCase() + word.slice(1);
      });
    },
    inverse(text) {
      return text.split('').map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join('');
    },
  };

  function setActive(action) {
    buttons.forEach(b => b.classList.toggle('is-active', b.dataset.action === action));
  }

  function applyTransform(action) {
    if (!textarea.value.trim()) { toast('Nothing to transform', 'error'); return; }
    textarea.value = transformers[action](textarea.value);
    setActive(action);
  }

  buttons.forEach(btn => btn.addEventListener('click', () => applyTransform(btn.dataset.action)));

  /* ── Auto-paste on focus → Title Case ── */
  let lastClipboard = null;
  let clipboardUnavailable = false; // set after a block/dismiss so it never asks again this session

  async function pasteFromClipboard() {
    if (clipboardUnavailable || !navigator.clipboard || !navigator.clipboard.readText) return;
    try {
      const clip = await navigator.clipboard.readText();
      if (!clip || !clip.trim() || clip === lastClipboard) return;
      lastClipboard = clip;
      const titled = transformers.title(clip);
      if (titled === textarea.value) return;
      textarea.value = titled;
      setActive('title');
      toast('Pasted as Title Case');
    } catch (err) {
      /* permission blocked/dismissed or unavailable: stop asking, Ctrl+V still works */
      clipboardUnavailable = true;
    }
  }

  textarea.addEventListener('focus', pasteFromClipboard);

  /* Manual paste (Ctrl+V) is also converted to Title Case */
  textarea.addEventListener('paste', () => {
    setTimeout(() => {
      textarea.value = transformers.title(textarea.value);
      setActive('title');
    }, 0);
  });

  /* ── Copy ── */
  const copyBtn = document.getElementById('copyBtn');
  const copyLabel = document.getElementById('copyLabel');
  copyBtn.addEventListener('click', async () => {
    const text = textarea.value;
    if (!text.trim()) { toast('Nothing to copy', 'error'); return; }
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      textarea.select();
      document.execCommand('copy');
      textarea.setSelectionRange(text.length, text.length);
    }
    lastClipboard = text; // so focusing the box doesn't re-paste what we just copied
    copyLabel.textContent = 'Copied!';
    setTimeout(() => { copyLabel.textContent = 'Copy'; }, 1800);
  });

  /* ── Toast ── */
  function toast(message, type = 'info', duration = 2200) {
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = message;
    toastContainer.appendChild(t);
    setTimeout(() => {
      t.classList.add('out');
      t.addEventListener('animationend', () => t.remove(), { once: true });
    }, duration);
  }
})();
</script>
</body>
</html>
