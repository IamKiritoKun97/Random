<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --card-bg: rgba(20, 20, 23, 0.8);
            --border-muted: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
        }

        body {
            font-family: 'Geist', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Modern Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Glassmorphism Refined */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-muted);
        }

        .copy-surface {
            position: relative;
            cursor: pointer;
            transition: all 0.15s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .copy-surface:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .copy-surface:active {
            transform: scale(0.98);
        }

        .copy-feedback {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            border-radius: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .copy-feedback.active {
            opacity: 1;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-up {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .list-container {
            height: calc(100vh - 360px);
            min-height: 450px;
        }

        input::placeholder {
            color: #52525b;
        }
    </style>
</head>
<body class="selection:bg-white selection:text-black">

    <div class="max-w-4xl mx-auto px-5 py-8 md:py-16">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row sm:items-end justify-between gap-6 mb-12">
            <div>
                <h1 class="text-4xl font-light tracking-tighter text-white">Records<span class="text-zinc-600">.</span></h1>
                <p class="text-zinc-500 text-xs mt-2 font-medium tracking-[0.2em] uppercase">Private Encryption & Storage</p>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="document.getElementById('file-input').click()" class="flex items-center gap-2 px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-xs font-bold uppercase tracking-widest hover:bg-zinc-800 transition-all active:scale-95">
                    Import
                </button>
                <input type="file" id="file-input" class="hidden" accept=".json" onchange="importData(event)">
                
                <button onclick="exportData()" class="flex items-center gap-2 px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-xs font-bold uppercase tracking-widest hover:bg-zinc-800 transition-all active:scale-95">
                    Export
                </button>
            </div>
        </header>

        <!-- Search and Global Actions -->
        <div class="flex flex-col md:flex-row gap-3 mb-8">
            <div class="relative flex-grow group">
                <div class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-600 transition-colors group-focus-within:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </div>
                <input 
                    type="text" 
                    id="search-input"
                    oninput="renderData()"
                    placeholder="Search entry..." 
                    class="w-full bg-zinc-900/50 border border-zinc-800 focus:border-white rounded-xl py-4 pl-12 pr-4 outline-none transition-all text-sm font-medium"
                >
            </div>
            <button onclick="toggleAddForm()" class="bg-white text-black hover:bg-zinc-200 rounded-xl px-8 py-4 flex items-center justify-center gap-2 font-bold transition-all active:scale-95 whitespace-nowrap text-sm uppercase tracking-wider">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Entry
            </button>
        </div>

        <!-- Add Form -->
        <div id="add-form" class="hidden mb-8 p-6 glass-panel rounded-2xl animate-up">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xs font-bold text-white uppercase tracking-[0.3em]">Add New Record</h3>
                <button onclick="toggleAddForm()" class="text-zinc-500 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-[10px] text-zinc-500 uppercase font-black tracking-widest">Identifier</label>
                    <input id="input-left" type="text" placeholder="Name / Service" class="w-full bg-black border border-zinc-800 rounded-lg p-4 outline-none focus:border-zinc-500 transition-colors text-sm">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] text-zinc-500 uppercase font-black tracking-widest">Detail / Content</label>
                    <div class="flex gap-2">
                        <input id="input-right" type="text" placeholder="Value / Number" class="flex-grow bg-black border border-zinc-800 rounded-lg p-4 outline-none focus:border-zinc-500 transition-colors text-sm">
                        <button onclick="saveNewEntry()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 rounded-lg font-bold transition-all text-xs uppercase tracking-widest active:scale-95">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Records List -->
        <div id="records-container" class="space-y-3 list-container overflow-y-auto pr-2 custom-scrollbar">
            <!-- Items injected by JS -->
        </div>

        <!-- Footer -->
        <footer class="mt-12 flex flex-col sm:flex-row justify-between items-center gap-6 text-[10px] text-zinc-600 uppercase font-bold tracking-[0.3em] border-t border-zinc-900 pt-8">
            <span id="record-count">0 Documents Loaded</span>
            <div class="flex items-center gap-6">
                <span class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    System Online
                </span>
                <span>v2.0.0</span>
            </div>
        </footer>
    </div>

    <!-- Feedback Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 bg-white text-black text-xs font-black uppercase tracking-widest rounded-full shadow-[0_0_30px_rgba(255,255,255,0.15)] transition-all opacity-0 pointer-events-none translate-y-4 z-50 flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="toast-text">Copied</span>
    </div>

    <script>
        let records = [
            { id: 1, left: "Ramon Tariao", right: "09068961930" }
        ];

        const STORAGE_KEY = 'personal_midnight_records';

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    records = JSON.parse(saved);
                } catch(e) { console.error(e); }
            }
            renderData();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            updateStats();
        }

        function toggleAddForm() {
            const form = document.getElementById('add-form');
            form.classList.toggle('hidden');
            if (!form.classList.contains('hidden')) {
                document.getElementById('input-left').focus();
            }
        }

        function saveNewEntry() {
            const left = document.getElementById('input-left').value.trim();
            const right = document.getElementById('input-right').value.trim();
            
            if (!left && !right) return;

            const newEntry = {
                id: Date.now(),
                left: left || 'Untitled',
                right: right || '—'
            };

            records.unshift(newEntry);
            saveData();
            renderData();
            
            document.getElementById('input-left').value = '';
            document.getElementById('input-right').value = '';
            toggleAddForm();
        }

        function deleteRecord(id) {
            // Using a simple custom check instead of standard alert for cleaner UI
            if(!confirm('Delete this record permanently?')) return;
            records = records.filter(r => r.id !== id);
            saveData();
            renderData();
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toastText.textContent = `Copied: ${text}`;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2000);
        }

        function copy(text, element) {
            const el = document.createElement('textarea');
            el.value = text;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const feedback = element.querySelector('.copy-feedback');
            feedback.classList.add('active');
            setTimeout(() => feedback.classList.remove('active'), 400);
            
            showToast(text);
        }

        function exportData() {
            const dataStr = JSON.stringify(records, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `midnight_vault_${new Date().getTime()}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        records = imported;
                        saveData();
                        renderData();
                        showToast("Data Synced");
                    }
                } catch(err) {
                    alert("Import failed: Corrupted file");
                }
            };
            reader.readAsText(file);
        }

        function updateStats() {
            document.getElementById('record-count').innerText = `${records.length} Documents Loaded`;
        }

        function renderData() {
            const container = document.getElementById('records-container');
            const search = document.getElementById('search-input').value.toLowerCase();
            container.innerHTML = '';

            const filtered = records.filter(r => 
                r.left.toLowerCase().includes(search) || 
                r.right.toLowerCase().includes(search)
            );

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-24 bg-zinc-900/10 border border-zinc-900/50 rounded-2xl">
                        <p class="text-zinc-700 text-xs font-black uppercase tracking-widest">Archive Empty</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(record => {
                const row = document.createElement('div');
                row.className = 'group flex items-stretch gap-2 animate-up';
                row.innerHTML = `
                    <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-2 bg-zinc-900/30 border border-zinc-900 p-2 rounded-xl transition-all hover:bg-zinc-900/50 hover:border-zinc-700">
                        
                        <div onclick="copy('${record.left}', this)" class="copy-surface rounded-lg p-4 flex items-center justify-between overflow-hidden">
                            <div class="copy-feedback">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                            <div class="flex flex-col truncate">
                                <span class="text-[10px] text-zinc-600 font-black uppercase tracking-tighter mb-1">Label</span>
                                <span class="text-white font-medium text-sm truncate">${record.left}</span>
                            </div>
                        </div>

                        <div onclick="copy('${record.right}', this)" class="copy-surface rounded-lg p-4 flex items-center justify-between overflow-hidden">
                            <div class="copy-feedback">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                            <div class="flex flex-col truncate">
                                <span class="text-[10px] text-zinc-600 font-black uppercase tracking-tighter mb-1">Detail</span>
                                <span class="mono text-zinc-300 font-medium text-sm truncate">${record.right}</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="deleteRecord(${record.id})" class="shrink-0 w-12 flex items-center justify-center text-zinc-700 hover:text-rose-500 hover:bg-rose-500/5 rounded-xl transition-all md:opacity-0 group-hover:opacity-100">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                `;
                container.appendChild(row);
            });
            updateStats();
        }

        window.onload = loadData;
    </script>
</body>
</html>
