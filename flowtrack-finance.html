<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowTrack Personal Finance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f172a'/><text y='46' x='8' font-size='42' font-family='system-ui' fill='%233b82f6' font-weight='bold'>₱</text></svg>">
<style>
:root {
  --bg: #050811;
  --surface: #0b1329;
  --surface2: #16223f;
  --surface3: #22345e;
  --border: #1d3368;
  --accent: #3b82f6;
  --accent2: #06b6d4;
  --accent3: #8b5cf6;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --text: #f8fafc;
  --text2: #cbd5e1;
  --text3: #64748b;
  --gold: #fbbf24;
  --glow: rgba(59, 130, 246, 0.12);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  height: 100%;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--surface3);
  border-radius: 4px;
}
#app {
  display: flex;
  height: 100vh;
  overflow: hidden;
  position: relative;
}

/* Sidebar Responsive Shell Styling */
#sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--surface);
  border-right: 1px solid rgba(29, 51, 104, 0.5);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  z-index: 50;
  transition: transform 0.3s ease;
}
#main {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  position: relative;
}
.sb-brand {
  padding: 24px 20px 16px;
  border-bottom: 1px solid rgba(29, 51, 104, 0.5);
}
.sb-brand h1 {
  font-size: 21px;
  font-weight: 800;
  background: linear-gradient(135deg, #60a5fa, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: .5px;
}
.sb-brand p {
  font-size: 10px;
  color: var(--text3);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.sb-section {
  padding: 16px 20px 6px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text3);
  font-weight: 700;
}
.sb-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  margin: 2px 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: all .2s ease;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
}
.sb-item:hover {
  background: var(--surface2);
  color: var(--text);
  transform: translateX(2px);
}
.sb-item.active {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.15));
  color: #60a5fa;
  font-weight: 600;
  border-left: 3px solid var(--accent);
}
.sb-item svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
.sb-badge {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  font-weight: 700;
}
.sb-footer {
  margin-top: auto;
  padding: 16px;
  border-top: 1px solid rgba(29, 51, 104, 0.5);
  font-size: 11px;
  color: var(--text3);
  text-align: center;
}

/* Mobile top bar and overlay menu styles */
#mobile-header {
  display: none;
  background: var(--surface);
  border-bottom: 1px solid rgba(29, 51, 104, 0.5);
  padding: 12px 16px;
  align-items: center;
  justify-content: space-between;
  z-index: 40;
}
#mobile-menu-btn {
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  padding: 4px;
}
#mobile-sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(2px);
  z-index: 45;
}

#topbar {
  background: var(--surface);
  border-bottom: 1px solid rgba(29, 51, 104, 0.5);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
#topbar h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.top-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.15s ease;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover {
  background: #2563eb;
  transform: translateY(-1px);
}
.btn-ghost {
  background: var(--surface2);
  color: var(--text2);
  border: 1px solid rgba(29, 51, 104, 0.5);
}
.btn-ghost:hover {
  background: var(--surface3);
  color: var(--text);
}
.btn-success {
  background: var(--success);
  color: #fff;
}
.btn-success:hover {
  background: #059669;
}
.btn-danger {
  background: rgba(239, 68, 68, 0.2);
  color: #f87171;
  border: 1px solid rgba(239, 68, 68, 0.4);
}
.btn-danger:hover {
  background: var(--danger);
  color: #fff;
}
.btn svg {
  width: 16px;
  height: 16px;
}
#content {
  padding: 24px;
  flex: 1;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.card {
  background: var(--surface);
  border: 1px solid rgba(29, 51, 104, 0.5);
  border-radius: 16px;
  padding: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
}
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
}
.card.blue::before { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.card.green::before { background: linear-gradient(90deg, var(--success), #34d399); }
.card.purple::before { background: linear-gradient(90deg, var(--accent3), #ec4899); }
.card.gold::before { background: linear-gradient(90deg, var(--gold), #f97316); }
.card.red::before { background: linear-gradient(90deg, var(--danger), #fb923c); }
.card-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text3);
  font-weight: 700;
  margin-bottom: 8px;
}
.card-value {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.5px;
}
.card-value.pos { color: var(--success); }
.card-value.neg { color: var(--danger); }
.card-value.warn { color: var(--warning); }
.card-sub {
  font-size: 12px;
  color: var(--text3);
  margin-top: 6px;
}
.section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title span {
  flex: 1;
}
.quick-actions-bar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  background: var(--surface);
  padding: 16px;
  border-radius: 16px;
  border: 1px solid rgba(29, 51, 104, 0.5);
}

/* Consolidated Reminder Center to avoid eating vertical space */
.reminders-center-card {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(239, 68, 68, 0.05) 100%);
  border: 1px solid rgba(245, 158, 11, 0.35);
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 20px;
}
.reminders-center-header {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  color: var(--warning);
  font-size: 14px;
  margin-bottom: 12px;
  border-bottom: 1px solid rgba(245, 158, 11, 0.15);
  padding-bottom: 8px;
}
.reminders-center-list {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
}
.reminders-center-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text2);
  padding: 4px 0;
}
.reminders-center-item-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.reminders-center-item-dot.overdue { background: var(--danger); }
.reminders-center-item-dot.soon { background: var(--warning); }
.reminders-center-item-dot.today { background: var(--gold); }

.onboarding-banner {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(6, 182, 212, 0.05) 100%);
  border: 1px solid rgba(59, 130, 246, 0.3);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.onboarding-banner-icon {
  background: rgba(59, 130, 246, 0.2);
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text3);
  font-weight: 700;
  padding: 10px 16px;
  border-bottom: 1px solid rgba(29, 51, 104, 0.5);
  background: var(--surface2);
}
td {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(29, 51, 104, 0.2);
  font-size: 13px;
  color: var(--text2);
  vertical-align: middle;
}
tr:hover td {
  background: var(--glow);
}
.tbl-wrap {
  background: var(--surface);
  border: 1px solid rgba(29, 51, 104, 0.5);
  border-radius: 16px;
  overflow-x: auto;
  margin-bottom: 24px;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}
.badge-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
.badge-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }
.badge-red { background: rgba(239, 68, 68, 0.15); color: #f87171; }
.badge-yellow { background: rgba(251, 191, 36, 0.15); color: #fcd34d; }
.badge-purple { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
.badge-gray { background: rgba(100, 116, 139, 0.15); color: #94a3b8; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--surface);
  border: 1px solid rgba(29, 51, 104, 0.5);
  border-radius: 20px;
  width: 100%;
  max-width: 550px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid rgba(29, 51, 104, 0.5);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 {
  font-size: 16px;
  font-weight: 700;
}
.modal-body {
  padding: 24px;
}
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid rgba(29, 51, 104, 0.5);
  display: flex;
  gap: 12px;
  justify-content: flex-end;
}
.close-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text3);
  padding: 6px;
  border-radius: 8px;
  display: flex;
  align-items: center;
}
.close-btn:hover {
  color: var(--text);
  background: var(--surface2);
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.form-group {
  margin-bottom: 16px;
  position: relative;
}
.form-group label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--text2);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid rgba(29, 51, 104, 0.5);
  border-radius: 10px;
  padding: 11px 14px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: all 0.15s ease;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}
.form-group textarea {
  resize: vertical;
  min-height: 80px;
}
select option {
  background: var(--surface2);
  color: var(--text);
}
.form-group input[type="color"] {
  padding: 6px;
  height: 42px;
  cursor: pointer;
}
.progress-bar {
  height: 10px;
  background: var(--surface3);
  border-radius: 6px;
  overflow: hidden;
  margin-top: 10px;
  position: relative;
}
.progress-fill {
  height: 100%;
  border-radius: 6px;
  transition: width .3s ease;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--surface3);
  border: 1px solid rgba(29, 51, 104, 0.5);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 11px;
  color: var(--text2);
}
.action-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  color: var(--text3);
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
}
.action-btn:hover {
  color: var(--text);
  background: var(--surface2);
}
.action-btn.del:hover {
  color: var(--danger);
  background: rgba(239, 68, 68, 0.15);
}
.action-btn.pay:hover {
  color: var(--success);
  background: rgba(16, 185, 129, 0.15);
}
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.toast {
  background: var(--surface2);
  border: 1px solid rgba(29, 51, 104, 0.5);
  border-radius: 12px;
  padding: 14px 20px;
  font-size: 13px;
  min-width: 280px;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
  animation: slideIn .2s ease-out;
  display: flex;
  align-items: center;
  gap: 12px;
}
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
@keyframes slideIn {
  from { transform: translateX(50px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text3);
  font-size: 13px;
}
.section-block {
  background: var(--surface);
  border: 1px solid rgba(29, 51, 104, 0.5);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}
.due-warn { color: var(--warning); font-weight: bold; }
.due-danger { color: var(--danger); font-weight: bold; }
.due-ok { color: var(--success); font-weight: bold; }

/* Institution Autocomplete dropdown styling */
.inst-suggestions {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--surface2);
  border: 1px solid rgba(29, 51, 104, 0.6);
  border-radius: 10px;
  max-height: 180px;
  overflow-y: auto;
  z-index: 15;
  display: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.inst-suggestion-item {
  padding: 10px 14px;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s ease;
}
.inst-suggestion-item:hover {
  background: var(--surface3);
  color: var(--text);
}

/* RESPONSIVE DESIGN ADJUSTMENTS */
@media (max-width: 1024px) {
  .cards-grid {
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
}

@media (max-width: 768px) {
  #mobile-header {
    display: flex;
  }
  #sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
    z-index: 100;
  }
  #sidebar.open {
    transform: translateX(0);
  }
  #topbar {
    display: none; /* Top actions handled inside the view content directly on mobile */
  }
  .form-row {
    grid-template-columns: 1fr;
    gap: 0;
  }
  #content {
    padding: 16px;
  }
}
</style>
</head>
<body>

<div id="mobile-sidebar-overlay" onclick="toggleMobileSidebar()"></div>

<div id="app">
  <nav id="sidebar">
    <div class="sb-brand">
      <h1>FlowTrack</h1>
      <p>Personal Finance</p>
    </div>
    <div style="padding: 8px 0; display: flex; flex-direction: column; flex: 1;">
      <div class="sb-section">Overview</div>
      <div class="sb-item active" onclick="nav('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </div>
      <div class="sb-section">Accounts</div>
      <div class="sb-item" onclick="nav('accounts')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        My Accounts
      </div>
      <div class="sb-section">Transactions</div>
      <div class="sb-item" onclick="nav('transactions')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        All Ledger
      </div>
      <div class="sb-item" onclick="nav('addtx')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Add Expense
      </div>
      <div class="sb-section">Planning</div>
      <div class="sb-item" onclick="nav('recurring')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        Recurring Bills
        <span class="sb-badge" id="recurring-badge">0</span>
      </div>
      <div class="sb-item" onclick="nav('cashflow')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        Future Balance
      </div>
      
      <div class="sb-section" style="margin-top: auto;">Data Management</div>
      <div class="sb-item" onclick="exportData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Export Backup
      </div>
      <div class="sb-item" onclick="triggerImport()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Import Backup
      </div>
      <div class="sb-item" onclick="confirmResetData()" style="color: #f87171;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        Clear All Data
      </div>
      <div class="sb-item" onclick="downloadApp()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Offline
      </div>
    </div>
    <div class="sb-footer">FlowTrack v3.2</div>
  </nav>
  
  <div id="main">

// Strictly ₱ Money Formatting (Smart Money Format Requirement)
function fmt(n) {
  return '₱' + new Intl.NumberFormat('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2}).format(n || 0);
}

// Strict MM/DD/YYYY Date Formatting (Smart Date Format Requirement)
function fmtDate(d) {
  if (!d) return '--';
  var parts = d.split('-');
  if (parts.length === 3) {
    return parts[1] + '/' + parts[2] + '/' + parts[0];
  }
  var dt = new Date(d + 'T00:00:00');
  var mm = String(dt.getMonth() + 1).padStart(2, '0');
  var dd = String(dt.getDate()).padStart(2, '0');
  var yyyy = dt.getFullYear();
  return mm + '/' + dd + '/' + yyyy;
}

// Current system context date
function today() {
  return '2026-06-13'; // Context Sync Saturday, June 13, 2026
}

function daysUntil(d) {
  if (!d) return null;
  var diff = new Date(d + 'T00:00:00') - new Date(today() + 'T00:00:00');
  return Math.round(diff / 86400000);
}

// =========================================================
function getRemindersList() {
  var reminders = [];
  for (var i = 0; i < db.recurring.length; i++) {
    var r = db.recurring[i];
    if (r.status !== 'Active') continue;
    var billDate = r.startMonth + '-' + String(r.dueDay).padStart(2, '0');
    var diff = daysUntil(billDate);
    if (diff === null) continue;

    if (diff < 0) {
      reminders.push({ text: r.name + " is overdue.", type: "overdue" });
    } else if (diff === 0) {
      reminders.push({ text: r.name + " is due today!", type: "today" });
    } else if (diff === 1) {
      reminders.push({ text: r.name + " payment is due tomorrow.", type: "soon" });
    } else if (diff === 3) {
      reminders.push({ text: r.name + " is due in 3 days.", type: "soon" });
    } else if (diff === 7) {
      reminders.push({ text: r.name + " is due in 7 days.", type: "soon" });
    }
  }
  return reminders;
}

// =========================================
// SMART FINANCIAL HEALTH SCORE (0-100)
// =========================================
function calculateFinancialHealth() {
  var score = 100;

  // 1. Debt Ratio (Money Owed vs Total Money Available)
  var cash = totalCash();
  var owed = totalOwed();
  if (owed > 0) {
    if (cash === 0) {
      score -= 30; // Maximum deduction for infinite debt ratio
    } else {
      var ratio = (owed / cash) * 100;
      if (ratio > 100) score -= 30;
      else if (ratio > 50) score -= 20;
      else if (ratio > 20) score -= 10;
    }
  }

  // 2. Overdue bills deduction
  var overdueCount = 0;
  for (var i = 0; i < db.recurring.length; i++) {
    var r = db.recurring[i];
    if (r.status === 'Active') {
      var bDate = r.startMonth + '-' + String(r.dueDay).padStart(2, '0');
      if ((daysUntil(bDate) || 0) < 0) {
        overdueCount++;
      }
    }
  }
  score -= (overdueCount * 15);

  // 3. Income vs Expenses this month
  var monthlyIn = thisMonthIncome();
  var monthlyOut = thisMonthSpend();
  if (monthlyOut > monthlyIn && monthlyIn > 0) {
    score -= 15; // Living beyond means this month
  }

  // 4. Savings consistency & reserves
  if (cash < 10000) {
    score -= 15; // Low cash reserve buffer
  } else if (cash > 30000) {
    score += 5; // Bonus buffer
  }

  score = Math.max(0, Math.min(100, score));

  var rating = "Needs Attention";
  if (score >= 85) rating = "Excellent";
  else if (score >= 70) rating = "Good";
  else if (score >= 50) rating = "Fair";

  return { score: Math.round(score), rating: rating };
}

// =========================================
// AUTOMATIC BACKGROUND PAYDAY PROCESSING
// =========================================
// Scans for paydays between last processed date and today (2026-06-13)
function autoProcessPaydays() {
  if (!db.payday || db.payday.status !== 'Active') return;
  var startStr = db.payday.lastProcessedDate || db.payday.startDate;
  var targetStr = today();

  var start = new Date(startStr + 'T00:00:00');
  var end = new Date(targetStr + 'T00:00:00');

  // Let's increment daily to find all Thursdays
  var cursor = new Date(start.getTime() + 86400000); // Start next day
  var loggedCount = 0;

  while (cursor <= end) {
    // Thursday is day 4 in JS getDay()
    if (cursor.getDay() === 4) {
      var dateString = cursor.toISOString().split('T')[0];
      
      // Prevent duplicates: Check if we already logged this paycheck
      var exists = db.transactions.some(function(t) {
        return t.date === dateString && t.desc.indexOf('Weekly Pay') >= 0;
      });

      if (!exists) {
        // Log transaction automatically
        var tx = {
          id: genId(),
          date: dateString,
          desc: 'Weekly Pay paycheck automatically processed',
          amount: db.payday.amount,
          type: 'income',
          fromAccount: 'acc_gcash', // Default paycheck receipt account
          category: 'Income',
          notes: 'Auto-processed Thursday paycheck.'
        };
        db.transactions.push(tx);
        
        // Add funds to GCash Account automatically
        var acc = getAccount('acc_gcash');
        if (acc) {
          acc.balance += db.payday.amount;
        }
        loggedCount++;
      }
    }
    cursor.setDate(cursor.getDate() + 1);
  }

  if (loggedCount > 0) {
    db.payday.lastProcessedDate = targetStr;
    saveDB();
    toast('Processed ' + loggedCount + ' automated payday paychecks!', 'success');
  }
}

    var t = filteredTxs[i];
    if (t.type === 'income') {
      income += t.amount;

    + '<div class="card blue"><div class="card-label">Item Count</div><div class="card-value">' + count + ' items</div><div class="card-sub">Filtered Transactions</div></div>'

function filterTx() {
  var q = (document.getElementById('tx-search').value || '').toLowerCase();

}

function quickAddTx() {
  var desc = document.getElementById('q-desc').value.trim();
  var amount = parseFloat(document.getElementById('q-amount').value);
  var date = document.getElementById('q-date').value;
  var acctId = document.getElementById('q-acct').value;
  var cat = document.getElementById('q-cat').value;
  var notes = document.getElementById('q-notes').value;

  if (!desc || isNaN(amount) || amount <= 0 || !date || !acctId) { 
    toast('Please fill in all required fields.', 'error'); 
    return; 
  }

  var a = getAccount(acctId);
  if (!a) { 
    toast('Source account selection is invalid.', 'error'); 
    return; 
  }

  // Overdraft Check (Req: Smart Validation except Credit Cards & Loans)
  if (a.type !== 'credit' && a.type !== 'loan' && (a.balance - amount) < 0) {
    toast('Transaction Blocked: Insufficient funds in ' + a.name + '.', 'error');
    return;
  }

  var tx = {id:genId(), date:date, desc:desc, amount:amount, type:'expense', fromAccount:acctId, category:cat, notes:notes};
  db.transactions.push(tx);

  // Core Account Balance Deduction logic (Smart Account Balance System / Smart Credit Card System)
  if (a.type === 'credit' || a.type === 'loan') {
    a.balance += amount; // Credit Owed increases
  } else {
    a.balance -= amount; // Asset decreases
  }

  saveDB();
  toast('Expense saved successfully!');
  document.getElementById('q-desc').value = '';
  document.getElementById('q-amount').value = '';
  document.getElementById('q-notes').value = '';
  renderAddTx(document.getElementById('content'));
}

function deleteTxMicro(id) {
  var tx = db.transactions.find(function(t){ return t.id === id; });
  if (tx) {
    var a = getAccount(tx.fromAccount);
    if (a) {
      if (a.type === 'credit' || a.type === 'loan') {
        a.balance = Math.max(0, a.balance - tx.amount);
      } else {
        a.balance += tx.amount;
      }
    }
    db.transactions = db.transactions.filter(function(t){return t.id !== id;});
    saveDB();
    toast('Transaction removed successfully.');
    renderAddTx(document.getElementById('content'));
  }
}

// RECURRING BILLS MANAGER
function renderRecurring(c) {
  var allRec = db.recurring;
  var activeRec = allRec.filter(function(r){return r.status === 'Active';});
  var pausedRec = allRec.filter(function(r){return r.status === 'Paused';});
  
  // Real-time Dashboard Insight Metrics (Satisfies "Smart Dashboard Insights" rule)
  var totalEstimatedCost = allRec.reduce(function(s,r){return s+r.amount;}, 0);
  var activeMonthlyCost = activeRec.reduce(function(s,r){return s+r.amount;}, 0);
  
  // Weekly due calculation
  var weeklyDueCount = 0;
  var monthlyDueCount = 0;
  var overdueCount = 0;
  var lifetimeCount = 0;
  var nextUpcomingBillName = "--";
  var nextMinDays = 999999;

  for (var i = 0; i < allRec.length; i++) {
    var r = allRec[i];
    if (r.months === 'Lifetime') lifetimeCount++;
    if (r.status !== 'Active') continue;

    var billDate = r.startMonth + '-' + String(r.dueDay).padStart(2, '0');
    var diff = daysUntil(billDate);
    if (diff !== null) {
      if (diff < 0) overdueCount++;
      if (diff >= 0 && diff <= 7) weeklyDueCount++;

function buildRecurringTableRows(list) {
  if (!list.length) return '<tr><td colspan="9"><div class="empty-state">No matching recurring bills configured.</div></td></tr>';
  var html = '';

    var r = list[i];
    
    // Priority badge (Smart Bill Priority System)
    var pBadge = '<span class="badge badge-gray">P' + r.priority + '</span>';
    if (r.priority === 1) pBadge = '<span class="badge badge-red">P1 (Utility)</span>';
    else if (r.priority === 2) pBadge = '<span class="badge badge-yellow">P2 (School/Obl)</span>';
    else if (r.priority === 3) pBadge = '<span class="badge badge-blue">P3 (Credit)</span>';
    else if (r.priority === 4) pBadge = '<span class="badge badge-purple">P4 (Savings)</span>';

    // Status Display
    var stCls = 'badge-blue';
    if (r.status === 'Active') stCls = 'badge-green';
    if (r.status === 'Paused') stCls = 'badge-gray';
    if (r.status === 'Paid') stCls = 'badge-purple';
    
    var statusBadge = '<span class="badge ' + stCls + '" style="cursor:pointer" onclick="toggleRecurringStatus(\'' + r.id + '\')">' + r.status + '</span>';

    var displayDue = '--';
    if (r.startMonth && r.dueDay) {
      displayDue = fmtDate(r.startMonth + '-' + String(r.dueDay).padStart(2, '0'));
    }

    var payActionBtn = r.status === 'Active' 
      ? '<button class="action-btn pay" onclick="payRecurringBill(\'' + r.id + '\')" title="Mark as Paid"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></button>'
      : '';

    html += '<tr>'
      + '<td>' + pBadge + '</td>'

      + '<td>' + acctName(r.account) + '</td>'
      + '<td style="font-weight:800;color:var(--danger)">' + fmt(r.amount) + '</td>'
      + '<td><span class="tag">' + displayDue + '</span></td>'
      + '<td><span class="badge badge-blue">' + (typeof r.months === 'number' ? r.months + ' cycles' : r.months) + '</span></td>'
      + '<td><span class="badge badge-gray">' + (r.category||'--') + '</span></td>'
      + '<td>' + statusBadge + '</td>'

function filterRecurring() {
  var q = (document.getElementById('rec-search').value || '').toLowerCase();
  var list = db.recurring.filter(function(r) {
    return (r.name||'').toLowerCase().indexOf(q) >= 0 || acctName(r.account).toLowerCase().indexOf(q) >= 0 || (r.category||'').toLowerCase().indexOf(q) >= 0;
  });
  
  // Sort by priority first (Smart Bill Priority System)
  list.sort(function(a, b) {
    return (a.priority || 4) - (b.priority || 4);
  });
  
  document.getElementById('rec-tbody').innerHTML = buildRecurringTableRows(list);
}

// PAID TRIGGER CYCLE LOGIC (Requirement: Recurring Bill Status System)
function payRecurringBill(id) {
  var r = db.recurring.find(function(item){ return item.id === id; });
  if (!r) return;

  var a = getAccount(r.account);
  if (!a) {
    toast('No valid account linked to this bill.', 'error');
    return;
  }

  // Account Balance Validation (Except Credit Card types / loans)
  if (a.type !== 'credit' && a.type !== 'loan' && (a.balance - r.amount) < 0) {
    toast('Payment Blocked: Insufficient funds in ' + a.name + '.', 'error');
    return;
  }

  // Create In-Ledger Payment transaction
  var dateStr = r.startMonth + '-' + String(r.dueDay).padStart(2, '0');
  var generatedTx = {
    id: genId(),
    date: dateStr,
    desc: 'Paid scheduled bill: ' + r.name,
    amount: r.amount,
    type: 'expense',
    fromAccount: r.account,
    category: r.category || 'Utilities',
    notes: 'Auto-processed monthly installment cycle.'
  };

  db.transactions.push(generatedTx);

  // Sync balances immediately (Smart Account Balance & Smart Credit Card rules)
  if (a.type === 'credit' || a.type === 'loan') {
    if (r.name.indexOf('Credit Card') >= 0 || r.name.indexOf('Credit Payment') >= 0 || r.category === 'Credit Card') {
      var matchedCC = db.accounts.find(function(acc) {
        return acc.type === 'credit' && (r.name.indexOf(acc.name) >= 0 || r.account === acc.id);
      });
      if (matchedCC) {
        matchedCC.balance = Math.max(0, matchedCC.balance - r.amount); // Payment reduces Owed!
      }
    } else {
      a.balance += r.amount; // Card charge increases debt balance
    }
  } else {
    a.balance -= r.amount; // Cash decreases
  }

  // Increment Paid monthly statistics insights
  db.paidThisMonthCount = (db.paidThisMonthCount || 0) + 1;
  db.paidThisMonthAmount = (db.paidThisMonthAmount || 0) + r.amount;

  // Handle Savings Goal specific contribution syncing
  if ((r.type === 'Savings Goal' || r.category === 'Savings Goal') && db.savingsGoal) {
    db.savingsGoal.current = Math.min(db.savingsGoal.target, db.savingsGoal.current + r.amount);
  }

  // Cycle date calculation: Move forward precisely 1 month
  var currentYr = parseInt(r.startMonth.split('-')[0]);
  var currentMo = parseInt(r.startMonth.split('-')[1]);
  currentMo++;
  if (currentMo > 12) {
    currentMo = 1;
    currentYr++;
  }
  var nextMonthStr = String(currentYr) + '-' + String(currentMo).padStart(2, '0');

  r.startMonth = nextMonthStr;
  
  if (typeof r.months === 'number') {
    r.months = Math.max(0, r.months - 1);
    if (r.months <= 0) {
      r.status = 'Paid'; // Deactivate completely
    } else {
      r.status = 'Active'; // Reset to active cycle
    }
  } else {
    r.status = 'Active'; // Lifetime Utility always resets to Active
  }

  saveDB();
  toast('✓ ' + r.name + ' paid! Next billing occurrence created successfully.', 'success');
  nav(currentPage);
}

function toggleRecurringStatus(id) {
  var r = db.recurring.find(function(item){ return item.id === id; });
  if (r) {
    if (r.status === 'Active') r.status = 'Paused';
    else if (r.status === 'Paused') r.status = 'Active';
    else if (r.status === 'Paid') r.status = 'Active';
    saveDB();
    filterRecurring();
  }
}

// FUTURE BALANCE FORECAST
function renderCashFlow(c) {
  var cash = totalCash();
  var activeRec = db.recurring.filter(function(r){return r.status === 'Active';});
  var upcomingBillsTotal = activeRec.reduce(function(s,r){return s+r.amount;}, 0);

  var monthlyPayInflow = db.payday && db.payday.status === 'Active' ? (db.payday.amount * 4) : 0;
  
  var sim30_income = monthlyPayInflow;
  var sim30_bills = upcomingBillsTotal;
  var bal30 = cash + sim30_income - sim30_bills;

  var sim60_income = monthlyPayInflow * 2;
  var sim60_bills = upcomingBillsTotal * 2;
  var bal60 = cash + sim60_income - sim60_bills;

  var sim90_income = monthlyPayInflow * 3;
  var sim90_bills = upcomingBillsTotal * 3;
  var bal90 = cash + sim90_income - sim90_bills;

  var phases = [
    {label:'30-Day Future Balance', note:'Expected paydays (+' + fmt(sim30_income) + ') minus active bills (-' + fmt(sim30_bills) + ')', val:bal30},
    {label:'60-Day Future Balance', note:'Two-month projection (Income: +' + fmt(sim60_income) + ', Bills: -' + fmt(sim60_bills) + ')', val:bal60},
    {label:'90-Day Future Balance', note:'Quarterly projection (Income: +' + fmt(sim90_income) + ', Bills: -' + fmt(sim90_bills) + ')', val:bal90}
  ];

  var phaseHtml = '';
  for (var i = 0; i < phases.length; i++) {
    var p = phases[i];
    var border = i > 0 ? 'border-top:1px solid rgba(29, 51, 104, 0.4);' : '';
    phaseHtml += '<div style="display:flex;align-items:center;gap:16px;padding:16px 0;' + border + '">'
      + '<div style="width:36px;height:36px;border-radius:50%;background:var(--surface2);border:2px solid ' + (p.val < 0 ? 'var(--danger)' : 'var(--accent)') + ';display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:' + (p.val < 0 ? 'var(--danger)' : '#60a5fa') + ';flex-shrink:0">' + (i+1) + '</div>'
      + '<div style="flex:1"><div style="font-weight:700;font-size:14px">' + p.label + '</div><div style="font-size:11px;color:var(--text3)">' + p.note + '</div></div>'
      + '<div style="font-size:18px;font-weight:800;color:' + (p.val < 0 ? 'var(--danger)' : 'var(--success)') + '">' + fmt(p.val) + '</div>'
      + '</div>';
  }

  c.innerHTML = '<div class="section-block" style="margin-bottom:16px">'
    + '<div class="section-title" style="margin-bottom:16px"><span>Smart Future Balance Projection & Forecast</span></div>'
    + '<div style="margin-bottom:16px; font-size:13px; color:var(--text2)">Starting Base Cash: <strong>' + fmt(cash) + '</strong></div>'
    + phaseHtml + '</div>';

function handleInstitutionInput(el) {
  var q = el.value.toLowerCase();
  var box = document.getElementById('inst-suggestion-box');
  if (!box) return;
  if (!q) {
    box.style.display = 'none';
    return;
  }

  var matches = [];
  var allGroups = Object.keys(PH_FIN_INSTITUTIONS);
  for (var k = 0; k < allGroups.length; k++) {
    var group = allGroups[k];
    var items = PH_FIN_INSTITUTIONS[group];
    for (var j = 0; j < items.length; j++) {
      if (items[j].toLowerCase().indexOf(q) >= 0) {
        matches.push({ name: items[j], group: group });

  }

  if (matches.length === 0) {
    box.style.display = 'none';
    return;

  var html = '';

  for (var i = 0; i < displayCount; i++) {
    html += '<div class="inst-suggestion-item" onclick="selectInstitutionSuggestion(\'' + matches[i].name.replace(/'/g, "\\'") + '\', \'' + matches[i].group + '\')">'
      + matches[i].name + ' <span style="font-size:9px;color:var(--text3);margin-left:6px">(' + matches[i].group + ')</span>'
      + '</div>';

  box.innerHTML = html;
  box.style.display = 'block';

function saveTx(id) {
  var desc = document.getElementById('tx-desc').value.trim();
  var amount = parseFloat(document.getElementById('tx-amount').value);
  var date = document.getElementById('tx-date').value;
  var type = document.getElementById('tx-type').value;
  var cat = document.getElementById('tx-cat').value;
  var from = document.getElementById('tx-from').value;
  var to = document.getElementById('tx-to') ? document.getElementById('tx-to').value : '';
  var notes = document.getElementById('tx-notes').value;

  if (!desc || isNaN(amount) || amount<=0 || !date) { toast('Please complete all required fields correctly.', 'error'); return; }

  // Overdraft Guard check
  var fa = getAccount(from);
  if (type === 'expense' || type === 'transfer') {
    if (fa && fa.type !== 'credit' && fa.type !== 'loan' && (fa.balance - amount) < 0) {
      toast('Overdraft Guard: Account ' + fa.name + ' does not have sufficient balance.', 'error');
      return;
    }
  }

  if (id) {
    var oldTx = db.transactions.find(function(x){return x.id === id;});
    if (oldTx) {
      revertLedgerBalanceEffect(oldTx);
    }
  }

  var obj = {desc:desc, amount:amount, date:date, type:type, category:cat, notes:notes, fromAccount:from||null, toAccount:to||null};
  
  if (id) {
    var idx = db.transactions.findIndex(function(x){return x.id === id;});
    if (idx >= 0) db.transactions[idx] = Object.assign({}, db.transactions[idx], obj);
    applyLedgerBalanceEffect(obj);
    toast('Transaction recorded & balances synchronized.');
  } else {
    obj.id = genId();
    db.transactions.push(obj);
    applyLedgerBalanceEffect(obj);
    toast('Transaction registered.');
  }

  saveDB(); 
  closeModal(); 
  nav('transactions');
}

function applyLedgerBalanceEffect(tx) {
  var fa = getAccount(tx.fromAccount);
  var ta = getAccount(tx.toAccount);

  if (tx.type === 'expense') {
    if (fa) {
      if (fa.type === 'credit' || fa.type === 'loan') fa.balance += tx.amount;
      else fa.balance = Math.max(0, fa.balance - tx.amount);
    }
  } else if (tx.type === 'income') {
    if (fa) {
      if (fa.type === 'credit' || fa.type === 'loan') fa.balance = Math.max(0, fa.balance - tx.amount);
      else fa.balance += tx.amount;
    }
  } else if (tx.type === 'transfer') {
    if (fa) {
      if (fa.type === 'credit' || fa.type === 'loan') fa.balance += tx.amount;
      else fa.balance = Math.max(0, fa.balance - tx.amount);
    }
    if (ta) {
      if (ta.type === 'credit' || ta.type === 'loan') ta.balance = Math.max(0, ta.balance - tx.amount);
      else ta.balance += tx.amount;
    }
  }
}

function revertLedgerBalanceEffect(tx) {
  var fa = getAccount(tx.fromAccount);
  var ta = getAccount(tx.toAccount);

  if (tx.type === 'expense') {
    if (fa) {
      if (fa.type === 'credit' || fa.type === 'loan') fa.balance = Math.max(0, fa.balance - tx.amount);
      else fa.balance += tx.amount;
    }
  } else if (tx.type === 'income') {
    if (fa) {
      if (fa.type === 'credit' || fa.type === 'loan') fa.balance += tx.amount;
      else fa.balance = Math.max(0, fa.balance - tx.amount);
    }
  } else if (tx.type === 'transfer') {
    if (fa) {
      if (fa.type === 'credit' || fa.type === 'loan') fa.balance = Math.max(0, fa.balance - tx.amount);
      else fa.balance += tx.amount;
    }
    if (ta) {
      if (ta.type === 'credit' || ta.type === 'loan') ta.balance += tx.amount;
      else ta.balance = Math.max(0, ta.balance - tx.amount);
    }
  }
}

function deleteTx(id) {
  if (!confirm('Are you sure you want to delete this ledger record?')) return;
  var tx = db.transactions.find(function(t){return t.id===id;});
  if (tx) {
    revertLedgerBalanceEffect(tx);
    db.transactions = db.transactions.filter(function(t){return t.id!==id;});
    saveDB(); 
    toast('Transaction log deleted.'); 
    nav('transactions');
  }
}

function showTransferModal() {
  document.getElementById('modal-title').textContent = 'Internal Transfer Funds';

    + '<div class="form-group"><label>Transfer Amount (PHP)</label><input type="number" id="tr-amount" min="0" placeholder="0.00"></div>'

function executeTransfer() {
  var amount = parseFloat(document.getElementById('tr-amount').value);
  var date = document.getElementById('tr-date').value;
  var from = document.getElementById('tr-from').value;
  var to = document.getElementById('tr-to').value;
  var notes = document.getElementById('tr-notes').value || 'Internal wallet transfer';

  if (isNaN(amount) || amount <= 0 || !from || !to) {
    toast('Please fill in all details correctly.', 'error');
    return;
  }
  if (from === to) {
    toast('Source and destination accounts must be different.', 'error');
    return;
  }

  var fa = getAccount(from);
  if (fa && fa.type !== 'credit' && fa.type !== 'loan' && (fa.balance - amount) < 0) {
    toast('Transfer Blocked: Insufficient funds in ' + fa.name, 'error');
    return;
  }

  var tx = {
    id: genId(),
    date: date,
    desc: 'Transfer from ' + acctName(from) + ' to ' + acctName(to),
    amount: amount,
    type: 'transfer',
    fromAccount: from,
    toAccount: to,
    category: 'Transfer',
    notes: notes
  };

  db.transactions.push(tx);
  applyLedgerBalanceEffect(tx);
  saveDB();
  toast('Transfer executed & balances synchronized.', 'success');
  closeModal();
  nav(currentPage);
}

// PORTABILITY PACKS
function exportData() {
  var backup = JSON.stringify(db, null, 2);
  var blob = new Blob([backup], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'FlowTrack_Backup_06-13-2026.json';
  a.click();
  toast('Data exported successfully!');
}

function triggerImport() {
  document.getElementById('import-file-input').click();
}

function handleImport(evt) {
  var files = evt.target.files;
  if (!files || files.length === 0) return;
  
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var importedJson = JSON.parse(e.target.result);
      if (importedJson && Array.isArray(importedJson.accounts) && Array.isArray(importedJson.transactions)) {
        if (confirm('Import verified backup? This will overwrite your current app state entirely.')) {
          db = importedJson;
          saveDB();
          autoProcessPaydays();
          toast('Backup restored successfully!', 'success');
          nav(currentPage);
        }
      } else {
        toast('Failed: Invalid backup JSON structure.', 'error');
      }
    } catch(err) {
      toast('Failed to read backup file.', 'error');
    }
  };
  reader.readAsText(files[0]);
  evt.target.value = '';
}

function executeSystemReset() {
  var verifyInput = document.getElementById('reset-verify-input');
  if (verifyInput && verifyInput.value === 'DELETE') {

    toast('All data cleared. System reset successful.');

}
