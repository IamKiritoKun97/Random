
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Vertial Image</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: rgba(30, 30, 30, 0.95);
            --accent: #3b82f6;
        }
        body { 
            background-color: var(--bg-dark); 
            color: white; 
            font-family: 'Inter', system-ui, sans-serif; 
            overflow: hidden; 
            height: 100vh; 
            margin: 0;
        }
        .viewport-container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100vw; 
            height: 100vh; 
            overflow: auto; 
            cursor: grab;
            padding: 40px;
        }
        .viewport-container:active { cursor: grabbing; }
        
        #viewer-canvas, #image-element { 
            transform-origin: center; 
            transition: transform 0.1s ease-out; 
            max-width: none; 
        }

        .toolbar { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--panel-bg); 
            backdrop-filter: blur(12px); 
            border: 1px solid #444; 
            border-radius: 12px; 
            padding: 8px; 
            display: flex; 
            gap: 4px; 
            z-index: 1000; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }

        .btn { 
            background: #333; 
            color: #ccc; 
            border: none; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 500;
            transition: all 0.2s; 
        }
        .btn:hover { background: #444; color: white; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: #7f1d1d; color: #fecaca; }
        .btn-danger:hover { background: #991b1b; }

        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }

        #pdf-viewer { width: 100%; height: 100%; border: none; background: white; }
        .hidden { display: none !important; }
        .drop-zone-active { border-color: var(--accent) !important; background: rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body>

    <div id="drop-zone" class="fixed inset-0 flex flex-col items-center justify-center bg-zinc-900 border-2 border-dashed border-zinc-700 m-4 rounded-xl transition-all">
        <h1 class="text-3xl font-bold mb-4">Pro Viewer</h1>
        <p class="text-zinc-400 mb-8">Drop your image or PDF file here, or click to upload</p>
        <button onclick="document.getElementById('file-input').click()" class="btn btn-primary px-8 py-3 text-lg">Select File</button>
        <input type="file" id="file-input" class="hidden" accept="image/*,application/pdf">
    </div>

    <div id="main-view" class="hidden">
        <button class="btn btn-danger close-btn" onclick="closeFile()" title="Close File">✕</button>
        
        <div id="viewport" class="viewport-container">
            <img id="image-element" class="hidden" alt="View">
            <iframe id="pdf-viewer" class="hidden" title="PDF Viewer"></iframe>
        </div>

        <div class="toolbar" id="toolbar">
            <div id="image-tools" class="flex gap-1 hidden">
                <button class="btn" onclick="rotate(-90)" title="Rotate Left">↺</button>
                <button class="btn" onclick="rotate(90)" title="Rotate Right">↻</button>
                <button class="btn" onclick="flip('x')" title="Flip Horizontal">↔</button>
                <button class="btn" onclick="flip('y')" title="Flip Vertical">↕</button>
                <button class="btn" onclick="zoom(0.1)" title="Zoom In">+</button>
                <button class="btn" onclick="zoom(-0.1)" title="Zoom Out">-</button>
                <button class="btn" onclick="fitToScreen()" title="Fit to Screen">Fit</button>
                <button class="btn" onclick="resetView()" title="Actual Size/Reset">100%</button>
                <div class="w-px bg-zinc-600 mx-2"></div>
            </div>
            
            <button class="btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
            <button class="btn" onclick="downloadOriginal()" title="Download Original">Download Original</button>
            <button id="btn-edit" class="btn btn-primary hidden" onclick="downloadEdited()" title="Download Edited">Download Update</button>
        </div>
    </div>

    <script>
        let currentFile = null;
        let currentUrl = null;
        let fileType = null;
        
        // View state
        let rotation = 0;
        let scaleX = 1;
        let scaleY = 1;
        let zoomLevel = 1;
        let isModified = false;

        const dropZone = document.getElementById('drop-zone');
        const mainView = document.getElementById('main-view');
        const imgEl = document.getElementById('image-element');
        const pdfEl = document.getElementById('pdf-viewer');
        const btnEdit = document.getElementById('btn-edit');
        const imageTools = document.getElementById('image-tools');

        // Event listeners
        document.getElementById('file-input').addEventListener('change', (e) => handleFile(e.target.files[0]));
        
        window.addEventListener('paste', (e) => {
            const item = e.clipboardData.items[0];
            if (item && item.kind === 'file') handleFile(item.getAsFile());
        });

        // Drag & Drop handlers
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (evt === 'dragover' || evt === 'dragenter') dropZone.classList.add('drop-zone-active');
                else dropZone.classList.remove('drop-zone-active');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;
            closeFile(); // Cleanup first
            
            currentFile = file;
            currentUrl = URL.createObjectURL(file);
            fileType = file.type.startsWith('image') ? 'image' : 'pdf';

            dropZone.classList.add('hidden');
            mainView.classList.remove('hidden');

            if (fileType === 'image') {
                imgEl.src = currentUrl;
                imgEl.classList.remove('hidden');
                imageTools.classList.remove('hidden');
            } else {
                pdfEl.src = currentUrl;
                pdfEl.classList.remove('hidden');
                imageTools.classList.add('hidden');
            }
            resetView();
        }

        function closeFile() {
            if (currentUrl) URL.revokeObjectURL(currentUrl);
            currentFile = null;
            currentUrl = null;
            
            imgEl.src = '';
            pdfEl.src = '';
            
            imgEl.classList.add('hidden');
            pdfEl.classList.add('hidden');
            mainView.classList.add('hidden');
            dropZone.classList.remove('hidden');
            
            resetView();
        }

        function resetView() {
            rotation = 0;
            scaleX = 1;
            scaleY = 1;
            zoomLevel = 1;
            isModified = false;
            updateTransform();
        }

        function updateTransform() {
            if (fileType === 'image') {
                imgEl.style.transform = `rotate(${rotation}deg) scaleX(${scaleX}) scaleY(${scaleY}) scale(${zoomLevel})`;
                btnEdit.classList.toggle('hidden', !isModified);
            }
        }

        function rotate(deg) {
            rotation = (rotation + deg) % 360;
            isModified = true;
            updateTransform();
        }

        function flip(axis) {
            if (axis === 'x') scaleX *= -1;
            if (axis === 'y') scaleY *= -1;
            isModified = true;
            updateTransform();
        }

        function zoom(delta) {
            zoomLevel = Math.max(0.1, zoomLevel + delta);
            updateTransform();
        }

        function fitToScreen() {
            // Simple fit logic
            const container = document.getElementById('viewport');
            const ratio = Math.min((container.clientWidth - 40) / imgEl.naturalWidth, (container.clientHeight - 40) / imgEl.naturalHeight);
            zoomLevel = ratio;
            updateTransform();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function downloadOriginal() {
            if (!currentFile) return;
            const a = document.createElement('a');
            a.href = currentUrl;
            a.download = currentFile.name;
            a.click();
        }

        function downloadEdited() {
            if (fileType !== 'image') return;
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = imgEl.src;

            img.onload = () => {
                const isSwapped = (Math.abs(rotation) === 90 || Math.abs(rotation) === 270);
                canvas.width = isSwapped ? img.naturalHeight : img.naturalWidth;
                canvas.height = isSwapped ? img.naturalWidth : img.naturalHeight;

                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(rotation * Math.PI / 180);
                ctx.scale(scaleX, scaleY);
                ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
                ctx.restore();

                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `edited_${currentFile.name}`;
                    a.click();
                    URL.revokeObjectURL(url);
                }, currentFile.type, 1.0);
            };
        }
    </script>
</body>
</html>
