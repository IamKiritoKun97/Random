
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toolbox · Premium Utility</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='4' width='16' height='20' rx='3' ry='3' fill='none' stroke='%23E30613' stroke-width='2.5'/%3E%3Crect x='4' y='8' width='16' height='20' rx='3' ry='3' fill='%23E30613' opacity='0.85'/%3E%3Cline x1='8' y1='14' x2='16' y2='14' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='8' y1='18' x2='14' y2='18' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --red: #E30613;
      --red-dim: rgba(227, 6, 19, 0.15);
      --red-glow: rgba(227, 6, 19, 0.4);
      --glass-bg: rgba(10, 10, 15, 0.4);
      --glass-bg-hover: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-strong: rgba(255, 255, 255, 0.18);
      --blur: blur(20px) saturate(160%);
      --text-primary: rgba(255,255,255,0.92);
      --text-muted: rgba(255,255,255,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #020204;
      font-family: 'DM Sans', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background ── */
    #bg-container {
      position: fixed; inset: 0; z-index: -1;
      overflow: hidden;
    }
    #bg-image {
      position: absolute; inset: 0;
      background-image: url('https://images.unsplash.com/photo-1776798973362-c985f57c08e5?w=1200&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDN8NnNNVmpUTFNrZVF8fGVufDB8fHx8fA%3D%3D');
      background-size: cover;
      background-position: center;
      filter: brightness(0.4) contrast(1.1);
      transform: scale(1.02);
    }
    #bg-overlay {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% -20%, rgba(227,6,19,0.08) 0%, transparent 60%),
                  linear-gradient(to bottom, transparent 0%, rgba(2,2,4,0.6) 100%);
    }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Navbar ── */
    nav {
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      background: rgba(0,0,0,0.4);
      border-bottom: 1px solid var(--glass-border);
      padding: 0 1.25rem;
      height: 68px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .logo-container { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: var(--red);
      border-radius: 8px;
      box-shadow: 0 0 15px var(--red-glow);
    }
    .badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      color: #fff;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* ── UI Elements ── */
    .btn-glass {
      backdrop-filter: var(--blur);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      border-radius: 12px;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      display: flex; align-items: center; gap: 0.5rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .btn-glass:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-strong);
      transform: translateY(-1px);
    }
    .btn-red {
      background: rgba(227, 6, 19, 0.2);
      border-color: rgba(227, 6, 19, 0.4);
      color: #fff;
    }
    .btn-red:hover {
      background: rgba(227, 6, 19, 0.35);
      border-color: rgba(227, 6, 19, 0.6);
      box-shadow: 0 4px 20px var(--red-glow);
    }

    /* ── Search ── */
    .search-box {
      position: relative;
      margin: 1.5rem 0;
    }
    .search-box input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      backdrop-filter: var(--blur);
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: rgba(227,6,19,0.4);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 0 4px rgba(227,6,19,0.05);
    }
    .search-icon {
      position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ── Grid ── */
    main {
      flex: 1; padding: 0 1.25rem 5rem;
      max-width: 1200px; margin: 0 auto; width: 100%;
    }
    .grid-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 1rem; padding: 0 0.25rem;
    }
    .label-caps {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--text-muted);
    }
    #card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    /* ── Card ── */
    .card {
      backdrop-filter: var(--blur);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-top-color: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 1.25rem;
      cursor: pointer;
      position: relative;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 120px;
      animation: slideUp 0.4s ease-out both;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .card:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-strong);
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    .card:active { transform: scale(0.96); }

    .card-title {
      font-size: 1rem; font-weight: 500; line-height: 1.3;
      margin-bottom: 0.5rem; color: #fff;
    }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: auto;
    }
    .card-hint {
      font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-actions {
      display: flex; gap: 0.4rem; opacity: 0; transform: translateY(5px);
      transition: all 0.2s ease;
    }
    .card:hover .card-actions { opacity: 1; transform: translateY(0); }
    
    .mini-btn {
      width: 28px; height: 28px; border-radius: 8px;
      background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
      color: var(--text-muted); display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .mini-btn:hover { background: #fff; color: #000; border-color: #fff; }
    .mini-btn.del:hover { background: var(--red); color: #fff; border-color: var(--red); }

    /* ── Modals ── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-backdrop.active { opacity: 1; pointer-events: all; }
    .modal-content {
      background: #0f0f12; border: 1px solid var(--glass-border-strong);
      border-radius: 24px; padding: 2rem; width: 100%; max-width: 420px;
      transform: scale(0.9) translateY(20px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 40px 100px rgba(0,0,0,0.7);
    }
    .modal-backdrop.active .modal-content { transform: scale(1) translateY(0); }

    .input-group { margin-bottom: 1.25rem; }
    .input-group label {
      display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 0.5rem;
    }
    .input-group input, .input-group textarea {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 0.75rem; color: #fff; outline: none;
      transition: border-color 0.2s; font-family: inherit;
    }
    .input-group input:focus { border-color: var(--red); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
      z-index: 300; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #toast.visible { transform: translateX(-50%) translateY(0); }
    .toast-body {
      background: #fff; color: #000; padding: 0.6rem 1.2rem; border-radius: 50px;
      font-weight: 600; font-size: 0.85rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 0.5rem;
    }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      nav { height: 60px; }
      #card-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      .card { padding: 1rem; min-height: 100px; }
      .card-title { font-size: 0.9rem; }
      .modal-content { padding: 1.5rem; }
    }
  </style>
</head>
<body>

<div id="bg-container">
  <div id="bg-image"></div>
  <div id="bg-overlay"></div>
</div>

<div id="app">
  <!-- Top Bar -->
  <nav>
    <div class="logo-container">
      <div class="logo-icon">
        <i data-lucide="layers" style="width:18px;height:18px;color:white;"></i>
      </div>
      <div class="badge">Toolbox</div>
    </div>
    <div class="flex gap-2">
      <button class="btn-glass" id="btn-import" title="Import Data">
        <i data-lucide="upload-cloud" class="w-4 h-4"></i>
        <span class="hidden md:inline">Import</span>
      </button>
      <button class="btn-glass btn-red" id="btn-add">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>New</span>
      </button>
    </div>
  </nav>

  <main>
    <!-- Search Area -->
    <div class="search-box">
      <i data-lucide="search" class="search-icon w-5 h-5"></i>
      <input type="text" id="search-input" placeholder="Quick find items..." spellcheck="false" />
    </div>

    <!-- Stats/Header -->
    <div class="grid-header">
      <div class="label-caps" id="item-count">0 ITEMS TOTAL</div>
      <button class="btn-glass" id="btn-export" style="padding: 0.3rem 0.6rem; font-size: 0.6rem;">
        <i data-lucide="download" class="w-3 h-3"></i> EXPORT JSON
      </button>
    </div>

    <!-- Items Grid -->
    <div id="card-grid">
      <!-- Cards injected here -->
    </div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal-content">
    <div class="flex justify-between items-center mb-6">
      <h2 class="badge text-xl" id="modal-title">NEW ITEM</h2>
      <button class="text-white/40 hover:text-white" onclick="closeModal()">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>
    
    <div class="input-group">
      <label>Display Title</label>
      <input type="text" id="in-title" placeholder="e.g. Support Email" maxlength="40" />
    </div>

    <div class="input-group">
      <label>Value to Copy</label>
      <textarea id="in-content" rows="3" placeholder="Paste link or text here..."></textarea>
    </div>

    <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl mb-6">
      <div class="text-xs text-white/60">
        <div class="font-bold text-white">Copy content on tap</div>
        If disabled, it copies the title instead.
      </div>
      <input type="checkbox" id="in-toggle" class="accent-red-600 w-5 h-5 cursor-pointer" checked />
    </div>

    <div class="flex gap-3">
      <button class="flex-1 btn-glass justify-center" onclick="closeModal()">Cancel</button>
      <button class="flex-1 btn-glass btn-red justify-center py-3" id="btn-save">Save Item</button>
    </div>
  </div>
</div>

<!-- Delete Confirmation -->
<div class="modal-backdrop" id="delete-backdrop">
  <div class="modal-content max-w-sm text-center">
    <div class="bg-red-600/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
      <i data-lucide="trash-2" class="text-red-500 w-8 h-8"></i>
    </div>
    <h2 class="text-xl font-bold mb-2">Delete Item?</h2>
    <p class="text-white/50 text-sm mb-6">This cannot be undone from your local storage.</p>
    <div class="flex gap-3">
      <button class="flex-1 btn-glass justify-center" onclick="closeDelete()">Back</button>
      <button class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl" id="btn-confirm-delete">Delete</button>
    </div>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast">
  <div class="toast-body">
    <i data-lucide="check" class="w-4 h-4"></i>
    <span id="toast-text">Copied!</span>
  </div>
</div>

<input type="file" id="file-input" class="hidden" accept=".json" />

<script>
  // Initialize Icons
  lucide.createIcons();

  // ── State Management ───────────────────────────────────────
  const STORE_KEY = 'easybet_v3_store';
  let items = JSON.parse(localStorage.getItem(STORE_KEY)) || [];
  let currentEditId = null;
  let currentDeleteId = null;
  let searchTerm = '';

  const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(items));
  
  // ── Render Logic ───────────────────────────────────────────
  function render() {
    const grid = document.getElementById('card-grid');
    const filtered = items.filter(i => 
      i.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
      (i.content || '').toLowerCase().includes(searchTerm.toLowerCase())
    );

    document.getElementById('item-count').textContent = `${filtered.length} ITEMS TOTAL`;
    grid.innerHTML = '';

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="col-span-full py-20 text-center opacity-30">
          <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3"></i>
          <p>${searchTerm ? 'No matches found' : 'Toolbox is empty'}</p>
        </div>
      `;
      lucide.createIcons();
      return;
    }

    filtered.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = `${idx * 0.05}s`;
      
      card.innerHTML = `
        <div class="card-title">${escape(item.title)}</div>
        <div class="card-footer">
          <span class="card-hint">${item.copyContent ? 'Content' : 'Title'}</span>
          <div class="card-actions">
            <button class="mini-btn" onclick="openEdit('${item.id}', event)"><i data-lucide="edit-3" class="w-3 h-3"></i></button>
            <button class="mini-btn del" onclick="confirmDelete('${item.id}', event)"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
          </div>
        </div>
      `;

      card.onclick = () => copyToClipboard(item);
      grid.appendChild(card);
    });

    lucide.createIcons();
  }

  // ── Actions ────────────────────────────────────────────────
  async function copyToClipboard(item) {
    const text = item.copyContent && item.content ? item.content : item.title;
    try {
      await navigator.clipboard.writeText(text);
      showToast(`Copied ${item.copyContent ? 'Content' : 'Title'}`);
    } catch {
      // Fallback
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      showToast(`Copied!`);
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-text').innerText = msg;
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 2000);
  }

  // ── Modal Handlers ─────────────────────────────────────────
  const openAdd = () => {
    currentEditId = null;
    document.getElementById('modal-title').innerText = "NEW ITEM";
    document.getElementById('in-title').value = '';
    document.getElementById('in-content').value = '';
    document.getElementById('in-toggle').checked = true;
    document.getElementById('modal-backdrop').classList.add('active');
  };

  const openEdit = (id, e) => {
    e.stopPropagation();
    const item = items.find(i => i.id === id);
    currentEditId = id;
    document.getElementById('modal-title').innerText = "EDIT ITEM";
    document.getElementById('in-title').value = item.title;
    document.getElementById('in-content').value = item.content || '';
    document.getElementById('in-toggle').checked = item.copyContent;
    document.getElementById('modal-backdrop').classList.add('active');
  };

  const closeModal = () => document.getElementById('modal-backdrop').classList.remove('active');

  const saveItem = () => {
    const title = document.getElementById('in-title').value.trim();
    if (!title) return;

    const newItem = {
      id: currentEditId || Date.now().toString(),
      title,
      content: document.getElementById('in-content').value.trim(),
      copyContent: document.getElementById('in-toggle').checked
    };

    if (currentEditId) {
      items = items.map(i => i.id === currentEditId ? newItem : i);
    } else {
      items.unshift(newItem);
    }

    save(); render(); closeModal();
  };

  const confirmDelete = (id, e) => {
    e.stopPropagation();
    currentDeleteId = id;
    document.getElementById('delete-backdrop').classList.add('active');
  };

  const closeDelete = () => document.getElementById('delete-backdrop').classList.remove('active');

  const executeDelete = () => {
    items = items.filter(i => i.id !== currentDeleteId);
    save(); render(); closeDelete();
    showToast('Deleted');
  };

  // ── IO ─────────────────────────────────────────────────────
  const exportData = () => {
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `toolbox-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data)) {
          items = [...data, ...items].filter((v, i, a) => a.findIndex(t => t.id === v.id) === i);
          save(); render();
          showToast('Import Success');
        }
      } catch { showToast('Invalid File'); }
    };
    reader.readAsText(file);
  };

  // ── Utils ──────────────────────────────────────────────────
  const escape = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // ── Listeners ──────────────────────────────────────────────
  document.getElementById('btn-add').onclick = openAdd;
  document.getElementById('btn-save').onclick = saveItem;
  document.getElementById('btn-confirm-delete').onclick = executeDelete;
  document.getElementById('btn-export').onclick = exportData;
  document.getElementById('btn-import').onclick = () => document.getElementById('file-input').click();
  document.getElementById('file-input').onchange = importData;
  document.getElementById('search-input').oninput = (e) => {
    searchTerm = e.target.value;
    render();
  };

  // Global Esc key
  window.onkeydown = (e) => {
    if (e.key === 'Escape') { closeModal(); closeDelete(); }
  };

  // Initial Load
  render();
</script>
</body>
</html>
