
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Password Reset</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M12 20h40v24a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V20z' fill='%2338bdf8' opacity='.1'/%3E%3Cpath d='M12 20h40l-20 15L12 20z' fill='%2338bdf8' opacity='.85'/%3E%3Crect x='12' y='20' width='40' height='28' rx='3' fill='none' stroke='%2338bdf8' stroke-width='2.2' opacity='.6'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
/* ════════════════════════════════════════
   DESIGN TOKENS
════════════════════════════════════════ */
:root {
  --f:       'Outfit', system-ui, sans-serif;
  --fm:      'JetBrains Mono', monospace;

  --bg:         #07090f;
  --bg-p:       #0d1117;
  --bg-s:       rgba(17, 24, 39, 0.9);
  --bg-i:       rgba(30, 41, 59, 0.55);
  --bg-h:       rgba(56, 189, 248, 0.055);

  --b:          rgba(255,255,255,0.065);
  --bhi:        rgba(56,189,248,0.28);
  --glow:       rgba(56,189,248,0.14);

  --t1:   #f1f5f9;
  --t2:   #8b9ab0;
  --t3:   #3f4d62;

  --a:    #38bdf8;    /* sky */
  --a2:   #818cf8;   /* indigo */
  --a3:   #34d399;   /* emerald */
  --ar:   #f87171;   /* red */

  --r:    12px;
  --rsm:  7px;
  --rlg:  18px;
  --rxl:  24px;

  --sh:  0 4px 32px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.035) inset;
  --shsm:0 2px 12px rgba(0,0,0,0.4);
  --T:   0.19s cubic-bezier(0.4,0,0.2,1);
}

[data-theme="light"] {
  --bg:      #f0f4fa;
  --bg-p:    #e8edf6;
  --bg-s:    rgba(255,255,255,0.92);
  --bg-i:    rgba(241,245,249,0.85);
  --bg-h:    rgba(14,165,233,0.055);

  --b:       rgba(0,0,0,0.08);
  --bhi:     rgba(14,165,233,0.32);
  --glow:    rgba(14,165,233,0.1);

  --t1: #0f172a;
  --t2: #475569;
  --t3: #94a3b8;

  --a:  #0ea5e9;
  --a2: #6366f1;
  --a3: #10b981;
  --ar: #ef4444;

  --sh:   0 4px 24px rgba(0,0,0,0.1), 0 1px 0 rgba(255,255,255,0.9) inset;
  --shsm: 0 2px 8px rgba(0,0,0,0.08);
}

/* ════════════════════════════════════════
   RESET
════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}

body{
  font-family:var(--f);
  background:var(--bg);
  color:var(--t1);
  height:100%;
  overflow:hidden;
  transition:background var(--T),color var(--T);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 65% 55% at 12% 8%,  rgba(56,189,248,0.05) 0%, transparent 58%),
    radial-gradient(ellipse 55% 50% at 88% 92%, rgba(129,140,248,0.04) 0%, transparent 55%);
  pointer-events:none;z-index:0;
}

/* ════════════════════════════════════════
   TOPBAR
════════════════════════════════════════ */
.topbar{
  position:fixed;top:0;left:0;right:0;
  height:52px;z-index:200;
  backdrop-filter:blur(28px) saturate(200%);
  -webkit-backdrop-filter:blur(28px) saturate(200%);
  background:rgba(7,9,15,0.78);
  border-bottom:1px solid var(--b);
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 20px;gap:12px;
}
[data-theme="light"] .topbar{background:rgba(240,244,250,0.85);}

.brand{display:flex;align-items:center;gap:9px;text-decoration:none;}
.brand-icon{
  width:30px;height:30px;
  background:linear-gradient(135deg,var(--a),var(--a2));
  border-radius:var(--rsm);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
  box-shadow:0 0 14px rgba(56,189,248,0.28);
}
.brand-name{font-size:14px;font-weight:800;letter-spacing:-.3px;color:var(--t1);}
.brand-name em{font-style:normal;color:var(--a);}

.tb-center{
  display:flex;align-items:center;gap:7px;
  font-family:var(--fm);font-size:10.5px;color:var(--t3);
}
.live-ring{
  width:7px;height:7px;border-radius:50%;
  background:var(--a3);animation:pulse 2s ease infinite;
  flex-shrink:0;
}
.tb-right{display:flex;align-items:center;gap:7px;}

.ib{
  width:34px;height:34px;border-radius:var(--rsm);
  background:var(--bg-i);border:1px solid var(--b);
  cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:15px;color:var(--t2);
  transition:all var(--T);flex-shrink:0;
}
.ib:hover{background:var(--bg-h);border-color:var(--bhi);color:var(--a);transform:scale(1.06);}

/* ════════════════════════════════════════
   APP SHELL
════════════════════════════════════════ */
.app{
  position:relative;z-index:1;
  display:grid;
  grid-template-columns:1fr 1.1fr;
  height:100vh;
  padding-top:52px;
  overflow:hidden;
}
@media(max-width:920px){
  body{overflow:auto;}
  .app{grid-template-columns:1fr;height:auto;overflow:visible;}
}

/* ════════════════════════════════════════
   LEFT PANEL (PASTE ONLY)
════════════════════════════════════════ */
.lp{
  background:var(--bg-p);
  border-right:1px solid var(--b);
  display:flex;flex-direction:column;
  padding:24px;
  gap:16px;
  overflow-y:auto;
}

.sec-label{
  font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--t3);
  display:flex;align-items:center;gap:8px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--b);}

.paste-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  background:var(--bg-s);
  border:1px solid var(--b);
  border-radius:var(--rlg);
  box-shadow:var(--sh);
  overflow:hidden;
  transition:border-color var(--T),box-shadow var(--T);
  backdrop-filter:blur(16px);
  min-height:380px;
}
.paste-wrap:focus-within{
  border-color:var(--bhi);
  box-shadow:var(--sh),0 0 0 3px var(--glow);
}
.paste-header{
  display:flex;align-items:center;gap:8px;
  padding:14px 16px;
  border-bottom:1px solid var(--b);
}
.paste-icon{
  width:24px;height:24px;
  background:linear-gradient(135deg,var(--a),var(--a2));
  border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;flex-shrink:0;
}
.paste-title{font-size:13px;font-weight:700;color:var(--t2);letter-spacing:-.1px;}

#rawInput{
  width:100%;
  flex:1;
  background:transparent;border:none;outline:none;resize:none;
  padding:18px;
  font-family:var(--fm);font-size:13.5px;font-weight:400;
  color:var(--t1);line-height:1.7;
  caret-color:var(--a);
}
#rawInput::placeholder{color:var(--t3);font-weight:300;}

.clr-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 14px;border-radius:var(--r);
  border:1px solid rgba(248,113,113,0.15);
  background:rgba(248,113,113,0.04);
  color:var(--ar);font-family:var(--f);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all var(--T);width:100%;
}
.clr-btn:hover{background:rgba(248,113,113,0.1);border-color:rgba(248,113,113,0.35);transform:translateY(-1px);}

/* ════════════════════════════════════════
   RIGHT PANEL (LIVE PREVIEW ONLY)
════════════════════════════════════════ */
.rp{
  overflow-y:auto;
  padding:24px 24px 100px;
  display:flex;flex-direction:column;gap:12px;
}

.email-card{
  background:var(--bg-s);
  border:1px solid var(--b);
  border-radius:var(--rxl);
  box-shadow:var(--sh);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  overflow:hidden;
  animation:fadeUp .3s ease both;
}

.email-chrome{
  background:linear-gradient(180deg,rgba(56,189,248,0.04) 0%,transparent 100%);
  border-bottom:1px solid var(--b);
  padding:12px 18px;
  display:flex;align-items:center;gap:8px;
}
.c-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.c-dot:nth-child(1){background:rgba(239,68,68,0.45);}
.c-dot:nth-child(2){background:rgba(251,191,36,0.45);}
.c-dot:nth-child(3){background:rgba(52,211,153,0.45);}
.c-bar{
  flex:1;height:24px;background:var(--bg-i);border:1px solid var(--b);
  border-radius:5px;display:flex;align-items:center;
  padding:0 10px;gap:5px;overflow:hidden;
}
.c-bar-t{font-family:var(--fm);font-size:9.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.email-meta{
  padding:14px 18px;
  display:flex;flex-direction:column;gap:8px;
  border-bottom:1px solid var(--b);
}

/* Row layouts */
.meta-row{
  display:flex;
  align-items:center;
  padding:6px 10px;
  border-radius:var(--r);
  cursor:pointer;
  transition:all var(--T);
  position:relative;
}
.meta-row:hover{background:var(--bg-h);}
.meta-row:hover .ch{opacity:1;transform:translateY(-50%) translateX(0);}

.meta-label{
  font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--t3);flex-shrink:0;width:42px;
}
.meta-val-text{
  font-size:13.5px;font-weight:700;color:var(--t1);
  text-transform:uppercase;letter-spacing:.03em;
}

/* Compact Chips */
.chips-wrap{display:flex;flex-wrap:wrap;gap:5px;flex:1;}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:100px;
  background:var(--bg-i);border:1px solid var(--b);
  font-family:var(--fm);font-size:11px;color:var(--t2);
  transition:all var(--T);
}
.chip-dot{width:4px;height:4px;border-radius:50%;background:var(--a);opacity:.6;}

/* Copy Hint Tooltip */
.ch{
  position:absolute;right:8px;top:50%;transform:translateY(-50%) translateX(6px);
  font-size:9.5px;font-family:var(--fm);color:var(--a);
  background:var(--bg-p);border:1px solid var(--bhi);
  border-radius:4px;padding:2px 7px;
  opacity:0;transition:all var(--T);pointer-events:none;white-space:nowrap;
}

/* ── Email Body Preview ── */
.email-body-wrap{padding:18px 20px 24px;}

.email-body{
  background:var(--bg-i);border:1px solid var(--b);
  border-radius:var(--rlg);
  padding:22px 24px;
  font-size:14.5px;line-height:1.8;color:var(--t1);
  cursor:pointer;transition:all var(--T);
  position:relative;overflow:hidden;
  min-height:280px;
}
.email-body:hover{border-color:var(--bhi);background:rgba(56,189,248,0.015);}
.email-body:hover::after{
  content:'⊕ Click anywhere to copy body';
  position:absolute;bottom:12px;right:14px;
  font-size:10px;font-family:var(--fm);color:var(--a);
  background:var(--bg-s);border:1px solid var(--bhi);
  padding:4px 10px;border-radius:5px;
}

/* Highlighted raw paste segment */
.pasted-block{
  margin:14px 0;
  padding:12px 16px;
  background:rgba(255, 255, 255, 0.025);
  border-left:3px solid var(--a2);
  border-radius:var(--rsm);
  font-family:var(--fm);
  font-size:13.5px;
  color:var(--t1);
  white-space:pre-wrap;
  word-break:break-all;
}
.placeholder-block{
  margin:14px 0;
  padding:12px 16px;
  background:rgba(255, 255, 255, 0.01);
  border-left:3px dashed var(--t3);
  border-radius:var(--rsm);
  font-family:var(--fm);
  font-size:13px;
  color:var(--t3);
  font-style:italic;
}

/* ════════════════════════════════════════
   FAB (COPY FULL EMAIL)
════════════════════════════════════════ */
.fab{
  position:fixed;bottom:24px;right:24px;z-index:300;
  display:flex;align-items:center;gap:9px;
  padding:12px 24px;
  background:linear-gradient(135deg,var(--a),var(--a2));
  border:none;border-radius:100px;cursor:pointer;
  font-family:var(--f);font-size:14px;font-weight:700;color:#fff;
  box-shadow:0 6px 24px rgba(56,189,248,0.35),0 2px 8px rgba(0,0,0,0.2);
  transition:all var(--T);white-space:nowrap;
}
.fab:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 32px rgba(56,189,248,0.45);}
.fab:active{transform:scale(0.98);}
.fab svg{width:15px;height:15px;flex-shrink:0;}

/* ════════════════════════════════════════
   TOASTS
════════════════════════════════════════ */
.toast-stack{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:500;display:flex;flex-direction:column-reverse;
  gap:7px;pointer-events:none;align-items:center;
}
.toast{
  display:flex;align-items:center;gap:9px;
  padding:10px 18px;
  background:var(--bg-s);border:1px solid var(--bhi);
  border-radius:100px;
  backdrop-filter:blur(24px);
  font-size:13px;font-weight:600;color:var(--t1);
  box-shadow:0 8px 28px rgba(0,0,0,0.42);
  animation:toastIn .3s cubic-bezier(0.34,1.56,0.64,1) both;
  white-space:nowrap;pointer-events:auto;
}
.toast.exit{animation:toastOut .2s ease forwards;}
.t-icon{font-size:14px;color:var(--a3);}

/* ════════════════════════════════════════
   KEYFRAMES
════════════════════════════════════════ */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
@keyframes toastIn{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.9) translateY(4px)}}
@keyframes flashGreen{0%{background:rgba(52,211,153,.15)}100%{background:transparent}}
.flash{animation:flashGreen .4s ease;}

/* ════════════════════════════════════════
   RESPONSIVE
════════════════════════════════════════ */
@media(max-width:920px){
  .app{grid-template-columns:1fr;height:auto;}
  .lp{border-right:none;border-bottom:1px solid var(--b);overflow:visible;}
  .rp{overflow:visible;padding-bottom:100px;}
  .tb-center{display:none;}
  .fab{bottom:16px;right:16px;padding:11px 20px;font-size:13px;}
}
@media(max-width:480px){
  .lp,.rp{padding:16px 14px;}
  .email-body{padding:18px 16px;font-size:13.5px;}
  .email-meta{padding:10px 14px;}
  .chip{font-size:10px;padding:2px 6px;}
}
</style>
</head>
<body>

<!-- ════ TOPBAR ════ -->
<header class="topbar">
  <div class="brand">
    <div class="brand-icon">📧</div>
    <span class="brand-name">EasyBet <em>Reset</em></span>
  </div>
  <div class="tb-center">
    <div class="live-ring"></div>
    Live Preview Active
  </div>
  <div class="tb-right">
    <button class="ib" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">☀️</button>
  </div>
</header>

<!-- ════ APP SHELL ════ -->
<div class="app">

  <!-- ══ LEFT PANEL (INPUT ONLY) ══ -->
  <div class="lp">
    <div class="sec-label">Paste Customer Raw Data</div>

    <div class="paste-wrap">
      <div class="paste-header">
        <div class="paste-icon">📋</div>
        <span class="paste-title">Manual Raw Input</span>
      </div>
      <textarea id="rawInput" placeholder="Paste customer details here exactly.
For example:

Xola Bunge | 5860687 |
Email: Xolabunge814@gmail.com
Phone: +27655794717

Every line is instantly copied directly into the preview template." spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
    </div>

    <button class="clr-btn" id="clearBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2"/></svg>
      Clear Everything
    </button>
  </div>

  <!-- ══ RIGHT PANEL (PREVIEW & METADATA) ══ -->
  <div class="rp">
    <div class="sec-label">Email Draft Preview</div>

    <div class="email-card">
      <!-- Simulated Chrome -->
      <div class="email-chrome">
        <div class="c-dot"></div><div class="c-dot"></div><div class="c-dot"></div>
        <div class="c-bar">
          <span style="font-size:9px;color:var(--t3);">🔒</span>
          <span class="c-bar-t">Draft Message — EasyBet Support</span>
        </div>
      </div>

      <!-- Quick Action Fields -->
      <div class="email-meta">
        <!-- Subject -->
        <div class="meta-row" id="subjectRow" role="button" tabindex="0" title="Click to copy subject">
          <div class="meta-label">Subject</div>
          <div class="meta-val-text">PASSWORD RESET</div>
          <div class="ch">copy subject</div>
        </div>

        <!-- TO Row -->
        <div class="meta-row" id="toRow" role="button" tabindex="0" title="Click to copy all TO emails">
          <div class="meta-label">To</div>
          <div class="chips-wrap" id="toChips"></div>
          <div class="ch">copy all to</div>
        </div>

        <!-- CC Row -->
        <div class="meta-row" id="ccRow" role="button" tabindex="0" title="Click to copy all CC emails">
          <div class="meta-label">Cc</div>
          <div class="chips-wrap" id="ccChips"></div>
          <div class="ch">copy all cc</div>
        </div>
      </div>

      <!-- Live Body Box -->
      <div class="email-body-wrap">
        <div class="email-body" id="emailBody" role="button" tabindex="0" title="Click to copy message body text">
          <!-- Populated in JS -->
        </div>
      </div>
    </div>
  </div>

</div>

<!-- floating action button -->
<button class="fab" id="fabBtn" title="Copy combined header metadata and message body">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <rect x="9" y="9" width="13" height="13" rx="2"/>
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
  </svg>
  Copy Full Email
</button>

<!-- dynamic toast notices -->
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ── Hardcoded Recipients ── */
const TO_EMAILS = ['milky.easybet@gmail.com', 'jaykee.easybet@gmail.com', 'reister.ebpty@gmail.com'];
const CC_EMAILS = ['shane@easybet.co.za', 'paolo.easybet@gmail.com'];

/* ── DOM Handles ── */
const $ = id => document.getElementById(id);
const rawInput = $('rawInput');
const clearBtn = $('clearBtn');
const themeBtn = $('themeBtn');
const subjectRow = $('subjectRow');
const toRow = $('toRow');
const ccRow = $('ccRow');
const toChips = $('toChips');
const ccChips = $('ccChips');
const emailBody = $('emailBody');
const fabBtn = $('fabBtn');
const toastStack = $('toastStack');

/* ── Localized Theme State ── */
let currentTheme = localStorage.getItem('eb-reset-theme') || 
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

function applyTheme(themeName) {
  document.documentElement.setAttribute('data-theme', themeName);
  themeBtn.textContent = themeName === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('eb-reset-theme', themeName);
  currentTheme = themeName;
}
applyTheme(currentTheme);
themeBtn.addEventListener('click', () => applyTheme(currentTheme === 'dark' ? 'light' : 'dark'));

/* ── Build Recipient Chips UI ── */
function populateChips(container, emails) {
  container.innerHTML = '';
  emails.forEach(email => {
    const el = document.createElement('span');
    el.className = 'chip';
    el.innerHTML = `<span class="chip-dot"></span>${email}`;
    el.addEventListener('click', e => {
      e.stopPropagation();
      copy(email, email);
    });
    container.appendChild(el);
  });
}
populateChips(toChips, TO_EMAILS);
populateChips(ccChips, CC_EMAILS);

/* ── Content Render Engine ── */
function render() {
  const pasteVal = rawInput.value;
  
  if (!pasteVal.trim()) {
    emailBody.innerHTML = `Hi Team,<br><br>
Hope you’re having a great shift.<br><br>
May I kindly request assistance with a password reset for the following customer:<br><br>
<div class="placeholder-block">[Pasted customer details will instantly output here exactly as entered]</div><br>
Thank you so much for your assistance.`;
  } else {
    const escapedPaste = esc(pasteVal);
    emailBody.innerHTML = `Hi Team,<br><br>
Hope you’re having a great shift.<br><br>
May I kindly request assistance with a password reset for the following customer:<br><br>
<div class="pasted-block">${escapedPaste}</div><br>
Thank you so much for your assistance.`;
  }
}

/* ── Generate Raw Plain Text for Clipboard ── */
function getPlainBody() {
  const pasted = rawInput.value.trim() || '[Pasted details]';
  return `Hi Team,\n\nHope you’re having a great shift.\n\nMay I kindly request assistance with a password reset for the following customer:\n\n${pasted}\n\nThank you so much for your assistance.`;
}

function getFullEmailForCopy() {
  return `Subject: PASSWORD RESET\n` +
         `To: ${TO_EMAILS.join(', ')}\n` +
         `CC: ${CC_EMAILS.join(', ')}\n\n` +
         `${getPlainBody()}`;
}

/* ── Listeners ── */
rawInput.addEventListener('input', () => {
  render();
  localStorage.setItem('eb-reset-raw', rawInput.value);
});

// Restore previous state if exists
const savedValue = localStorage.getItem('eb-reset-raw');
if (savedValue !== null) {
  rawInput.value = savedValue;
}
render();

// Clear Function
clearBtn.addEventListener('click', () => {
  rawInput.value = '';
  localStorage.removeItem('eb-reset-raw');
  render();
  toast('All text cleared', '🗑️');
  rawInput.focus();
});

/* ── Quick Copy Routines ── */
subjectRow.addEventListener('click', () => {
  copy('PASSWORD RESET', 'Subject');
  flash(subjectRow);
});

toRow.addEventListener('click', () => {
  copy(TO_EMAILS.join(', '), 'TO mailing list');
  flash(toRow);
});

ccRow.addEventListener('click', () => {
  copy(CC_EMAILS.join(', '), 'CC mailing list');
  flash(ccRow);
});

emailBody.addEventListener('click', () => {
  copy(getPlainBody(), 'Email message body');
  flash(emailBody);
});

fabBtn.addEventListener('click', () => {
  copy(getFullEmailForCopy(), 'Full email draft');
  flash(fabBtn);
});

/* ── Utilities ── */
async function copy(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    // fallback
    const t = document.createElement('textarea');
    t.value = text;
    t.style.position = 'fixed';
    t.style.opacity = '0';
    document.body.appendChild(t);
    t.select();
    document.execCommand('copy');
    document.body.removeChild(t);
  }
  toast(`Copied ${label}!`, '✅');
}

function flash(el) {
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

function toast(msg, icon='✅') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="t-icon">${icon}</span><span>${msg}</span>`;
  toastStack.appendChild(t);
  
  const dismiss = () => {
    t.classList.add('exit');
    t.addEventListener('animationend', () => t.remove(), { once: true });
  };
  
  setTimeout(dismiss, 2200);
  t.addEventListener('click', dismiss);
}

function esc(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

})();
